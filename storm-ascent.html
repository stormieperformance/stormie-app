<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<meta name="description" content="Storm Ascent — deliberate alpine climbing. Reach the summit. Stormie Games.">
<title>Storm Ascent — Stormie Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%;cursor:crosshair}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,14,28,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.panel.show{opacity:1;visibility:visible}
.panel h1{font-size:clamp(2.2rem,8vw,3.8rem);font-weight:800;letter-spacing:.04em;background:linear-gradient(160deg,#e8f4ff 0%,#a8c8e8 40%,#7eb8e0 70%,#c0e0f8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;margin-bottom:.15em;filter:drop-shadow(0 2px 12px rgba(120,180,240,.35))}
.panel .sub{color:#8aafc8;font-size:clamp(.75rem,2.5vw,.95rem);letter-spacing:.35em;text-transform:uppercase;margin-bottom:1.8em;font-weight:500}
.panel p{color:#b0c8d8;font-size:clamp(.85rem,2.8vw,1rem);max-width:340px;text-align:center;line-height:1.55;margin-bottom:1.4em}
.btn{pointer-events:auto;border:1px solid rgba(160,200,240,.35);background:linear-gradient(180deg,rgba(50,90,140,.55),rgba(25,50,90,.7));color:#e0f0ff;font-size:clamp(.95rem,3vw,1.1rem);font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:.85em 2.2em;border-radius:6px;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;margin:.35em;box-shadow:0 4px 20px rgba(40,80,140,.3),inset 0 1px 0 rgba(255,255,255,.12)}
.btn:hover,.btn:focus{background:linear-gradient(180deg,rgba(70,120,180,.65),rgba(35,70,120,.8));transform:translateY(-1px);box-shadow:0 6px 28px rgba(60,120,200,.4),inset 0 1px 0 rgba(255,255,255,.18);outline:none}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:rgba(140,180,220,.25);box-shadow:none;font-size:.8rem;letter-spacing:.08em;padding:.6em 1.4em}
.btn.ghost:hover{background:rgba(40,70,110,.4)}
.stats{color:#7a9ab0;font-size:.85rem;margin-top:1.2em;text-align:center;line-height:1.7}
.stats strong{color:#c8e0f0;font-weight:600}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transition:opacity .3s}
#hud.show{opacity:1}
.hud-left,.hud-right{display:flex;flex-direction:column;gap:6px}
.bar-wrap{width:min(160px,38vw)}
.bar-label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#8aacbf;margin-bottom:3px}
.bar-bg{height:8px;background:rgba(10,25,45,.7);border-radius:4px;overflow:hidden;border:1px solid rgba(100,140,180,.3)}
.bar-fill{height:100%;border-radius:3px;transition:width .1s linear;background:linear-gradient(90deg,#3a8ec8,#6ec8f0)}
.bar-fill.low{background:linear-gradient(90deg,#c85040,#e88050)}
.bar-fill.mid{background:linear-gradient(90deg,#c8a040,#e8d060)}
.timer{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:600;color:#d0e8f8;text-shadow:0 1px 6px rgba(0,0,0,.5);letter-spacing:.04em}
.alt{font-size:.7rem;color:#7a9ab0;letter-spacing:.1em}
.icon-btn{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(140,180,220,.3);background:rgba(15,30,55,.65);color:#a8c8e0;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.icon-btn:hover{background:rgba(40,70,120,.7)}
#hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(160,190,220,.7);font-size:clamp(.7rem,2.2vw,.85rem);letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .5s;padding:0 16px}
#hint.show{opacity:1}
.diff-row{display:flex;gap:8px;margin-bottom:1.2em;flex-wrap:wrap;justify-content:center}
.diff-btn{pointer-events:auto;border:1px solid rgba(140,180,220,.25);background:rgba(20,40,70,.5);color:#8aacbf;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:.5em 1.1em;border-radius:4px;cursor:pointer;transition:all .2s}
.diff-btn.active{border-color:rgba(160,210,255,.55);background:rgba(50,100,160,.55);color:#e0f0ff}
.brand{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));color:rgba(100,130,160,.5);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-left">
      <div class="bar-wrap">
        <div class="bar-label">Stamina</div>
        <div class="bar-bg"><div class="bar-fill" id="stamBar" style="width:100%"></div></div>
      </div>
      <div class="alt" id="altLabel">ALT 0m</div>
    </div>
    <div class="hud-right" style="align-items:flex-end">
      <div class="timer" id="timer">0:00.0</div>
      <button class="icon-btn" id="muteBtn" title="Mute" aria-label="Mute">♪</button>
    </div>
  </div>
  <div id="hint">Tap holds within reach · Arrows / WASD · Rest to recover</div>

  <div class="panel show" id="titlePanel">
    <h1>STORM ASCENT</h1>
    <div class="sub">Stormie Games</div>
    <p>Climb the face. Manage stamina. Survive the wind. Reach the summit.</p>
    <div class="diff-row">
      <button class="diff-btn active" data-d="normal" id="diffNormal">Normal</button>
      <button class="diff-btn" data-d="hard" id="diffHard">Hard Wind</button>
    </div>
    <button class="btn" id="playBtn">Begin Climb</button>
    <div class="stats" id="titleStats"></div>
    <div class="brand">stormie.app</div>
  </div>

  <div class="panel" id="fallPanel">
    <h1 style="font-size:clamp(1.8rem,6vw,2.8rem)">Fallen</h1>
    <div class="sub">The mountain remains</div>
    <p id="fallReason">You lost your grip.</p>
    <button class="btn" id="retryBtn">Try Again</button>
    <button class="btn ghost" id="fallMenuBtn">Title</button>
  </div>

  <div class="panel" id="summitPanel">
    <h1 style="font-size:clamp(1.8rem,6vw,2.8rem)">Summit</h1>
    <div class="sub">Above the storm</div>
    <p id="summitMsg">You stand above the clouds.</p>
    <div class="stats" id="summitStats"></div>
    <button class="btn" id="againBtn">Climb Again</button>
    <button class="btn ghost" id="summitMenuBtn">Title</button>
  </div>
</div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// ─── Constants ───
const MOUNTAIN_H = 5200;       // world height in px
const SUMMIT_Y = 180;          // summit plateau world-y
const HOLD_REACH = 95;
const STAMINA_MAX = 100;
const REST_RATE = 18;          // per second when still
const MOVE_COST_BASE = 12;
const CHECKPOINTS = [0.32, 0.62]; // fraction of climb (from base)
const BEST_KEY = 'stormAscent_bestTime';
const BEST_HARD_KEY = 'stormAscent_bestTimeHard';
const MUTE_KEY = 'stormAscent_mute';

// ─── State ───
let state = 'title'; // title | play | fall | summit
let difficulty = 'normal';
let muted = localStorage.getItem(MUTE_KEY) === '1';
let dpr = 1;
let camY = 0;
let shake = 0;
let time = 0;
let startTime = 0;
let animT = 0;
let windPhase = 0;
let lastWindGust = 0;
let windForce = 0; // current lateral push
let hintTimer = 0;
let particles = [];
let holds = [];
let ledges = [];
let climber = null;
let keys = {};
let lastMoveDir = null;
let moveCooldown = 0;
let checkpointIdx = -1;
let fallReason = '';
let summitCelebrate = 0;

// DOM
const hud = document.getElementById('hud');
const stamBar = document.getElementById('stamBar');
const timerEl = document.getElementById('timer');
const altLabel = document.getElementById('altLabel');
const hint = document.getElementById('hint');
const titlePanel = document.getElementById('titlePanel');
const fallPanel = document.getElementById('fallPanel');
const summitPanel = document.getElementById('summitPanel');
const titleStats = document.getElementById('titleStats');
const muteBtn = document.getElementById('muteBtn');

// ─── Audio (WebAudio) ───
let ac = null;
function ensureAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume();
}
function tone(freq, dur, type, vol, slide){
  if(muted || !ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
  g.gain.setValueAtTime(vol||0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur, vol){
  if(muted || !ac) return;
  const n = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
  const d = n.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(d.length*0.3));
  const s = ac.createBufferSource();
  s.buffer = n;
  const g = ac.createGain();
  const f = ac.createBiquadFilter();
  f.type='bandpass'; f.frequency.value=400+Math.random()*600;
  g.gain.value = vol||0.04;
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start();
}
function sfxGrab(){ tone(180+Math.random()*40, 0.08, 'triangle', 0.07, 90); }
function sfxSlip(){ tone(120, 0.2, 'sawtooth', 0.05, 40); noiseBurst(0.25, 0.03); }
function sfxFall(){ tone(200, 0.5, 'sine', 0.06, 40); noiseBurst(0.4, 0.05); }
function sfxSummit(){ tone(330,0.15,'sine',0.07); setTimeout(()=>tone(415,0.15,'sine',0.07),120); setTimeout(()=>tone(523,0.35,'sine',0.08),240); }
function sfxCheckpoint(){ tone(440,0.12,'triangle',0.05); setTimeout(()=>tone(660,0.18,'triangle',0.05),100); }
function sfxWind(){ noiseBurst(0.6+Math.random()*0.4, 0.025+Math.random()*0.02); }

// ─── Helpers ───
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function fmtTime(ms){
  const s = ms/1000;
  const m = Math.floor(s/60);
  const sec = (s%60).toFixed(1);
  return m+':'+(sec<10?'0':'')+sec;
}
function getBest(){
  const k = difficulty==='hard'?BEST_HARD_KEY:BEST_KEY;
  const v = localStorage.getItem(k);
  return v?parseFloat(v):null;
}
function setBest(ms){
  const k = difficulty==='hard'?BEST_HARD_KEY:BEST_KEY;
  const cur = getBest();
  if(cur===null || ms<cur){ localStorage.setItem(k, String(ms)); return true; }
  return false;
}
function updateTitleStats(){
  const bn = localStorage.getItem(BEST_KEY);
  const bh = localStorage.getItem(BEST_HARD_KEY);
  let t = '';
  if(bn) t += 'Best (Normal): <strong>'+fmtTime(parseFloat(bn))+'</strong>';
  if(bh) t += (t?'<br>':'')+'Best (Hard): <strong>'+fmtTime(parseFloat(bh))+'</strong>';
  if(!t) t = 'No ascents recorded yet';
  titleStats.innerHTML = t;
}
function showPanel(id){
  [titlePanel,fallPanel,summitPanel].forEach(p=>p.classList.remove('show'));
  if(id) document.getElementById(id).classList.add('show');
  hud.classList.toggle('show', id===null);
}

// ─── World generation ───
function seededRand(seed){
  let s = seed|0;
  return function(){
    s = (s*1664525+1013904223)|0;
    return (s>>>0)/4294967296;
  };
}

function generateWorld(){
  const rand = seededRand(42);
  holds = [];
  ledges = [];

  // Base ledge
  ledges.push({ y: MOUNTAIN_H - 40, w: 220, label: 'Base Camp' });

  // Checkpoints as ledges
  CHECKPOINTS.forEach((frac,i)=>{
    const climbH = MOUNTAIN_H - SUMMIT_Y;
    const y = MOUNTAIN_H - 40 - frac*climbH;
    ledges.push({ y, w: 160, label: i===0?'Mid Ledge':'High Camp', cp:i });
  });

  // Summit ledge
  ledges.push({ y: SUMMIT_Y, w: 280, label: 'Summit', summit:true });

  // Generate holds in bands from base up to summit
  const baseY = MOUNTAIN_H - 80;
  const topY = SUMMIT_Y + 60;
  let y = baseY;
  let lane = 0; // zig-zag bias
  while(y > topY){
    const alt = 1 - (y - topY)/(baseY - topY);
    const density = lerp(1.0, 0.72, alt); // slightly fewer holds higher
    const spread = lerp(70, 95, alt);
    const cx = W()*0.5 + Math.sin(lane*0.7)*spread*0.6 + (rand()-0.5)*40;
    const n = Math.max(2, Math.round(3*density + rand()));
    for(let i=0;i<n;i++){
      const hx = cx + (i-(n-1)/2)*spread*0.55 + (rand()-0.5)*28;
      const hy = y + (rand()-0.5)*22;
      const type = rand()<0.12?'ice':(rand()<0.18?'crimp':'jug');
      // Avoid placing on ledges
      let onLedge = false;
      for(const L of ledges){
        if(Math.abs(hy-L.y)<30 && Math.abs(hx-W()*0.5)<L.w*0.5+20) onLedge=true;
      }
      if(!onLedge && hx>40 && hx<W()-40){
        holds.push({
          x: hx, y: hy, type,
          r: type==='jug'?11:type==='ice'?8:7,
          cost: type==='jug'?1:type==='ice'?1.45:1.25,
          id: holds.length
        });
      }
    }
    y -= lerp(48, 58, alt) + rand()*18;
    lane++;
  }

  // Ensure connectivity: add holds near ledges (including approach to summit)
  for(const L of ledges){
    for(let i=-1;i<=1;i++){
      holds.push({
        x: W()*0.5 + i*55 + (rand()-0.5)*10,
        y: L.y - 45 - Math.abs(i)*15,
        type:'jug', r:11, cost:1, id:holds.length
      });
    }
    if(L.summit){
      // Stepping stones up to summit plateau
      for(let k=0;k<4;k++){
        holds.push({
          x: W()*0.5 + (k%2===0?-35:35) + (rand()-0.5)*12,
          y: L.y + 35 + k*42,
          type:'jug', r:11, cost:1, id:holds.length
        });
      }
    } else {
      // Holds just above each non-summit ledge for leaving
      for(let i=-1;i<=1;i++){
        holds.push({
          x: W()*0.5 + i*48 + (rand()-0.5)*8,
          y: L.y + 40 + Math.abs(i)*12,
          type:'jug', r:10, cost:1, id:holds.length
        });
      }
    }
  }

  // Bridge vertical gaps that exceed reach
  holds.sort((a,b)=>b.y-a.y);
  const bridged = holds.slice();
  for(let i=0;i<bridged.length-1;i++){
    const a = bridged[i], b = bridged[i+1];
    const gap = a.y - b.y;
    const horiz = Math.abs(a.x - b.x);
    if(gap > HOLD_REACH*0.85 || (gap > 55 && horiz > HOLD_REACH*0.7)){
      const midY = (a.y + b.y)/2;
      const midX = (a.x + b.x)/2 + (rand()-0.5)*20;
      holds.push({
        x: clamp(midX, 50, W()-50),
        y: midY,
        type:'jug', r:10, cost:1, id:holds.length
      });
    }
  }
}

// ─── Climber ───
function makeClimber(startY){
  return {
    x: W()*0.5,
    y: startY,
    targetX: W()*0.5,
    targetY: startY,
    handX: W()*0.5,
    handY: startY - 20,
    stamina: STAMINA_MAX,
    resting: false,
    moving: false,
    moveT: 0,
    moveDur: 0.28,
    fromX:0, fromY:0,
    holdId: -1,
    onLedge: true,
    facing: 1,
    limbPhase: 0,
    slip: 0,
    alive: true,
    vx: 0
  };
}

function startClimb(){
  ensureAudio();
  generateWorld();
  const startY = MOUNTAIN_H - 60;
  climber = makeClimber(startY);
  camY = climber.y - H()*0.65;
  time = 0;
  startTime = performance.now();
  animT = 0;
  windPhase = 0;
  windForce = 0;
  lastWindGust = 0;
  shake = 0;
  checkpointIdx = -1;
  particles = [];
  moveCooldown = 0;
  hintTimer = 5;
  summitCelebrate = 0;
  state = 'play';
  showPanel(null);
  hint.classList.add('show');
  spawnSnow(40);
}

function restartFromCheckpoint(){
  ensureAudio();
  let startY = MOUNTAIN_H - 60;
  if(checkpointIdx >= 0 && ledges[checkpointIdx+1]){
    startY = ledges[checkpointIdx+1].y - 10;
  }
  climber = makeClimber(startY);
  climber.stamina = STAMINA_MAX * 0.85;
  camY = climber.y - H()*0.65;
  // Keep elapsed time running from original start — fairer to reset timer from CP
  startTime = performance.now() - time*1000;
  windForce = 0;
  shake = 0;
  particles = [];
  moveCooldown = 0;
  state = 'play';
  showPanel(null);
  spawnSnow(20);
}

function triggerFall(reason){
  if(state!=='play') return;
  state = 'fall';
  fallReason = reason||'You lost your grip.';
  document.getElementById('fallReason').textContent = fallReason;
  sfxFall();
  shake = 12;
  showPanel('fallPanel');
}

function triggerSummit(){
  if(state!=='play') return;
  state = 'summit';
  const ms = time*1000;
  const isNew = setBest(ms);
  const best = getBest();
  document.getElementById('summitMsg').textContent =
    difficulty==='hard' ? 'Through the hardest winds — you made it.' : 'You stand above the clouds.';
  document.getElementById('summitStats').innerHTML =
    'Time: <strong>'+fmtTime(ms)+'</strong>'+
    (isNew?' <strong style="color:#8ef0b0">NEW BEST!</strong>':'')+
    '<br>Best: <strong>'+fmtTime(best)+'</strong>'+
    (difficulty==='hard'?' · Hard Wind':'');
  sfxSummit();
  summitCelebrate = 1;
  showPanel('summitPanel');
}

// ─── Input ───
function screenToWorld(sx, sy){
  return { x: sx, y: sy + camY };
}

function holdsInReach(cx, cy){
  return holds.filter(h=>{
    const dx = h.x - cx, dy = h.y - cy;
    const dist = Math.hypot(dx,dy);
    return dist > 8 && dist <= HOLD_REACH;
  }).sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy));
}

function tryClimbTo(hx, hy, hold){
  if(!climber || climber.moving || state!=='play') return false;
  const dx = hx - climber.x, dy = hy - climber.y;
  const dist = Math.hypot(dx,dy);
  if(dist > HOLD_REACH+8 || dist < 5) return false;

  const costMul = hold ? hold.cost : 1.15;
  const rush = climber.stamina < 30 ? 1.3 : 1;
  const distCost = (dist/HOLD_REACH) * MOVE_COST_BASE * costMul * rush;
  const windPenalty = Math.abs(windForce) > 0.3 ? 1.2 : 1;
  const cost = distCost * windPenalty * (difficulty==='hard'?1.15:1);

  if(climber.stamina < cost*0.55){
    // Slip attempt
    climber.stamina = Math.max(0, climber.stamina - cost*0.4);
    climber.slip = 1;
    shake = 6;
    sfxSlip();
    if(climber.stamina < 5){
      triggerFall('Exhausted — your arms gave out.');
      return false;
    }
    return false;
  }

  climber.stamina -= cost;
  climber.fromX = climber.x;
  climber.fromY = climber.y;
  climber.targetX = hx;
  climber.targetY = hy;
  climber.moving = true;
  climber.moveT = 0;
  climber.moveDur = clamp(0.18 + dist/HOLD_REACH*0.18, 0.18, 0.4);
  climber.facing = dx>=0?1:-1;
  climber.onLedge = false;
  climber.holdId = hold ? hold.id : -1;
  climber.resting = false;
  sfxGrab();

  // Wind slip chance on ice / high wind
  if(hold && hold.type==='ice' && Math.abs(windForce)>0.5 && Math.random()<0.15*(difficulty==='hard'?2:1)){
    setTimeout(()=>{
      if(state==='play' && climber && climber.holdId===hold.id){
        climber.slip = 1;
        shake = 5;
        sfxSlip();
        climber.stamina -= 8;
      }
    }, climber.moveDur*1000+50);
  }
  return true;
}

function tryDirectional(dir){
  // dir: {x,y} normalized preference
  if(!climber || climber.moving || moveCooldown>0) return;
  const reach = holdsInReach(climber.x, climber.y);
  // Also allow ledge targets
  const targets = reach.map(h=>({x:h.x,y:h.y,hold:h,score:0}));
  for(const L of ledges){
    const lx = W()*0.5;
    const ly = L.y - 8;
    const dist = Math.hypot(lx-climber.x, ly-climber.y);
    if(dist>8 && dist<=HOLD_REACH+20){
      targets.push({x:lx,y:ly,hold:null,ledge:L,score:0});
    }
  }
  if(!targets.length) return;

  for(const t of targets){
    const dx = t.x-climber.x, dy = t.y-climber.y;
    const dist = Math.hypot(dx,dy)||1;
    const ndx = dx/dist, ndy = dy/dist;
    const align = ndx*dir.x + ndy*dir.y;
    t.score = align*2 - dist/HOLD_REACH;
    // Prefer upward when dir is up
    if(dir.y < -0.3 && dy < 0) t.score += 0.5;
  }
  targets.sort((a,b)=>b.score-a.score);
  if(targets[0].score < -0.2) return;
  const best = targets[0];
  tryClimbTo(best.x, best.y, best.hold||null);
  moveCooldown = 0.15;
}

function onPointer(sx, sy){
  if(state!=='play' || !climber) return;
  const w = screenToWorld(sx, sy);
  // Find nearest hold to tap
  let best = null, bestD = 50;
  for(const h of holds){
    const d = Math.hypot(h.x-w.x, h.y-w.y);
    if(d < bestD){ bestD=d; best=h; }
  }
  // Check ledge tap
  for(const L of ledges){
    if(Math.abs(w.y - (L.y-8)) < 40 && Math.abs(w.x - W()*0.5) < L.w*0.5+30){
      const dist = Math.hypot(W()*0.5-climber.x, (L.y-8)-climber.y);
      if(dist <= HOLD_REACH+25){
        tryClimbTo(W()*0.5, L.y-8, null);
        return;
      }
    }
  }
  if(best){
    const dist = Math.hypot(best.x-climber.x, best.y-climber.y);
    if(dist <= HOLD_REACH+10){
      tryClimbTo(best.x, best.y, best);
    } else {
      // Flash hint — out of reach
      shake = 2;
    }
  }
}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  onPointer(e.clientX-rect.left, e.clientY-rect.top);
},{passive:false});

window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='KeyM'){ toggleMute(); return; }
  if(state!=='play') return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)){
    e.preventDefault();
  }
  if(e.code==='Space'){ if(climber) climber.resting = true; return; }
  let dir = null;
  if(e.code==='ArrowUp'||e.code==='KeyW') dir={x:0,y:-1};
  else if(e.code==='ArrowDown'||e.code==='KeyS') dir={x:0,y:1};
  else if(e.code==='ArrowLeft'||e.code==='KeyA') dir={x:-1,y:0};
  else if(e.code==='ArrowRight'||e.code==='KeyD') dir={x:1,y:0};
  if(dir) tryDirectional(dir);
});
window.addEventListener('keyup', e=>{
  keys[e.code]=false;
  if(e.code==='Space' && climber) climber.resting=false;
});

// ─── Particles ───
function spawnSnow(n){
  for(let i=0;i<n;i++){
    particles.push({
      x: Math.random()*W(),
      y: camY + Math.random()*H(),
      vx: -20-Math.random()*40,
      vy: 30+Math.random()*50,
      r: 0.8+Math.random()*2,
      life: 1,
      type: 'snow'
    });
  }
}
function spawnGust(x,y){
  for(let i=0;i<8;i++){
    particles.push({
      x: x+(Math.random()-0.5)*40,
      y: y+(Math.random()-0.5)*30,
      vx: -80-Math.random()*120,
      vy: (Math.random()-0.5)*40,
      r: 1+Math.random()*2.5,
      life: 0.6+Math.random()*0.5,
      type: 'gust'
    });
  }
}

// ─── Update ───
function update(dt){
  animT += dt;
  if(state==='title'){
    camY = Math.max(0, MOUNTAIN_H*0.55 - Math.sin(animT*0.15)*80 - H()*0.5);
    if(particles.length<60) spawnSnow(2);
    updateParticles(dt);
    return;
  }
  if(state==='summit'){
    summitCelebrate += dt;
    if(climber){
      camY = lerp(camY, climber.y - H()*0.55, 1-Math.pow(0.01,dt));
    }
    updateParticles(dt);
    if(particles.length<80) spawnSnow(3);
    return;
  }
  if(state==='fall'){
    updateParticles(dt);
    shake = Math.max(0, shake-dt*20);
    return;
  }
  if(state!=='play' || !climber) return;

  time = (performance.now()-startTime)/1000;
  hintTimer -= dt;
  if(hintTimer<=0) hint.classList.remove('show');
  moveCooldown = Math.max(0, moveCooldown-dt);
  shake = Math.max(0, shake-dt*25);
  if(climber.slip>0) climber.slip = Math.max(0, climber.slip-dt*3);

  // Altitude 0..1
  const climbH = MOUNTAIN_H - SUMMIT_Y;
  const alt = clamp(1 - (climber.y - SUMMIT_Y)/climbH, 0, 1);

  // Wind
  windPhase += dt;
  const windBase = alt * alt * (difficulty==='hard'?1.4:1);
  const gustInterval = difficulty==='hard'? 2.8 : 4.2;
  if(time - lastWindGust > gustInterval + Math.random()*2){
    lastWindGust = time;
    windForce = (Math.random()>0.5?1:-1) * (0.4 + windBase*0.9 + Math.random()*0.4);
    sfxWind();
    spawnGust(climber.x, climber.y);
    // High wind + low stamina = risk
    if(Math.abs(windForce)>0.85 && climber.stamina<25 && !climber.onLedge && Math.random()<0.35){
      climber.slip = 1;
      shake = 8;
      sfxSlip();
      climber.stamina -= 10;
      if(climber.stamina<=0){
        triggerFall('A gust tore you from the wall.');
        return;
      }
    }
  }
  windForce *= Math.pow(0.15, dt); // decay
  if(!climber.moving && !climber.onLedge){
    climber.vx = windForce * 25 * (difficulty==='hard'?1.3:1);
    climber.x += climber.vx * dt;
    // Soft bounds
    climber.x = clamp(climber.x, 50, W()-50);
  }

  // Movement lerp
  if(climber.moving){
    climber.moveT += dt / climber.moveDur;
    const t = clamp(climber.moveT, 0, 1);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    climber.x = lerp(climber.fromX, climber.targetX, ease);
    climber.y = lerp(climber.fromY, climber.targetY, ease);
    climber.limbPhase += dt*8;
    climber.handX = lerp(climber.fromX, climber.targetX, clamp(ease*1.3,0,1));
    climber.handY = lerp(climber.fromY-18, climber.targetY-18, clamp(ease*1.3,0,1));
    if(t>=1){
      climber.moving = false;
      climber.x = climber.targetX;
      climber.y = climber.targetY;
      // Check ledge / summit / checkpoint
      checkLanding();
    }
  } else {
    climber.handX = lerp(climber.handX, climber.x + climber.facing*6, 1-Math.pow(0.001,dt));
    climber.handY = lerp(climber.handY, climber.y - 20, 1-Math.pow(0.001,dt));
  }

  // Stamina
  if(climber.resting || climber.onLedge){
    const rate = climber.onLedge ? REST_RATE*1.6 : REST_RATE;
    climber.stamina = Math.min(STAMINA_MAX, climber.stamina + rate*dt);
  } else if(!climber.moving){
    // Slow drain while hanging
    climber.stamina = Math.max(0, climber.stamina - 3.5*dt*(1+alt*0.5));
    if(climber.stamina<=0){
      triggerFall('Your strength failed on the wall.');
      return;
    }
  }

  // Camera
  const targetCam = climber.y - H()*0.62;
  camY = lerp(camY, targetCam, 1-Math.pow(0.02,dt));
  camY = clamp(camY, 0, MOUNTAIN_H - H());

  // Particles
  if(particles.length < 50+alt*40) spawnSnow(1);
  updateParticles(dt);

  // HUD
  const pct = climber.stamina/STAMINA_MAX*100;
  stamBar.style.width = pct+'%';
  stamBar.className = 'bar-fill'+(pct<25?' low':pct<50?' mid':'');
  timerEl.textContent = fmtTime(time*1000);
  altLabel.textContent = 'ALT '+Math.round(alt*2847)+'m';
}

function checkLanding(){
  for(let i=0;i<ledges.length;i++){
    const L = ledges[i];
    if(Math.abs(climber.y - (L.y-8)) < 25 && Math.abs(climber.x - W()*0.5) < L.w*0.5+20){
      climber.onLedge = true;
      climber.y = L.y - 8;
      climber.x = clamp(climber.x, W()*0.5-L.w*0.4, W()*0.5+L.w*0.4);
      if(L.summit){
        triggerSummit();
        return;
      }
      if(L.cp!==undefined && L.cp > checkpointIdx){
        checkpointIdx = L.cp;
        sfxCheckpoint();
        // Brief flash via shake
        shake = 3;
      }
      return;
    }
  }
}

function updateParticles(dt){
  const alt = climber ? clamp(1-(climber.y-SUMMIT_Y)/(MOUNTAIN_H-SUMMIT_Y),0,1) : 0.3;
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += (p.vx + windForce*60) * dt;
    p.y += p.vy * dt;
    p.life -= dt*0.15;
    if(p.type==='gust') p.life -= dt*0.8;
    // Wrap
    if(p.x < -10) p.x = W()+10;
    if(p.x > W()+10) p.x = -10;
    if(p.y > camY+H()+20){ p.y = camY-10; p.x = Math.random()*W(); }
    if(p.y < camY-20){ p.y = camY+H()+10; }
    if(p.life<=0) particles.splice(i,1);
  }
}

// ─── Draw ───
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // Logical size helpers use CSS pixels
  Object.defineProperty(canvas, '_lw', {get:()=>window.innerWidth, configurable:true});
  Object.defineProperty(canvas, '_lh', {get:()=>window.innerHeight, configurable:true});
}
function W(){ return window.innerWidth; }
function H(){ return window.innerHeight; }

function draw(){
  const w = W(), h = H();
  const shx = (Math.random()-0.5)*shake;
  const shy = (Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(shx, shy);

  // Sky gradient by altitude of camera
  const camAlt = clamp(1 - (camY+h*0.5 - SUMMIT_Y)/(MOUNTAIN_H-SUMMIT_Y), 0, 1);
  const sky = ctx.createLinearGradient(0,0,0,h);
  if(state==='summit' || camAlt>0.85){
    sky.addColorStop(0, '#1a3a6a');
    sky.addColorStop(0.35, '#3a6a9a');
    sky.addColorStop(0.6, '#7a9fc0');
    sky.addColorStop(1, '#c8d8e8');
  } else {
    sky.addColorStop(0, lerpColor('#061020','#152848', camAlt));
    sky.addColorStop(0.45, lerpColor('#0a1a30','#2a4a70', camAlt));
    sky.addColorStop(1, lerpColor('#1a3048','#5a7a98', camAlt));
  }
  ctx.fillStyle = sky;
  ctx.fillRect(-10,-10,w+20,h+20);

  // Distant peaks (parallax)
  drawDistantPeaks(w, h, camAlt);

  // Clouds / fog bands
  drawFog(w, h, camAlt);

  // Summit sun glow
  if(camAlt > 0.7 || state==='summit'){
    const glow = (camAlt-0.7)/0.3;
    const g = ctx.createRadialGradient(w*0.7, h*0.15, 10, w*0.7, h*0.15, 180);
    g.addColorStop(0, `rgba(255,240,200,${0.35*glow + (state==='summit'?0.25:0)})`);
    g.addColorStop(0.4, `rgba(255,200,140,${0.12*glow})`);
    g.addColorStop(1, 'rgba(255,180,100,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
  }

  // Mountain face
  drawMountain(w, h);

  // Ledges
  for(const L of ledges) drawLedge(L, w);

  // Holds
  drawHolds(w, h);

  // Climber
  if(climber) drawClimber();

  // Particles
  drawParticles();

  // Height fog overlay near top of view when low
  if(camAlt < 0.5){
    const fog = ctx.createLinearGradient(0,0,0,h*0.3);
    fog.addColorStop(0, `rgba(180,200,220,${0.08*(1-camAlt*2)})`);
    fog.addColorStop(1, 'rgba(180,200,220,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0,0,w,h*0.3);
  }

  // Wind indicator streaks
  if(Math.abs(windForce)>0.2 && state==='play'){
    ctx.strokeStyle = `rgba(200,220,240,${Math.abs(windForce)*0.25})`;
    ctx.lineWidth = 1;
    for(let i=0;i<6;i++){
      const yy = (animT*80 + i*h/6) % h;
      const xx = w*0.2 + i*w*0.12;
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.lineTo(xx - windForce*40, yy+8);
      ctx.stroke();
    }
  }

  ctx.restore();

  // Title ambient climber silhouette
  if(state==='title'){
    // subtle vignette
    const vig = ctx.createRadialGradient(w/2,h/2,h*0.2,w/2,h/2,h*0.8);
    vig.addColorStop(0,'rgba(0,0,0,0)');
    vig.addColorStop(1,'rgba(4,10,20,0.55)');
    ctx.fillStyle = vig;
    ctx.fillRect(0,0,w,h);
  }
}

function lerpColor(a,b,t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const ar=(pa>>16)&255, ag=(pa>>8)&255, ab=pa&255;
  const br=(pb>>16)&255, bg=(pb>>8)&255, bb=pb&255;
  const r=Math.round(lerp(ar,br,t)), g=Math.round(lerp(ag,bg,t)), bl=Math.round(lerp(ab,bb,t));
  return `rgb(${r},${g},${bl})`;
}

function drawDistantPeaks(w,h,camAlt){
  const par = camY * 0.15;
  ctx.fillStyle = `rgba(30,50,75,${0.5+camAlt*0.2})`;
  ctx.beginPath();
  ctx.moveTo(-50, h);
  for(let i=0;i<8;i++){
    const px = (i/7)*w*1.2 - 40;
    const py = h*0.35 + Math.sin(i*1.7)*40 + Math.cos(i)*25 - par*0.02;
    ctx.lineTo(px, py);
  }
  ctx.lineTo(w+50, h);
  ctx.fill();

  ctx.fillStyle = `rgba(40,65,95,${0.4+camAlt*0.15})`;
  ctx.beginPath();
  ctx.moveTo(-50, h);
  for(let i=0;i<10;i++){
    const px = (i/9)*w*1.3 - 60 + 30;
    const py = h*0.48 + Math.sin(i*2.1+1)*35 - par*0.05;
    ctx.lineTo(px, py);
  }
  ctx.lineTo(w+50, h);
  ctx.fill();
}

function drawFog(w,h,camAlt){
  const par = camY * 0.3;
  for(let i=0;i<4;i++){
    const fy = ((i*400 - par*0.5) % (h+200)) - 50;
    const alpha = 0.04 + i*0.015;
    ctx.fillStyle = `rgba(190,210,230,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(w*(0.2+i*0.2), fy, 120+i*30, 28, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawMountain(w,h){
  // Rock face — vertical slab with variation
  const faceL = w*0.18;
  const faceR = w*0.82;
  const topY = SUMMIT_Y - camY;
  const botY = MOUNTAIN_H - camY;

  // Main rock body
  const rockGrad = ctx.createLinearGradient(faceL,0,faceR,0);
  rockGrad.addColorStop(0, '#2a3545');
  rockGrad.addColorStop(0.3, '#3a4558');
  rockGrad.addColorStop(0.5, '#454e60');
  rockGrad.addColorStop(0.7, '#3a4558');
  rockGrad.addColorStop(1, '#2a3545');

  ctx.fillStyle = rockGrad;
  ctx.beginPath();
  ctx.moveTo(faceL-20, botY+100);
  // Left edge jagged
  for(let y = MOUNTAIN_H; y >= SUMMIT_Y-50; y -= 40){
    const jx = faceL + Math.sin(y*0.03)*18 + Math.cos(y*0.017)*12;
    ctx.lineTo(jx, y - camY);
  }
  // Summit top
  ctx.lineTo(w*0.35, topY-30);
  ctx.lineTo(w*0.5, topY-55);
  ctx.lineTo(w*0.65, topY-30);
  // Right edge
  for(let y = SUMMIT_Y-50; y <= MOUNTAIN_H; y += 40){
    const jx = faceR - Math.sin(y*0.028)*16 - Math.cos(y*0.019)*10;
    ctx.lineTo(jx, y - camY);
  }
  ctx.closePath();
  ctx.fill();

  // Rock texture strokes
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(faceL-20, botY+100);
  for(let y = MOUNTAIN_H; y >= SUMMIT_Y-50; y -= 40){
    ctx.lineTo(faceL + Math.sin(y*0.03)*18, y-camY);
  }
  ctx.lineTo(w*0.35, topY-30);
  ctx.lineTo(w*0.5, topY-55);
  ctx.lineTo(w*0.65, topY-30);
  for(let y = SUMMIT_Y-50; y <= MOUNTAIN_H; y += 40){
    ctx.lineTo(faceR - Math.sin(y*0.028)*16, y-camY);
  }
  ctx.closePath();
  ctx.clip();

  ctx.strokeStyle = 'rgba(20,28,38,0.35)';
  ctx.lineWidth = 1;
  for(let y = Math.floor(camY/60)*60; y < camY+h+60; y += 60){
    const sy = y - camY;
    ctx.beginPath();
    ctx.moveTo(faceL, sy);
    for(let x = faceL; x < faceR; x += 30){
      ctx.lineTo(x+15, sy + Math.sin(x*0.05+y*0.02)*4);
    }
    ctx.stroke();
  }
  // Crack lines
  ctx.strokeStyle = 'rgba(15,20,30,0.4)';
  for(let i=0;i<12;i++){
    const cx = faceL + ((i*97+40)%(faceR-faceL));
    const cy0 = ((i*313)%MOUNTAIN_H);
    if(cy0 < camY-50 || cy0 > camY+h+50) continue;
    ctx.beginPath();
    ctx.moveTo(cx, cy0-camY);
    ctx.lineTo(cx + Math.sin(i)*20, cy0-camY+80+i*5);
    ctx.stroke();
  }

  // Ice patches higher up
  const climbH = MOUNTAIN_H - SUMMIT_Y;
  for(let i=0;i<8;i++){
    const iy = SUMMIT_Y + climbH*(0.1 + i*0.08);
    if(iy < camY-40 || iy > camY+h+40) continue;
    const ix = w*0.35 + (i%3)*w*0.12;
    ctx.fillStyle = 'rgba(180,210,230,0.15)';
    ctx.beginPath();
    ctx.ellipse(ix, iy-camY, 25+i*3, 10, 0.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  // Snow cap near summit
  ctx.fillStyle = 'rgba(230,240,250,0.85)';
  ctx.beginPath();
  ctx.moveTo(w*0.32, topY-10);
  ctx.lineTo(w*0.5, topY-58);
  ctx.lineTo(w*0.68, topY-10);
  ctx.lineTo(w*0.62, topY+20);
  ctx.lineTo(w*0.5, topY+5);
  ctx.lineTo(w*0.38, topY+20);
  ctx.closePath();
  ctx.fill();
}

function drawLedge(L, w){
  const sy = L.y - camY;
  if(sy < -60 || sy > H()+60) return;
  const lx = w*0.5 - L.w/2;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(lx+4, sy+4, L.w, 14);
  // Snow/rock ledge
  const lg = ctx.createLinearGradient(0,sy-4,0,sy+16);
  lg.addColorStop(0, L.summit?'#f0f6ff':'#d0dce8');
  lg.addColorStop(0.5, '#a8b8c8');
  lg.addColorStop(1, '#6a7888');
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.moveTo(lx, sy);
  ctx.lineTo(lx+L.w, sy);
  ctx.lineTo(lx+L.w-8, sy+14);
  ctx.lineTo(lx+8, sy+14);
  ctx.closePath();
  ctx.fill();
  // Label
  if(L.label && Math.abs(sy - H()*0.5) < H()*0.6){
    ctx.font = '600 11px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(200,220,240,0.55)';
    ctx.textAlign = 'center';
    ctx.fillText(L.label.toUpperCase(), w*0.5, sy - 10);
  }
  // Checkpoint flag
  if(L.cp!==undefined){
    ctx.fillStyle = checkpointIdx >= L.cp ? '#6ec8a0' : '#c8a060';
    ctx.fillRect(lx+L.w-18, sy-28, 3, 28);
    ctx.beginPath();
    ctx.moveTo(lx+L.w-15, sy-28);
    ctx.lineTo(lx+L.w-2, sy-22);
    ctx.lineTo(lx+L.w-15, sy-16);
    ctx.fill();
  }
}

function drawHolds(w,h){
  if(!climber) return;
  const reach = state==='play' ? holdsInReach(climber.x, climber.y) : [];
  const reachIds = new Set(reach.map(hh=>hh.id));

  for(const hold of holds){
    const sy = hold.y - camY;
    if(sy < -20 || sy > h+20) continue;
    const inReach = reachIds.has(hold.id);
    const colors = {
      jug: inReach ? '#8ec8e8' : '#5a7080',
      crimp: inReach ? '#c8b070' : '#6a6050',
      ice: inReach ? '#b0e0f8' : '#608090'
    };
    ctx.beginPath();
    if(hold.type==='crimp'){
      ctx.rect(hold.x-hold.r, hold.y-camY-hold.r*0.5, hold.r*2, hold.r);
    } else {
      ctx.arc(hold.x, hold.y-camY, hold.r, 0, Math.PI*2);
    }
    ctx.fillStyle = colors[hold.type]||colors.jug;
    ctx.fill();
    if(inReach){
      ctx.strokeStyle = 'rgba(180,220,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // Pulse ring
      const pulse = 0.5 + Math.sin(animT*4)*0.5;
      ctx.strokeStyle = `rgba(160,210,255,${0.25*pulse})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(hold.x, hold.y-camY, hold.r+4+pulse*3, 0, Math.PI*2);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.arc(hold.x+1, hold.y-camY+1, hold.r*0.6, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Reach circle (subtle)
  if(state==='play' && !climber.moving){
    ctx.strokeStyle = 'rgba(140,180,220,0.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,6]);
    ctx.beginPath();
    ctx.arc(climber.x, climber.y-camY, HOLD_REACH, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawClimber(){
  const x = climber.x;
  const y = climber.y - camY;
  const f = climber.facing;
  const slipOff = climber.slip * Math.sin(animT*30)*3;

  ctx.save();
  ctx.translate(x + slipOff, y);

  // Rope (decorative)
  if(!climber.onLedge){
    ctx.strokeStyle = 'rgba(180,140,80,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(f*-20, 30, f*-10, 70);
    ctx.stroke();
  }

  // Body
  const bodyCol = '#d8e4f0';
  const suitCol = '#2a5080';

  // Legs
  ctx.strokeStyle = suitCol;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  const legSwing = climber.moving ? Math.sin(climber.limbPhase)*8 : 0;
  ctx.beginPath();
  ctx.moveTo(-3, 2);
  ctx.lineTo(-5+legSwing*0.3, 16);
  ctx.moveTo(3, 2);
  ctx.lineTo(5-legSwing*0.3, 16);
  ctx.stroke();

  // Boots
  ctx.fillStyle = '#1a2838';
  ctx.beginPath();
  ctx.ellipse(-5+legSwing*0.3, 17, 4, 2.5, 0, 0, Math.PI*2);
  ctx.ellipse(5-legSwing*0.3, 17, 4, 2.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Torso
  ctx.fillStyle = suitCol;
  ctx.beginPath();
  ctx.moveTo(-7, -2);
  ctx.lineTo(7, -2);
  ctx.lineTo(6, 8);
  ctx.lineTo(-6, 8);
  ctx.closePath();
  ctx.fill();
  // Pack
  ctx.fillStyle = '#1a3858';
  ctx.fillRect(-5, -1, 5, 8);

  // Arms reaching to hand
  const hx = climber.handX - climber.x;
  const hy = climber.handY - climber.y;
  ctx.strokeStyle = suitCol;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(f*5, -4);
  ctx.quadraticCurveTo(f*12, hy*0.5-4, hx, hy);
  ctx.stroke();
  // Other arm
  ctx.beginPath();
  ctx.moveTo(f*-4, -2);
  ctx.lineTo(f*-8 + (climber.moving?Math.sin(climber.limbPhase+1)*6:0), 4);
  ctx.stroke();

  // Head
  ctx.fillStyle = '#e8d8c8';
  ctx.beginPath();
  ctx.arc(0, -12, 6, 0, Math.PI*2);
  ctx.fill();
  // Helmet
  ctx.fillStyle = '#c85030';
  ctx.beginPath();
  ctx.arc(0, -13, 6.5, Math.PI*1.05, Math.PI*1.95);
  ctx.fill();
  ctx.fillStyle = '#e86038';
  ctx.fillRect(-6.5, -14, 13, 3);

  // Gloves at hand
  ctx.fillStyle = '#c84030';
  ctx.beginPath();
  ctx.arc(hx, hy, 3.5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();

  // Resting indicator
  if(climber.resting && state==='play'){
    ctx.fillStyle = 'rgba(140,200,240,0.5)';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('z', x+14, y-24 + Math.sin(animT*2)*2);
    ctx.fillText('z', x+20, y-32 + Math.sin(animT*2+1)*2);
  }
}

function drawParticles(){
  for(const p of particles){
    const sy = p.y - camY;
    if(sy<-10||sy>H()+10) continue;
    if(p.type==='gust'){
      ctx.fillStyle = `rgba(200,220,240,${p.life*0.35})`;
      ctx.fillRect(p.x, sy, p.r*3, p.r*0.6);
    } else {
      ctx.fillStyle = `rgba(230,240,250,${0.4+p.life*0.4})`;
      ctx.beginPath();
      ctx.arc(p.x, sy, p.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// ─── Loop ───
let lastTs = 0;
function frame(ts){
  const dt = Math.min(0.05, (ts - (lastTs||ts))/1000);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ─── UI bindings ───
function toggleMute(){
  muted = !muted;
  localStorage.setItem(MUTE_KEY, muted?'1':'0');
  muteBtn.textContent = muted ? 'MUTE' : '♪';
  muteBtn.style.fontSize = muted ? '0.55rem' : '0.9rem';
  ensureAudio();
}
muteBtn.textContent = muted ? 'MUTE' : '♪';
muteBtn.style.fontSize = muted ? '0.55rem' : '0.9rem';
muteBtn.addEventListener('click', toggleMute);

document.getElementById('playBtn').addEventListener('click', ()=>{ startClimb(); });
document.getElementById('retryBtn').addEventListener('click', ()=>{
  if(checkpointIdx>=0) restartFromCheckpoint();
  else startClimb();
});
document.getElementById('againBtn').addEventListener('click', ()=> startClimb());
document.getElementById('fallMenuBtn').addEventListener('click', ()=>{
  state='title'; showPanel('titlePanel'); updateTitleStats();
});
document.getElementById('summitMenuBtn').addEventListener('click', ()=>{
  state='title'; showPanel('titlePanel'); updateTitleStats();
});

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.d;
    updateTitleStats();
  });
});

window.addEventListener('resize', ()=>{
  resize();
  if(holds.length && state!=='title'){
    // Regenerate hold x positions roughly centered — full regen on resize mid-game is ok-ish
  }
});

// Init
resize();
generateWorld();
updateTitleStats();
showPanel('titlePanel');
requestAnimationFrame(frame);

})();
</script>
