<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>STORM ASCENT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      background: #05070b;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top, #1e3448 0%, #05070b 70%);
    }

    .ui {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .title {
      font-size: 14px;
      letter-spacing: 3px;
      font-weight: 800;
      opacity: 0.9;
    }

    .bar-wrap {
      margin-top: 10px;
      width: 180px;
      height: 10px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }

    .bar {
      height: 100%;
      width: 100%;
      background: white;
      transition: width 0.12s linear;
    }

    .hint {
      position: fixed;
      bottom: 22px;
      left: 18px;
      right: 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.85;
      z-index: 10;
      pointer-events: none;
    }

    .restart {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 1px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="ui">
    <div class="title">STORM ASCENT</div>
    <div class="bar-wrap"><div class="bar" id="staminaBar"></div></div>
  </div>

  <button class="restart" id="restartBtn">RESTART</button>

  <div class="hint" id="hint">
    Tap holds to climb. Stay close enough. Stamina drains while hanging.
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const staminaBar = document.getElementById("staminaBar");
    const hint = document.getElementById("hint");
    const restartBtn = document.getElementById("restartBtn");

    let W, H, dpr;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    let player, holds, particles, cameraY, gameOver, won, windTime, lastTime;

    function reset() {
      player = {
        x: W * 0.5,
        y: H - 90,
        targetX: W * 0.5,
        targetY: H - 90,
        reach: 125,
        stamina: 100,
        maxStamina: 100,
        falling: false,
        fallSpeed: 0,
        attachedHold: null
      };

      cameraY = 0;
      gameOver = false;
      won = false;
      windTime = 0;
      lastTime = performance.now();
      restartBtn.style.display = "none";
      hint.textContent = "Tap holds to climb. Stay close enough. Stamina drains while hanging.";

      particles = [];
      holds = [];

      generateHolds();
      loop(lastTime);
    }

    function generateHolds() {
      holds = [];

      const wallTop = -2600;
      const wallBottom = H - 40;
      let y = wallBottom;

      while (y > wallTop) {
        const count = Math.random() < 0.55 ? 2 : 3;

        for (let i = 0; i < count; i++) {
          const x = W * 0.22 + Math.random() * W * 0.56;
          holds.push({
            x,
            y: y + Math.random() * 55,
            r: 12 + Math.random() * 12,
            used: false,
            icy: Math.random() < 0.18
          });
        }

        y -= 105 + Math.random() * 55;
      }

      holds.push({ x: W * 0.5, y: wallBottom, r: 25, used: false, icy: false });
    }

    function worldToScreenY(y) {
      return y - cameraY;
    }

    function screenToWorldY(y) {
      return y + cameraY;
    }

    function distance(a, b, c, d) {
      return Math.hypot(a - c, b - d);
    }

    function tap(x, y) {
      if (gameOver || won) return;

      const wy = screenToWorldY(y);
      let best = null;
      let bestDist = Infinity;

      for (const hold of holds) {
        const sy = worldToScreenY(hold.y);
        const tapDist = distance(x, y, hold.x, sy);
        const reachDist = distance(player.x, player.y, hold.x, hold.y);

        if (tapDist < hold.r + 28 && reachDist < player.reach && reachDist < bestDist) {
          best = hold;
          bestDist = reachDist;
        }
      }

      if (best) {
        player.targetX = best.x;
        player.targetY = best.y;
        player.attachedHold = best;
        best.used = true;

        if (best.icy && Math.random() < 0.22) {
          player.stamina -= 16;
          hint.textContent = "Icy hold. Bad grip.";
        } else {
          player.stamina = Math.min(player.maxStamina, player.stamina + 4);
          hint.textContent = "Good move.";
        }
      } else {
        player.stamina -= 7;
        hint.textContent = "Too far. Find a closer hold.";
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      tap(e.clientX - rect.left, e.clientY - rect.top);
    });

    restartBtn.addEventListener("click", reset);

    function update(dt) {
      if (gameOver || won) return;

      windTime += dt;

      player.x += (player.targetX - player.x) * Math.min(1, dt * 7);
      player.y += (player.targetY - player.y) * Math.min(1, dt * 7);

      const climbingSpeed = Math.abs(player.targetY - player.y);
      player.stamina -= dt * (2.4 + climbingSpeed * 0.015);

      if (Math.sin(windTime * 1.7) > 0.72) {
        player.stamina -= dt * 3.5;
      }

      if (player.stamina <= 0) {
        player.falling = true;
      }

      if (player.falling) {
        player.fallSpeed += 900 * dt;
        player.y += player.fallSpeed * dt;

        if (worldToScreenY(player.y) > H + 120) {
          gameOver = true;
          restartBtn.style.display = "block";
          hint.textContent = "You fell. Restart and climb cleaner.";
        }
      }

      const desiredCamera = player.y - H * 0.62;
      cameraY += (desiredCamera - cameraY) * Math.min(1, dt * 3);

      if (player.y < -2450) {
        won = true;
        restartBtn.style.display = "block";
        hint.textContent = "Summit reached. This is the core prototype.";
      }

      for (let i = 0; i < 4; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: -80 - Math.random() * 150,
          vy: 80 + Math.random() * 220,
          life: 1
        });
      }

      particles = particles.filter(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 0.7;
        return p.life > 0 && p.x > -60 && p.y < H + 60;
      });

      staminaBar.style.width = Math.max(0, player.stamina) + "%";
    }

    function drawBackground() {
      const grd = ctx.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, "#20384d");
      grd.addColorStop(0.55, "#09111b");
      grd.addColorStop(1, "#030407");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "rgba(255,255,255,0.04)";
      for (let i = 0; i < 80; i++) {
        const x = (i * 97) % W;
        const y = ((i * 193) % H + cameraY * 0.15) % H;
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function drawWall() {
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.beginPath();
      ctx.moveTo(W * 0.15, H);
      ctx.lineTo(W * 0.28, 0);
      ctx.lineTo(W * 0.72, 0);
      ctx.lineTo(W * 0.86, H);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;

      for (let i = 0; i < 18; i++) {
        const x = W * 0.2 + i * W * 0.035;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + Math.sin(i) * 40, H);
        ctx.stroke();
      }
    }

    function drawHolds() {
      for (const hold of holds) {
        const y = worldToScreenY(hold.y);
        if (y < -60 || y > H + 60) continue;

        ctx.beginPath();
        ctx.fillStyle = hold.icy ? "rgba(180,230,255,0.9)" : "rgba(230,235,240,0.9)";
        ctx.arc(hold.x, y, hold.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = hold.used ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.25)";
        ctx.lineWidth = hold.used ? 3 : 1;
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const sx = player.x;
      const sy = worldToScreenY(player.y);

      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(sx, sy - 12);
      ctx.lineTo(sx - 22, sy + 22);
      ctx.moveTo(sx, sy - 12);
      ctx.lineTo(sx + 22, sy + 22);
      ctx.moveTo(sx, sy + 14);
      ctx.lineTo(sx - 18, sy + 50);
      ctx.moveTo(sx, sy + 14);
      ctx.lineTo(sx + 18, sy + 50);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(sx, sy - 26, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.16)";
      ctx.beginPath();
      ctx.arc(sx, sy, player.reach, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticles() {
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 1;

      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 16, p.y - 8);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
    }

    function drawEndText() {
      if (!gameOver && !won) return;

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.fillStyle = "white";
      ctx.font = "800 34px system-ui";
      ctx.fillText(won ? "SUMMIT" : "FALL", W / 2, H / 2 - 20);

      ctx.font = "14px system-ui";
      ctx.fillText(won ? "You reached the top." : "Grip failed in the storm.", W / 2, H / 2 + 16);
    }

    function render() {
      drawBackground();
      drawWall();
      drawHolds();
      drawPlayer();
      drawParticles();
      drawEndText();
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      update(dt);
      render();

      if (!gameOver && !won) {
        requestAnimationFrame(loop);
      }
    }

    reset();
  </script>
</body>
</html>
