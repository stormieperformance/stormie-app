    }

    buildStairUp(w, h, wallH) {
        const sx = 55, sy = h - 80;
        const sg = this.add.graphics().setDepth(sy - 1);
        sg.fillStyle(0x2a2030, 1); sg.fillCircle(sx, sy, 32);
        sg.fillStyle(0x3a3048, 1); sg.fillCircle(sx, sy, 26);
        sg.fillStyle(0x14101a, 1); sg.fillCircle(sx, sy, 10);
        sg.lineStyle(2, 0x4a3a60, 1);
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            sg.lineBetween(sx, sy, sx + Math.cos(ang) * 26, sy + Math.sin(ang) * 26);
        }
        this.add.text(sx, sy - 42, "▲ Floor I", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "11px",
            color: "#6a5a80", stroke: "#000", strokeThickness: 2
        }).setOrigin(0.5).setDepth(sy + 1);
        this.add.image(sx, sy, "glow").setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0x8a7aaa).setScale(1.4).setAlpha(0.25).setDepth(sy - 2);
        this.stairUpX = sx; this.stairUpY = sy;
    }

    buildStairToFloor3(w, h, wallH) {
        const sx = w - 55, sy = h - 90;
        const sg = this.add.graphics().setDepth(sy - 1);
        sg.fillStyle(0x2a1010, 1); sg.fillCircle(sx, sy, 32);
        sg.fillStyle(0x3a1828, 1); sg.fillCircle(sx, sy, 26);
        sg.fillStyle(0x14080c, 1); sg.fillCircle(sx, sy, 10);
        sg.lineStyle(2, 0x6a2040, 1);
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            sg.lineBetween(sx, sy, sx + Math.cos(ang) * 26, sy + Math.sin(ang) * 26);
        }
        this.floor3Stair = this.add.text(sx, sy - 42, "▼ Floor III — Locked", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "11px",
            color: "#8a1a1a", stroke: "#000", strokeThickness: 2
        }).setOrigin(0.5).setDepth(sy + 1);
        this.floor3StairGlow = this.add.image(sx, sy, "glow")
            .setBlendMode(Phaser.BlendModes.ADD).setTint(0x8a1a1a).setScale(1.4).setAlpha(0.2).setDepth(sy - 2);
        this.stairF3X = sx; this.stairF3Y = sy;
        this.floor3Locked = true;
    }

    spawnClues(w, h) {
        const clueData = [
            { x: w * 0.35, y: h * 0.55, key: "page", label: "Torn diary page",
              msg: "Night 47 — the change accelerates. Silver binds him. Use the key on the lower door.",
              color: 0xd9c79a },
            { x: w * 0.68, y: h * 0.38, key: "vial", label: "Blood vial",
              msg: "A vial of silver-infused blood, still warm. Cold iron fills the air.",
              color: 0xff6666 },
            { x: w * 0.22, y: h * 0.73, key: "key", label: "Silver key",
              msg: "A heavy silver key, engraved: FOR WHOEVER COMES AFTER. Floor III is open.",
              color: 0xe0e0ff },
        ];
        clueData.forEach(cd => {
            const glow = this.add.image(cd.x, cd.y, "glow")
                .setBlendMode(Phaser.BlendModes.ADD).setTint(cd.color).setScale(0.7).setAlpha(0.6).setDepth(cd.y - 0.5);
            this.tweens.add({ targets: glow, scale: { from: 0.6, to: 0.9 }, alpha: { from: 0.4, to: 0.8 }, duration: 1200, yoyo: true, repeat: -1 });

            // Floating icon
            const icon = this.add.text(cd.x, cd.y - 18, "✦", {
                fontFamily: "serif", fontSize: "20px", color: "#" + cd.color.toString(16).padStart(6, "0"),
                stroke: "#000", strokeThickness: 3
            }).setOrigin(0.5).setDepth(cd.y + 1).setAlpha(0.9);
            this.tweens.add({ targets: icon, y: icon.y - 5, duration: 1000, yoyo: true, repeat: -1 });

            const item = { x: cd.x, y: cd.y, glow, icon, key: cd.key, label: cd.label, msg: cd.msg, collected: false };
            this.clueItems.push(item);
        });
    }

    tryCollectClue() {
        if (this.currentFloor !== 2) return;
        const px = this.player.x, py = this.player.y;
        for (const item of this.clueItems) {
            if (item.collected) continue;
            const d = Phaser.Math.Distance.Between(px, py, item.x, item.y);
            if (d < 44) {
                item.collected = true;
                item.glow.destroy();
                item.icon.destroy();
                this.cluesFound++;
                this.scene.get("ui").events.emit("cine_line", item.msg);
                playChime(520, 1.4, 0.06);
                this.clueCounter.setText(`Clues found: ${this.cluesFound} / ${this.cluesNeeded}`);
                if (this.cluesFound >= this.cluesNeeded) {
                    this.time.delayedCall(1800, () => this.unlockFloor3());
                }
                return;
            }
        }
        // Check stair up
        if (Phaser.Math.Distance.Between(px, py, this.stairUpX, this.stairUpY) < 36) {
            this.ascendToFloor1();
        }
        // Check stair to floor 3
        if (!this.floor3Locked && Phaser.Math.Distance.Between(px, py, this.stairF3X, this.stairF3Y) < 36) {
            this.descendToFloor3();
        }
    }

    unlockFloor3() {
        this.floor3Locked = false;
        this.floor3Stair.setText("▼ Descend to Floor III").setColor("#9fe6df");
        this.floor3StairGlow.setTint(0x9fe6df);
        this.tweens.add({ targets: this.floor3StairGlow, alpha: { from: 0.2, to: 0.65 }, duration: 900, yoyo: true, repeat: -1 });
        playChime(330, 2.4, 0.08);
        this.scene.get("ui").events.emit("cine_line", "All clues found. The way to Floor III is open. The beast stirs below.");
    }

    ascendToFloor1() {
        this.cameras.main.fadeOut(600, 0, 0, 0);
        this.time.delayedCall(650, () => {
            this.currentFloor = 1;
            this.buildFloor1(this.scale.width, this.scale.height);
            this.unlockStairDown(); // already defeated vampire
            this.cameras.main.fadeIn(600, 0, 0, 0);
        });
    }

    // ─── FLOOR 3 ─────────────────────────────────────────────────────────────
    buildFloor3(w, h) {
        this.currentFloor = 3;
        this.children.list
            .filter(c => c !== this.player && c !== this.banner && c !== this.joyBase && c !== this.joyKnob && c !== this.btnCast)
            .forEach(c => { try { c.destroy(); } catch {} });

        // Dungeon floor — raw stone, darker
        const floor = this.add.graphics().setDepth(0);
        floor.fillStyle(0x0a0608, 1); floor.fillRect(0, 0, w, h);
        floor.fillStyle(0x110e16, 1);
        for (let y = 0; y < h; y += 20) for (let x = 0; x < w; x += 30) {
            if ((x + y) % 40 < 20) floor.fillRect(x, y, 28, 18);
        }
        floor.lineStyle(1, 0x050308, 0.8);
        for (let y = 0; y < h; y += 20) floor.lineBetween(0, y, w, y);
        for (let x = 0; x < w; x += 30) floor.lineBetween(x, 0, x, h);

        // More blood
        this.addBloodTrails(floor, w, h);

        const wallH = Math.min(60, Math.round(h * 0.14));
        const walls = this.add.graphics().setDepth(2);
        walls.fillStyle(0x05030a, 1); walls.fillRect(0, 0, w, wallH);
        walls.fillStyle(0x0e0c16, 1);
        for (let y = 0; y < wallH; y += 8) for (let x = 0; x < w; x += 18) {
            walls.fillRect(x + (((y / 8) | 0) & 1 ? 9 : 0), y, 17, 7);
        }

        // Moon window — cracked
        const mx = w / 2, my = wallH / 2;
        walls.fillStyle(0x06040c, 1); walls.fillCircle(mx, my, 22);
        walls.fillStyle(0xfff5d6, 0.4); walls.fillCircle(mx, my, 18);
        walls.lineStyle(1, 0x3a2a10, 1);
        walls.lineBetween(mx - 18, my - 5, mx + 18, my + 8);
        walls.lineBetween(mx + 2, my - 18, mx - 4, my + 18);
        this.add.image(mx, my + 50, "glow").setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0xfff5d6).setScale(2.5).setAlpha(0.25).setDepth(1);

        // Werewolf den decorations
        this.addFloor3Decorations(w, h, wallH);

        this.arena = { x: 20, y: wallH + 20, w: w - 40, h: h - wallH - 40 };
        this.player.setPosition(w / 2, this.arena.y + this.arena.h - 20).setDepth(this.arena.y + this.arena.h);

        this.showBanner("FLOOR III — THE WOLF'S DEN", 2400);
        this.time.delayedCall(1200, () => {
            this.scene.get("ui").events.emit("cine_line", "Claw marks. Shredded clothes. The full moon beats through stone.");
        });
        this.time.delayedCall(4000, () => {
            this.scene.get("ui").events.emit("cine_fadeout");
            this.beginWerewolf();
        });
    }

    addFloor3Decorations(w, h, wallH) {
        const g = this.add.graphics().setDepth(3);

        // Claw marks on walls
        [[w * 0.2, wallH + 10], [w * 0.6, wallH + 6], [w * 0.85, wallH + 14]].forEach(([x, y]) => {
            g.lineStyle(2, 0x3a1a10, 0.9);
            for (let c2 = 0; c2 < 4; c2++) {
                g.lineBetween(x + c2 * 4, y, x + c2 * 4 - 6, y + 22);
            }
        });

        // Torn clothing scraps
        g.fillStyle(0x2a1a10, 0.9);
        [[w * 0.3, h * 0.35], [w * 0.65, h * 0.52], [w * 0.15, h * 0.7]].forEach(([x, y]) => {
            g.fillRect(x - 8, y - 4, 16, 4);
            g.fillRect(x - 6, y, 6, 8);
            g.fillRect(x + 2, y + 2, 5, 6);
        });

        // Bones scattered
        g.fillStyle(0xe5dec2, 0.8);
        [[w * 0.4, h * 0.6], [w * 0.7, h * 0.4], [w * 0.25, h * 0.5]].forEach(([x, y]) => {
            g.fillRect(x - 10, y, 20, 3);
            g.fillCircle(x - 10, y + 1, 4);
            g.fillCircle(x + 10, y + 1, 4);
        });

        // Iron cage (empty)
        const cageX = w * 0.15, cageY = h * 0.45;
        g.lineStyle(2, 0x2a2030, 1);
        g.strokeRect(cageX - 18, cageY - 26, 36, 42);
        for (let bar = 0; bar < 5; bar++) {
            g.lineBetween(cageX - 16 + bar * 8, cageY - 24, cageX - 16 + bar * 8, cageY + 14);
        }
        g.fillStyle(0x3a3048, 1); g.fillRect(cageX - 20, cageY - 28, 40, 4); // top bar
        g.fillStyle(0x1a0808, 0.6); g.fillRect(cageX - 12, cageY + 4, 24, 12); // shadow inside

        // Chains on floor
        g.fillStyle(0x2a2040, 1);
        [[w * 0.55, h * 0.72], [w * 0.8, h * 0.65]].forEach(([cx, cy]) => {
            for (let lnk = 0; lnk < 8; lnk++) {
                g.fillRect(cx + lnk * 6, cy, 4, 3);
                g.fillRect(cx + lnk * 6 + 2, cy + 2, 2, 5);
            }
        });

        // Barrels
        [[w * 0.88, h * 0.45], [w * 0.82, h * 0.53]].forEach(([bx, by]) => {
            g.fillStyle(0x1a0f06, 1); g.fillRoundedRect(bx - 10, by - 18, 20, 28, 3);
            g.fillStyle(0x3a2a10, 0.6); g.fillRect(bx - 10, by - 10, 20, 2);
            g.fillRect(bx - 10, by + 2, 20, 2);
            g.fillStyle(0x5a0808, 0.5); g.fillRect(bx - 6, by + 8, 12, 2); // blood stain
        });
    }

    // ─── ENCOUNTERS ──────────────────────────────────────────────────────────
    beginSpiders() {
        this.stage = "spiders";
        this.showBanner("Skitter… something stirs in the webs.", 1800);
        if (!this.anims.exists("spider_walk")) {
            this.anims.create({ key: "spider_walk", frames: [{ key: "spider_0" }, { key: "spider_1" }], frameRate: 8, repeat: -1 });
        }
        for (let i = 0; i < 4; i++) this.time.delayedCall(300 + i * 600, () => this.spawnSpider());
    }

    spawnSpider() {
        const w = this.scale.width, fromLeft = Math.random() < 0.5;
        const x = fromLeft ? -20 : w + 20;
        const y = this.arena.y + 30 + Math.random() * (this.arena.h - 60);
        const spr = this.add.sprite(x, y, "spider_0").setOrigin(0.5, 0.5).setScale(2.2).setDepth(y);
        spr.play("spider_walk");
        if (!fromLeft) spr.setFlipX(true);
        this.spiders.push({ spr, hp: 2, alive: true });
    }

    beginVampire() {
        this.stage = "vampire";
        if (!this.anims.exists("vampire_idle")) {
            this.anims.create({ key: "vampire_idle", frames: [{ key: "vampire_0" }, { key: "vampire_1" }], frameRate: 3, repeat: -1 });
        }
        const w = this.scale.width;
        this.vampire = this.add.sprite(w / 2, this.arena.y + 60, "vampire_0")
            .setOrigin(0.5, 0).setScale(2.4).setDepth(this.arena.y + 100).setAlpha(0);
        this.vampire.play("vampire_idle");
        this.vampireHp = 5;
        this.tweens.add({ targets: this.vampire, alpha: 1, duration: 900 });
        this.showBanner("LORD VYRIN, master of the tower", 2200);
        this.time.delayedCall(700, () => this.scene.get("ui").events.emit("dialogue", {
            name: "Lord Vyrin",
            lines: ["A little hearthwitch climbs my tower? How charming.", "My pet sleeps below — and you shall not wake him.", "Come, then. Show me your candles and salt."]
        }));
        if (this.bossMusic) this.bossMusic.stop();
        this.bossMusic = startBossMusic(0.12);
    }

    beginWerewolf() {
        this.stage = "wolfIntro";
        if (!this.anims.exists("wolf_full_walk")) {
            this.anims.create({ key: "wolf_full_walk", frames: [{ key: "wolf_full_0" }, { key: "wolf_full_1" }], frameRate: 8, repeat: -1 });
        }
        const w = this.scale.width;
        this.werewolf = this.add.sprite(w / 2, this.arena.y + 80, "wolf_human")
            .setOrigin(0.5, 0).setScale(2.4).setDepth(this.arena.y + this.arena.h + 5);
        this.wolfHp = 100; this.wolfPhase = 1;
        this.showBanner("THE PROFESSOR — the moon is full.", 2400);
        this.time.delayedCall(700, () => this.scene.get("ui").events.emit("dialogue", {
            name: "Prof. Lyall",
            lines: ["You found the clues. You know what I am.", "The moon — gods, the moon —", "Use the silver. NOW. RUUUUN."]
        }));
        this.time.delayedCall(5000, () => { this.stage = "wolf"; });
        if (this.bossMusic) this.bossMusic.stop();
        this.bossMusic = startBossMusic(0.16);
    }

    castWand() {
        if (this.castCd > 0 || this.mana < 10) return;
        this.castCd = 280;
        this.mana = Math.max(0, this.mana - 10);
        this.scene.get("ui").events.emit("mana", this.mana);
        const ax = this.aim.x, ay = this.aim.y;
        const m = Math.hypot(ax, ay) || 1;
        const nx = ax / m, ny = ay / m;
        const px = this.player.x + nx * 14, py = this.player.y - 22 + ny * 14;
        const spr = this.add.image(px, py, "glow")
            .setBlendMode(Phaser.BlendModes.ADD).setTint(0xc9a25b).setScale(0.35).setDepth(this.player.depth + 1);
        this.bullets.push({ spr, vx: nx * 9, vy: ny * 9, alive: true });
    }

    hurtPlayer(amt) {
        if (this.damageCd > 0) return;
        this.damageCd = 600;
        this.hp = Math.max(0, this.hp - amt);
        this.scene.get("ui").events.emit("hp", this.hp);
        this.cameras.main.shake(180, 0.006);
        this.player.setTint(0xff5050);
        this.time.delayedCall(180, () => this.player.clearTint());
        if (this.hp <= 0) this.gameOver();
    }

    gameOver() {
        if (this.stage === "won") return;
        this.stage = "won";
        if (this.bossMusic) { this.bossMusic.stop(); this.bossMusic = null; }
        this.cameras.main.fadeOut(1200, 0, 0, 0);
        this.time.delayedCall(1300, () => {
            this.showGameOverScreen();
        });
    }

    showGameOverScreen() {
        const w = this.scale.width, h = this.scale.height;
        // Dim overlay
        const dim = this.add.rectangle(0, 0, w, h, 0x000000, 0.85).setOrigin(0).setDepth(20000).setScrollFactor(0);
        // Panel
        const pw = Math.min(w - 40, 380), ph = 280;
        const panel = this.add.rectangle(w / 2, h / 2, pw, ph, 0x1a0f2e, 0.97)
            .setStrokeStyle(2, 0x8a1a1a).setDepth(20001).setScrollFactor(0);
        this.add.rectangle(w / 2, h / 2, pw - 8, ph - 8, 0, 0)
            .setStrokeStyle(1, 0x5a1a1a, 0.5).setDepth(20001).setScrollFactor(0);

        this.add.text(w / 2, h / 2 - 90, "✦  THE HOLLOW TAKES YOU  ✦", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "18px",
            color: "#8a1a1a", stroke: "#000", strokeThickness: 3
        }).setOrigin(0.5).setDepth(20002).setScrollFactor(0);

        this.add.text(w / 2, h / 2 - 48, "The witch falls. But the night remembers.", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "13px",
            color: "#c9a25b", stroke: "#000", strokeThickness: 2
        }).setOrigin(0.5).setDepth(20002).setScrollFactor(0);

        // Retry button
        const retryBg = this.add.rectangle(w / 2, h / 2 + 20, 200, 40, 0x2a1740, 0.95)
            .setStrokeStyle(2, 0xc9a84c).setDepth(20003).setScrollFactor(0).setInteractive({ useHandCursor: true });
        this.add.text(w / 2, h / 2 + 20, "↻  TRY AGAIN", {
            fontFamily: "Georgia, serif", fontSize: "15px", color: "#f4ead0", letterSpacing: 2
        }).setOrigin(0.5).setDepth(20004).setScrollFactor(0);

        retryBg.on("pointerover", () => retryBg.setFillStyle(0x3a2160, 0.95));
        retryBg.on("pointerout", () => retryBg.setFillStyle(0x2a1740, 0.95));
        retryBg.on("pointerdown", () => {
            this.bossMusic?.stop();
            this.hp = 100; this.mana = 100;
            this.stage = "intro"; this.bats = []; this.bullets = []; this.spiders = [];
            this.vampire = undefined; this.werewolf = undefined;
            this.scene.restart();
        });

        // Title button
        const titleBg = this.add.rectangle(w / 2, h / 2 + 72, 200, 40, 0x1a0f1a, 0.95)
            .setStrokeStyle(1, 0x8a7240).setDepth(20003).setScrollFactor(0).setInteractive({ useHandCursor: true });
        this.add.text(w / 2, h / 2 + 72, "⌂  BACK TO TITLE", {
            fontFamily: "Georgia, serif", fontSize: "13px", color: "#c9a25b"
        }).setOrigin(0.5).setDepth(20004).setScrollFactor(0);
        titleBg.on("pointerdown", () => {
            this.bossMusic?.stop();
            this.scene.get("ui").events.emit("hud_show", false);
            this.scene.stop();
            this.scene.manager.start("title");
        });

        void dim; void panel;
    }

    victory() {
        if (this.stage === "won") return;
        this.stage = "won";
        if (this.bossMusic) { this.bossMusic.stop(); this.bossMusic = null; }
        const ui = this.scene.get("ui");
        ui.events.emit("cine_line", "The wolf falls. Moonlight dims. The tower is yours, hearthwitch.");
        this.cameras.main.fadeOut(2400, 0, 0, 0);
        this.time.delayedCall(2500, () => this.showCredits());
    }

    showCredits() {
        const w = this.scale.width, h = this.scale.height;
        this.scene.get("ui").events.emit("hud_show", false);
        this.add.rectangle(0, 0, w, h, 0x000000, 1).setOrigin(0).setDepth(30000);

        const lines = [
            { text: "✦  THE WITCH OF MOONLIT HOLLOW  ✦", size: "22px", color: "#f4ead0", y: h * 0.18 },
            { text: "A Stormie Games Adventure", size: "14px", color: "#c9a25b", y: h * 0.27 },
            { text: "The hollow is quiet now.", size: "13px", color: "#9fe6df", y: h * 0.38 },
            { text: "Three spirits bound. A wand forged.", size: "13px", color: "#9fe6df", y: h * 0.44 },
            { text: "The tower cleared. Lord Vyrin, ash.", size: "13px", color: "#9fe6df", y: h * 0.50 },
            { text: "Prof. Lyall, sleeping at last.", size: "13px", color: "#9fe6df", y: h * 0.56 },
            { text: "The hearthwitch walks home", size: "13px", color: "#c9a25b", y: h * 0.66 },
            { text: "as the moon sets over Moonlit Hollow.", size: "13px", color: "#c9a25b", y: h * 0.72 },
            { text: "— Game & Story: Stormie Games —", size: "11px", color: "#8a7240", y: h * 0.83 },
            { text: "More levels coming soon  ✦", size: "11px", color: "#6a5a30", y: h * 0.88 },
        ];

        lines.forEach((l, i) => {
            const txt = this.add.text(w / 2, l.y + 30, l.text, {
                fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: l.size,
                color: l.color, align: "center", stroke: "#000", strokeThickness: 2
            }).setOrigin(0.5).setAlpha(0).setDepth(30001);
            this.tweens.add({ targets: txt, alpha: 1, duration: 1000, delay: i * 600 });
        });

        // Stars
        const stars = this.add.graphics().setDepth(30000);
        stars.fillStyle(0xfff5d6, 0.6);
        for (let i = 0; i < 80; i++) {
            stars.fillRect((i * 97 + 13) % w, (i * 53 + 7) % (h * 0.95), 1, 1);
        }

        // Play again button
        const btnDelay = lines.length * 600 + 800;
        this.time.delayedCall(btnDelay, () => {
            const btn = this.add.rectangle(w / 2, h * 0.95, 220, 40, 0x1a0f2e, 0.95)
                .setStrokeStyle(2, 0xc9a84c).setDepth(30002).setInteractive({ useHandCursor: true });
            this.add.text(w / 2, h * 0.95, "⌂  BACK TO TITLE", {
                fontFamily: "Georgia, serif", fontSize: "14px", color: "#f4ead0"
            }).setOrigin(0.5).setDepth(30003);
            this.tweens.add({ targets: btn, alpha: { from: 0, to: 1 }, duration: 600 });
            btn.on("pointerdown", () => {
                this.scene.stop();
                this.scene.manager.start("title");
            });
        });

        // Chime sequence
        [0, 600, 1200, 1800].forEach((d, i) => {
            this.time.delayedCall(d + 400, () => playChime([523, 659, 784, 1047][i], 2.2, 0.06));
        });
    }

    // ─── TRANSITIONS ─────────────────────────────────────────────────────────
    descendToFloor2() {
        if (this._descending) return;
        this._descending = true;
        this.stage = "intro"; // pause update logic during transition
        this.cameras.main.fadeOut(700, 0, 0, 0);
        this.time.delayedCall(750, () => {
            this._descending = false;
            const w = this.scale.width, h = this.scale.height;
            this.buildFloor2(w, h);
            this.cameras.main.fadeIn(700, 0, 0, 0);
            this.showBanner("FLOOR II — THE INVESTIGATION", 2200);
            this.time.delayedCall(2400, () => {
                this.stage = "floor2"; // enable floor-2 update loop
            });
        });
    }

    descendToFloor3() {
        this.cameras.main.fadeOut(700, 0, 0, 0);
        this.time.delayedCall(750, () => {
            this.buildFloor3(this.scale.width, this.scale.height);
            this.cameras.main.fadeIn(700, 0, 0, 0);
        });
    }

    // ─── TOUCH CONTROLS ──────────────────────────────────────────────────────
    buildTouchControls(w, h) {
        this.joyOrigin = { x: 80, y: h - 80 };
        this.joyBase = this.add.circle(80, h - 80, 52, 0x000000, 0.34)
            .setStrokeStyle(2, 0x8a7240, 0.6).setDepth(1100).setScrollFactor(0).setAlpha(0.28);
        this.joyKnob = this.add.circle(80, h - 80, 24, 0xc9a25b, 0.78)
            .setStrokeStyle(1, 0xf4ead0, 0.6).setDepth(1101).setScrollFactor(0).setAlpha(0.46);

        this.btnCast = this.add.container(w - 60, h - 80).setDepth(10200).setScrollFactor(0).setAlpha(0.95);
        const glow = this.add.circle(0, 0, 52, 0xc9a84c, 0.32).setBlendMode(Phaser.BlendModes.ADD);
        const glow2 = this.add.circle(0, 0, 46, 0xc9a84c, 0.22).setBlendMode(Phaser.BlendModes.ADD);
        const bg = this.add.circle(0, 0, 36, 0x1a0f2e, 0.95).setStrokeStyle(2, 0xc9a84c, 1);
        const gi = this.add.text(0, -2, "◆", { fontFamily: "serif", fontSize: "22px", color: "#c9a84c" }).setOrigin(0.5);
        const li = this.add.text(0, 18, "Cast", { fontFamily: "Georgia, serif", fontSize: "9px", color: "#c9a84c" }).setOrigin(0.5);
        this.btnCast.add([glow, glow2, bg, gi, li]);
        bg.setInteractive({ useHandCursor: true });
        bg.on("pointerdown", () => { this.tweens.add({ targets: this.btnCast, scale: 0.9, duration: 80, yoyo: true }); this.castWand(); });

        // Interact button (floor 2 clue collection)
        this.btnInteract = this.add.container(w - 60, h - 160).setDepth(10200).setScrollFactor(0).setAlpha(0);
        const ibg = this.add.circle(0, 0, 30, 0x1a1040, 0.92).setStrokeStyle(2, 0x9fe6df, 1);
        const itxt = this.add.text(0, 0, "E", { fontFamily: "Georgia, serif", fontSize: "16px", color: "#9fe6df" }).setOrigin(0.5);
        this.btnInteract.add([ibg, itxt]);
        ibg.setInteractive({ useHandCursor: true });
        ibg.on("pointerdown", () => this.tryCollectClue());

        this.input.on("pointerdown", (p) => {
            if (this.joyActive) return;
            if (p.x > this.scale.width * 0.5) return;
            this.joyActive = true; this.joyPointerId = p.id;
            this.joyOrigin = { x: p.x, y: p.y };
            this.joyBase.setPosition(p.x, p.y); this.joyKnob.setPosition(p.x, p.y);
            this.tweens.add({ targets: [this.joyBase, this.joyKnob], alpha: 1, duration: 150 });
        });
        this.input.on("pointermove", (p) => {
            if (!this.joyActive || p.id !== this.joyPointerId) return;
            const dx = p.x - this.joyOrigin.x, dy = p.y - this.joyOrigin.y;
            const d = Math.hypot(dx, dy), max = 36;
            const cd = Math.min(d, max), ang = Math.atan2(dy, dx);
            this.joyKnob.setPosition(this.joyOrigin.x + Math.cos(ang) * cd, this.joyOrigin.y + Math.sin(ang) * cd);
            this.joyVec = { x: Math.cos(ang) * (cd / max), y: Math.sin(ang) * (cd / max) };
        });
        const end = (p) => {
            if (p.id !== this.joyPointerId) {
                if (this.joyActive && !this.input.pointer1?.isDown && !this.input.pointer2?.isDown) { this.joyActive = false; this.joyVec = { x: 0, y: 0 }; }
                return;
            }
            this.joyActive = false; this.joyVec = { x: 0, y: 0 };
            this.tweens.add({ targets: this.joyBase, alpha: 0.28, duration: 200 });
            this.tweens.add({ targets: this.joyKnob, alpha: 0.46, duration: 200 });
        };
        this.input.on("pointerup", end);
        this.input.on("pointerupoutside", end);

        this.keys.E?.off("down");
        this.keys.E?.on("down", () => {
            if (this.currentFloor === 2) this.tryCollectClue();
            else this.castWand();
        });
        this.keys.SPACE?.off("down");
        this.keys.SPACE?.on("down", () => {
            if (this.currentFloor === 2) this.tryCollectClue();
            else this.castWand();
        });
    }

    buildBanner(w, h) {
        this.banner = this.add.text(w / 2, Math.min(h * 0.18, 80), "", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "16px",
            color: "#f4ead0", align: "center", stroke: "#000", strokeThickness: 4
        }).setOrigin(0.5).setDepth(2000).setScrollFactor(0);
    }

    onResize() {
        const w = this.scale.width, h = this.scale.height;
        const f = getFrame(this);
        if (this.btnCast) this.btnCast.setPosition(w - 24 - 36, h - 24 - 36);
        if (this.btnInteract) this.btnInteract.setPosition(w - 24 - 36, h - 24 - 36 - 80);
        if (!this.joyActive) {
            this.joyOrigin = { x: 24 + 56, y: f.mobile ? f.y + f.h + Math.min(f.bottomBand - 80, 80) : h - 80 };
            this.joyBase?.setPosition(this.joyOrigin.x, this.joyOrigin.y);
            this.joyKnob?.setPosition(this.joyOrigin.x, this.joyOrigin.y);
        }
        if (this.banner) this.banner.setPosition(w / 2, Math.max(40, f.y + 36));
    }

    showBanner(text, holdMs = 2000) {
        if (!this.banner) return;
        this.banner.setText(text).setAlpha(0);
        this.tweens.add({ targets: this.banner, alpha: 1, duration: 400, hold: holdMs, yoyo: true });
    }

    spawnBat(x, y) {
        if (!this.anims.exists("bat_fly")) {
            this.anims.create({ key: "bat_fly", frames: [{ key: "bat_0" }, { key: "bat_1" }], frameRate: 8, repeat: -1 });
        }
        const spr = this.add.sprite(x, y, "bat_0").setScale(2.0).setDepth(900);
        spr.play("bat_fly");
        this.bats.push({ spr, vx: 0, vy: 0, alive: true });
    }

    transformWolf(to) {
        if (!this.werewolf) return;
        this.wolfPhase = to;
        this.cameras.main.flash(500, 200, 60, 80);
        this.showBanner(to === 2 ? "THE CHANGE BEGINS…" : "FULL MOON. FULL WOLF.", 2000);
        this.tweens.add({
            targets: this.werewolf, alpha: 0, duration: 350, yoyo: true,
            onYoyo: () => {
                if (!this.werewolf) return;
                if (to === 2) { this.werewolf.setTexture("wolf_half").setScale(2.4); }
                else { this.werewolf.setTexture("wolf_full_0").setOrigin(0.5, 1).setScale(2.6).setY(this.arena.y + this.arena.h - 20); this.werewolf.play("wolf_full_walk"); }
            }
        });
    }

    // ─── UPDATE ──────────────────────────────────────────────────────────────
    update(_t, dt) {
        if (this.stage === "won" || this.stage === "wolfIntro" || this.stage === "vampireDead") return;
        // "intro" only blocks combat — movement and stair access still work
        const combatActive = (this.stage !== "intro" && this.stage !== "cleared");
        this.damageCd = Math.max(0, this.damageCd - dt);
        this.castCd = Math.max(0, this.castCd - dt);
        this.mana = Math.min(100, this.mana + dt * 0.012);
        if (Math.random() < 0.05) this.scene.get("ui").events.emit("mana", this.mana);

        // Movement
        let vx = 0, vy = 0;
        if (this.cursors?.left?.isDown || this.keys?.A?.isDown) vx -= 1;
        if (this.cursors?.right?.isDown || this.keys?.D?.isDown) vx += 1;
        if (this.cursors?.up?.isDown || this.keys?.W?.isDown) vy -= 1;
        if (this.cursors?.down?.isDown || this.keys?.S?.isDown) vy += 1;
        if (this.joyActive) { vx += this.joyVec.x; vy += this.joyVec.y; }
        const sp = 2.4;
        if (vx !== 0 || vy !== 0) {
            const m = Math.hypot(vx, vy) || 1;
            this.player.x += (vx / m) * sp;
            this.player.y += (vy / m) * sp;
            if (vx !== 0) this.facing = vx > 0 ? 1 : -1;
            this.player.setFlipX(this.facing < 0);
            this.aim = { x: vx / m, y: vy / m };
        }
        if (this.arena.w > 0) {
            this.player.x = Phaser.Math.Clamp(this.player.x, this.arena.x + 10, this.arena.x + this.arena.w - 10);
            this.player.y = Phaser.Math.Clamp(this.player.y, this.arena.y + 20, this.arena.y + this.arena.h - 4);
        }
        this.player.setDepth(this.player.y);
        const halo = this.children.getByName("playerHalo");
        if (halo) halo.setPosition(this.player.x, this.player.y - 24);

        // Floor 2: stair/clue proximity check
        if (this.currentFloor === 2) {
            // Show interact button when near clue or stair
            const nearClue = this.clueItems?.some(it => !it.collected && Phaser.Math.Distance.Between(this.player.x, this.player.y, it.x, it.y) < 50);
            const nearStairUp = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.stairUpX ?? 9999, this.stairUpY ?? 9999) < 44;
            const nearStairDown = !this.floor3Locked && Phaser.Math.Distance.Between(this.player.x, this.player.y, this.stairF3X ?? 9999, this.stairF3Y ?? 9999) < 44;
            if (this.btnInteract) this.btnInteract.setAlpha((nearClue || nearStairUp || nearStairDown) ? 0.95 : 0);
            // Auto-trigger stairs on overlap (no button press needed)
            if (nearStairUp && !this._descending) { this.ascendToFloor1(); return; }
            if (nearStairDown && !this._descending) { this.descendToFloor3(); return; }
            return; // no combat on floor 2
        }

        // Floor 1: stair to floor 2 check (only after vampire dead)
        if (this.currentFloor === 1 && this.stairUnlocked && !this._descending) {
            const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.stairX ?? 9999, this.stairY ?? 9999);
            if (d < 52) this.descendToFloor2();
        }

        // Bullets
        this.bullets.forEach(b => {
            if (!b.alive) return;
            b.spr.x += b.vx; b.spr.y += b.vy;
            if (b.spr.x < -20 || b.spr.x > this.scale.width + 20 || b.spr.y < -20 || b.spr.y > this.scale.height + 20) {
                b.alive = false; b.spr.destroy();
            }
        });
        this.bullets = this.bullets.filter(b => b.alive);

        // Spiders
        this.spiders.forEach(s => {
            if (!s.alive) return;
            const dx = this.player.x - s.spr.x, dy = this.player.y - 12 - s.spr.y;
            const d = Math.hypot(dx, dy) || 1;
            s.spr.x += (dx / d) * 1.2; s.spr.y += (dy / d) * 1.2;
            s.spr.setFlipX(dx < 0);
            if (d < 22 && combatActive) this.hurtPlayer(8);
            this.bullets.forEach(b => {
                if (!b.alive || !s.alive) return;
                if (Phaser.Math.Distance.Between(b.spr.x, b.spr.y, s.spr.x, s.spr.y) < 18) {
                    b.alive = false; b.spr.destroy();
                    s.hp -= 1; s.spr.setTint(0xff5050);
                    this.time.delayedCall(100, () => s.spr.clearTint());
                    if (s.hp <= 0) { s.alive = false; s.spr.destroy(); }
                }
            });
        });
        const spidersLeft = this.spiders.filter(s => s.alive).length;
        if (combatActive && this.stage === "spiders" && spidersLeft === 0) {
            this.spiders = []; this.stage = "intro";
            this.time.delayedCall(700, () => this.beginVampire());
        }

        // Vampire
        if (combatActive && this.vampire && this.stage === "vampire" && this.vampire.alpha > 0.5) {
            if (Math.random() < 0.003) {
                const tx = this.arena.x + 40 + Math.random() * (this.arena.w - 80);
                const ty = this.arena.y + 30 + Math.random() * (this.arena.h - 100);
                this.vampire.setAlpha(0);
                this.tweens.add({ targets: this.vampire, alpha: 1, duration: 400 });
                this.vampire.setPosition(tx, ty);
            }
            if (Math.random() < 0.012 && this.bats.length < 4) this.spawnBat(this.vampire.x, this.vampire.y + 20);
            this.bullets.forEach(b => {
                if (!b.alive || !this.vampire) return;
                if (Phaser.Math.Distance.Between(b.spr.x, b.spr.y, this.vampire.x, this.vampire.y + 30) < 26) {
                    b.alive = false; b.spr.destroy();
                    this.vampireHp -= 1;
                    this.vampire.setTint(0xff5050);
                    this.time.delayedCall(120, () => this.vampire?.clearTint());
                    if (this.vampireHp <= 0) {
                        this.tweens.add({ targets: this.vampire, alpha: 0, duration: 800, onComplete: () => { this.vampire?.destroy(); this.vampire = undefined; } });
                        this.stage = "vampireDead";
                        this.bats.forEach(b2 => { b2.alive = false; b2.spr.destroy(); }); this.bats = [];
                        this.bullets.forEach(bl => { bl.alive = false; try { bl.spr.destroy(); } catch {} }); this.bullets = [];
                        if (this.bossMusic) { this.bossMusic.stop(); this.bossMusic = null; }
                        this.scene.get("ui").events.emit("cine_line", "Lord Vyrin dissolves into shadow. The staircase groans open.");
                        this.time.delayedCall(1400, () => { this.stage = "cleared"; this.unlockStairDown(); });
                    }
                }
            });
        }

        // Bats
        this.bats.forEach(b => {
            if (!b.alive) return;
            const dx = this.player.x - b.spr.x, dy = this.player.y - 16 - b.spr.y;
            const d = Math.hypot(dx, dy) || 1;
            b.spr.x += (dx / d) * 1.8; b.spr.y += (dy / d) * 1.8;
            if (d < 22 && combatActive) { this.hurtPlayer(6); b.alive = false; b.spr.destroy(); }
            this.bullets.forEach(bl => {
                if (!bl.alive || !b.alive) return;
                if (Phaser.Math.Distance.Between(bl.spr.x, bl.spr.y, b.spr.x, b.spr.y) < 16) {
                    bl.alive = false; bl.spr.destroy(); b.alive = false; b.spr.destroy();
                }
            });
        });
        this.bats = this.bats.filter(b => b.alive);

        // Werewolf
        if (combatActive && this.werewolf && this.stage === "wolf") {
            const wf = this.werewolf;
            if (this.wolfPhase === 1) {
                if (Math.random() < 0.006) this.spawnBat(wf.x, wf.y + 30);
                wf.x += Math.sign(this.player.x - wf.x) * 0.5;
            } else if (this.wolfPhase === 2) {
                wf.x += Math.sign(this.player.x - wf.x) * 1.2;
                if (Math.random() < 0.012 && this.bats.length < 5) this.spawnBat(wf.x, wf.y + 30);
            } else if (this.wolfPhase === 3) {
                const dx = this.player.x - wf.x, dy = this.player.y - 30 - wf.y;
                const d = Math.hypot(dx, dy) || 1;
                wf.x += (dx / d) * 2.6; wf.y += (dy / d) * 1.4;
            }
            if (Phaser.Math.Distance.Between(wf.x, wf.y + 30, this.player.x, this.player.y - 12) < 38) {
                this.hurtPlayer(this.wolfPhase === 3 ? 14 : 8);
            }
            this.bullets.forEach(b => {
                if (!b.alive || !this.werewolf) return;
                if (Phaser.Math.Distance.Between(b.spr.x, b.spr.y, wf.x, wf.y + 30) < 32) {
                    b.alive = false; b.spr.destroy();
                    this.wolfHp -= 4; wf.setTint(0xff5050);
                    this.time.delayedCall(120, () => this.werewolf?.clearTint());
                    if (this.wolfHp <= 66 && this.wolfPhase === 1) this.transformWolf(2);
                    else if (this.wolfHp <= 33 && this.wolfPhase === 2) this.transformWolf(3);
                    else if (this.wolfHp <= 0) this.victory();
                }
            });
            wf.setDepth(wf.y + 100);
        }
    }

    shutdown() {
        this.bossMusic?.stop();
        this.bossMusic = null;
    }
}

// ===== UIScene =====
// Minimal, cinematic UI. Persistent RPG-style chrome (tasks, clock, HP/SP,
// inventory bar) has been removed so the world itself is the focal point.
// Only the spirit sense badge, the dialogue panel, and the intro whisper
// remain — and each fades out when not needed.
class UIScene extends Phaser.Scene {
    constructor() {
        super("ui");
        this.dialogueQueue = [];
        this.currentDialogueLine = "";
        this.typing = false;
        this.typeIdx = 0;
        this.typeTimer = 0;
        this.hpBarWidth = 220;
        this.manaVisible = false;
        this.inventoryVisible = false;
        this.splitBarW = 160;
        this.hudMode = "center";
        this.paused = false;
        this.pausedSceneKey = null;
        this.invRows = {};
        this.ritualReady = false;
    }
    create() {
        const W = this.scale.width;
        const H = this.scale.height;
        // --- world-dim layer behind dialogue (preserves atmosphere) ----------
        this.dialogueDim = this.add
            .rectangle(0, 0, W, H, 0x05070a, 0)
            .setOrigin(0, 0)
            .setDepth(15);
        // --- ornate panel helper (used only by the dialogue frame) -----------
        const panel = (x, y, w, h) => {
            const c = this.add.container(x, y);
            const shadow = this.add
                .rectangle(2, 2, w, h, 0x000000, 0.35)
                .setOrigin(0);
            const bg = this.add.rectangle(0, 0, w, h, PAL.uiPanel, 0.92).setOrigin(0);
            bg.setStrokeStyle(2, PAL.uiBorder);
            const inner = this.add.rectangle(3, 3, w - 6, h - 6, 0x000000, 0).setOrigin(0);
            inner.setStrokeStyle(1, PAL.uiBorderHi, 0.55);
            c.add([shadow, bg, inner]);
            return c;
        };
        // spirit sense badge removed per design — keep a hidden stub so legacy
        // events that toggle it don't crash.
        this.senseBadge = this.add.container(W / 2, 70).setAlpha(0).setVisible(false).setDepth(5);
        // --- top HP bar (centered, minimal) ---------------------------------
        this.hud = this.add.container(W / 2, 22).setDepth(50).setAlpha(0);
        const hpW = Math.min(W - 40, this.hpBarWidth);
        this.hpBarWidth = hpW;
        const hpBack = this.add
            .rectangle(0, 0, hpW + 4, 12, 0x0a0608, 0.85)
            .setStrokeStyle(1, 0x6b1818, 0.9)
            .setOrigin(0.5);
        this.hpFill = this.add
            .rectangle(-hpW / 2, 0, hpW, 8, 0xb24a4a, 1)
            .setOrigin(0, 0.5);
        this.hpText = this.add
            .text(0, 0, "100", {
            fontFamily: "Georgia, serif",
            fontSize: "9px",
            color: "#f4ead0",
            stroke: "#000",
            strokeThickness: 2,
        })
            .setOrigin(0.5);
        this.hud.add([hpBack, this.hpFill, this.hpText]);
        // mana bar (just below HP, same width)
        this.manaBack = this.add
            .rectangle(0, 14, hpW + 4, 8, 0x05080f, 0.85)
            .setStrokeStyle(1, 0x355a6e, 0.9)
            .setOrigin(0.5);
        this.manaFill = this.add
            .rectangle(-hpW / 2, 14, hpW, 5, 0x6fb6e0, 1)
            .setOrigin(0, 0.5);
        this.manaText = this.add
            .text(0, 14, "100", {
            fontFamily: "Georgia, serif",
            fontSize: "8px",
            color: "#dff1ff",
            stroke: "#000",
            strokeThickness: 2,
        })
            .setOrigin(0.5);
        this.hud.add([this.manaBack, this.manaFill, this.manaText]);
        [this.manaBack, this.manaFill, this.manaText].forEach((o) => o.setAlpha(0));
        // ----- Split HUD (HP top-left, Mana top-right) for flight level ------
        this.splitHud = this.add.container(0, 0).setDepth(10300).setAlpha(0);
        const makeBar = (label, fillColor, borderColor, labelColor) => {
            const c = this.add.container(0, 0);
            const bw = this.splitBarW;
            const shadow = this.add
                .rectangle(2, 3, bw + 8, 22, 0x000000, 0.55)
                .setOrigin(0, 0);
            const frame = this.add
                .rectangle(0, 0, bw + 8, 22, 0x1a0f2e, 0.92)
                .setStrokeStyle(2, borderColor, 1)
                .setOrigin(0, 0);
            const fill = this.add
                .rectangle(4, 4, bw, 14, fillColor, 1)
                .setOrigin(0, 0);
            const lab = this.add
                .text(6, -14, label, {
                fontFamily: "Georgia, serif",
                fontStyle: "italic",
                fontSize: "10px",
                color: labelColor,
                stroke: "#000",
                strokeThickness: 3,
                letterSpacing: 2,
            })
                .setOrigin(0, 0);
            const val = this.add
                .text(bw / 2 + 4, 11, "100", {
                fontFamily: "Georgia, serif",
                fontSize: "10px",
                color: "#f4ead0",
                stroke: "#000",
                strokeThickness: 3,
            })
                .setOrigin(0.5);
            c.add([shadow, frame, fill, lab, val]);
            return { c, fill, val };
        };
        const hpBar = makeBar("♥ HEALTH", 0xc23030, 0xc94c4c, "#ffb0b0");
        const manaBar = makeBar("✦ MANA", 0x7a3acf, 0xb279ff, "#dcc0ff");
        this.splitHpBox = hpBar.c;
        this.splitHpFill = hpBar.fill;
        this.splitHpText = hpBar.val;
        this.splitManaBox = manaBar.c;
        this.splitManaFill = manaBar.fill;
        this.splitManaText = manaBar.val;
        this.splitHud.add([this.splitHpBox, this.splitManaBox]);
        // --- parchment inventory checklist (top-right) ----------------------
        this.invPanel = this.add.container(W - 12, 12).setDepth(48).setAlpha(0);
        const pw = 168;
        const items = [
            { key: "candles", label: "Light 7 candles" },
            { key: "stone", label: "Pick up a stone" },
            { key: "feather", label: "Crow feather" },
            { key: "blood", label: "Vial of bat blood" },
            { key: "moss", label: "Grave moss" },
            { key: "spirits", label: "Bind 3 spirits" },
        ];
        const ph = 22 + items.length * 18 + 10;
        // parchment back
        const pShadow = this.add
            .rectangle(2, 4, pw, ph, 0x000000, 0.45)
            .setOrigin(1, 0);
        const pBack = this.add
            .rectangle(0, 0, pw, ph, 0x2a1f17, 0.55)
            .setOrigin(1, 0);
        const pPaper = this.add
            .rectangle(-3, 3, pw - 6, ph - 6, 0xd9c79a, 0.55)
            .setOrigin(1, 0);
        const pInner = this.add
            .rectangle(-7, 7, pw - 14, ph - 14, 0x000000, 0)
            .setStrokeStyle(1, 0x6b4a25, 0.55)
            .setOrigin(1, 0);
        const title = this.add
            .text(-pw / 2, 12, "— Ritual —", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "11px",
            color: "#3a2614",
        })
            .setOrigin(0.5, 0);
        this.invPanel.add([pShadow, pBack, pPaper, pInner, title]);
        items.forEach((it, i) => {
            const y = 30 + i * 18;
            const check = this.add
                .text(-pw + 12, y, "☐", {
                fontFamily: "Georgia, serif",
                fontSize: "13px",
                color: "#5a3a1c",
            })
                .setOrigin(0, 0);
            const label = this.add
                .text(-pw + 28, y + 1, it.label, {
                fontFamily: "Georgia, serif",
                fontSize: "11px",

            if (inv.candles !== undefined)
                tick("candles", inv.candles >= 7, `Light 7 candles (${inv.candles}/7)`);
            if (inv.stone !== undefined)
                tick("stone", inv.stone >= 1, "Pick up a stone");
            if (inv.feather !== undefined)
                tick("feather", inv.feather >= 1, "Crow feather");
            if (inv.blood !== undefined)
                tick("blood", inv.blood >= 1, "Vial of bat blood");
            if (inv.moss !== undefined)
                tick("moss", inv.moss >= 1, "Grave moss");
            if (inv.spirits !== undefined)
                tick("spirits", inv.spirits.length >= 3, `Bind 3 spirits (${inv.spirits.length}/3)`);
            // ready hint
            const allDone = (inv.candles ?? 0) >= 7 &&
                (inv.stone ?? 0) >= 1 &&
                (inv.feather ?? 0) >= 1 &&
                (inv.blood ?? 0) >= 1 &&
                (inv.moss ?? 0) >= 1 &&
                (inv.spirits?.length ?? 0) >= 3;
            if (allDone && !this.ritualReady) {

        // It is enabled only while dialogue is open (see openDialogue/nextLine).
        this.dialogueDim.on("pointerdown", () => this.advanceDialogue());
        // --- cinematic black cover (used for intro + ending) -----------------
        this.cineCover = this.add
            .rectangle(0, 0, W, H, 0x000000, 1)
            .setOrigin(0, 0)
            .setDepth(20000)
            .setAlpha(0);
        this.cineText = this.add
            .text(W / 2, H / 2, "", {

            fontStyle: "italic",
            fontSize: W < 520 ? "21px" : "18px",

            wordWrap: { width: Math.min(W - 80, 520) },

            stroke: "#000",
            strokeThickness: 4,
        })
            .setOrigin(0.5)
            .setDepth(20001)
            .setAlpha(0);
        this.endText = this.add
            .text(W / 2, H / 2, "", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "22px",
            color: "#c9a25b",
            align: "center",
            wordWrap: { width: Math.min(W - 80, 520) },
            lineSpacing: 8,
            stroke: "#000",
            strokeThickness: 4,
        })
            .setOrigin(0.5)
            .setDepth(20002)
            .setAlpha(0);
        // keep cinematic layers sized to viewport
        const resizeCine = () => {
            const ww = this.scale.width, hh = this.scale.height;
            const f = getFrame(this);
            this.cineCover.setSize(ww, hh);
            this.cineText.setPosition(ww / 2, f.y + f.h / 2);
            this.cineText.setWordWrapWidth(Math.min(ww - 80, 520));
            this.cineText.setFontSize(ww < 520 ? 21 : 18);
            this.endText.setPosition(ww / 2, f.y + f.h / 2);
            this.dialogueDim.setSize(ww, hh);
            // dialogue sits at the bottom of the game frame (inside it)
            this.dialogueBox.setPosition(ww / 2, f.y + f.h - 60);
            this.senseBadge.setPosition(ww / 2, f.mobile ? f.y + 36 : 70);
            // HP/mana bars above the game frame on mobile
            this.hud.setPosition(ww / 2, f.mobile ? Math.max(14, f.y - 22) : 22);
            // Inventory checklist below the game frame on mobile
            if (f.mobile) {
                // Inventory parchment top-right, tucked under the floating menu button
                this.invPanel.setPosition(ww - 12, 44);
            }
            else {
                this.invPanel.setPosition(ww - 12, 44);
            }
            this.introText.setPosition(ww / 2, f.mobile ? f.y + f.h - 28 : hh - 60);
            this.positionSplitHud();
        };
        this.scale.on("resize", resizeCine);
        // run once after creation so initial positions reflect the frame
        this.time.delayedCall(0, resizeCine);
        this.events.on("cine_line", (line) => {
            this.tweens.add({
                targets: this.cineText,
                alpha: 0,
                duration: 400,
                onComplete: () => {
                    this.cineText.setText(line);
                    this.tweens.add({ targets: this.cineText, alpha: 1, duration: 900 });
                },
            });
        });
        this.events.on("cine_fadeout", () => {
            this.tweens.add({ targets: this.cineText, alpha: 0, duration: 600 });
            this.tweens.add({
                targets: this.cineCover,
                alpha: 0,
                duration: 2200,
                ease: "sine.inOut",
            });
        });
        this.events.on("cine_end", (line) => {
            this.tweens.add({ targets: this.cineCover, alpha: 1, duration: 1800 });
            this.time.delayedCall(2000, () => {
                this.endText.setText(line);
                this.tweens.add({ targets: this.endText, alpha: 1, duration: 1500 });
            });
        });
        this.buildPauseUI();
        this.scale.on("resize", () => this.layoutPauseUI());
        this.input.keyboard?.on("keydown-ESC", () => this.togglePause());
        this.input.keyboard?.on("keydown-P", () => this.togglePause());
    }
    openDialogue(name, lines) {
        this.dialogueQueue = [...lines];
        this.dialogueName.setText(name);
        this.dialogueBox.setVisible(true);
        this.dialogueBox.setAlpha(0);
        this.tweens.add({ targets: this.dialogueBox, alpha: 1, duration: 200 });
        this.tweens.add({ targets: this.dialogueDim, fillAlpha: 0.35, duration: 250 });
        this.dialogueDim.setInteractive();
        this.nextLine();
    }
    nextLine() {
        const line = this.dialogueQueue.shift();
        if (line === undefined) {
            this.tweens.add({
                targets: this.dialogueBox,
                alpha: 0,
                duration: 200,
                onComplete: () => this.dialogueBox.setVisible(false),
            });
            this.tweens.add({ targets: this.dialogueDim, fillAlpha: 0, duration: 250 });
            this.dialogueDim.disableInteractive();
            return;
        }
        this.currentDialogueLine = line;
        this.typeIdx = 0;
        this.typing = true;
        this.dialogueText.setText("");
    }
    advanceDialogue() {
        if (!this.dialogueBox.visible)
            return;
        if (this.typing) {
            this.dialogueText.setText(this.currentDialogueLine);
            this.typing = false;
        }
        else {
            this.nextLine();
        }
    }
    update(_t, dt) {
        if (this.typing) {
            this.typeTimer += dt;
            while (this.typeTimer > 22 && this.typeIdx < this.currentDialogueLine.length) {
                this.typeIdx++;
                this.typeTimer -= 22;
                this.dialogueText.setText(this.currentDialogueLine.slice(0, this.typeIdx));
            }
            if (this.typeIdx >= this.currentDialogueLine.length)
                this.typing = false;
        }
        if (this.pauseBtn) {
            const onTitle = !!this.scene.manager.getScene("title")?.scene.isActive();
            this.pauseBtn.setVisible(!onTitle && !this.paused);
        }
    }
    positionSplitHud() {
        const ww = this.scale.width;
        const pad = 24;
        this.splitHpBox.setPosition(pad, pad);
        this.splitManaBox.setPosition(ww - pad - (this.splitBarW + 8), pad);
    }
    // ----- Pause menu -----
    getActiveGameplayScene() {
        const skip = new Set(["ui", "title", "spellbook"]);
        const scenes = this.scene.manager.getScenes(true);
        for (const s of scenes) {
            const k = s.scene.key;
            if (!skip.has(k))
                return k;
        }
        return null;
    }
    buildPauseUI() {
        const W = this.scale.width;
        // Floating menu button — small, semi-transparent, top-right corner
        this.pauseBtn = this.add.container(W - 14, 14).setDepth(30000).setScrollFactor(0).setAlpha(0.78);
        const pbBg = this.add
            .rectangle(0, 0, 58, 22, 0x1a0f2e, 0.55)
            .setStrokeStyle(1, 0xc9a84c, 0.85)
            .setOrigin(1, 0);
        const pbLab = this.add
            .text(-29, 11, "❚❚ MENU", {
            fontFamily: "Georgia, serif",
            fontSize: "9px",
            color: "#c9a84c",
            letterSpacing: 1,
        })
            .setOrigin(0.5);
        this.pauseBtn.add([pbBg, pbLab]);
        pbBg.setInteractive({ useHandCursor: true });
        pbBg.on("pointerover", () => this.pauseBtn.setAlpha(1));
        pbBg.on("pointerout", () => this.pauseBtn.setAlpha(0.78));
        pbBg.on("pointerdown", () => this.togglePause());
        // pause modal
        const H = this.scale.height;
        this.pauseDim = this.add
            .rectangle(0, 0, W, H, 0x000000, 0.7)
            .setOrigin(0, 0)
            .setDepth(30001)
            .setVisible(false);
        this.pauseDim.setInteractive();
        this.pauseMenu = this.add.container(W / 2, H / 2).setDepth(30002).setVisible(false);
        const mw = 260, mh = 280;
        const mShadow = this.add.rectangle(4, 6, mw, mh, 0x000000, 0.6).setOrigin(0.5);
        const mBg = this.add
            .rectangle(0, 0, mw, mh, 0x1a0f2e, 0.98)
            .setStrokeStyle(2, 0xc9a84c, 1);
        const mInner = this.add
            .rectangle(0, 0, mw - 10, mh - 10, 0x000000, 0)
            .setStrokeStyle(1, 0xc9a84c, 0.4);
        const mTitle = this.add
            .text(0, -mh / 2 + 26, "❚❚  PAUSED", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "18px",
            color: "#f4ead0",
            letterSpacing: 3,
        })
            .setOrigin(0.5);
        this.pauseMenu.add([mShadow, mBg, mInner, mTitle]);
        const mkBtn = (y, label, onClick) => {
            const bg = this.add
                .rectangle(0, y, mw - 60, 36, 0x2a1740, 0.95)
                .setStrokeStyle(1, 0xc9a84c, 0.8);
            const txt = this.add
                .text(0, y, label, {
                fontFamily: "Georgia, serif",
                fontSize: "13px",
                color: "#f4ead0",
                letterSpacing: 2,
            })
                .setOrigin(0.5);
            bg.setInteractive({ useHandCursor: true });
            bg.on("pointerover", () => bg.setFillStyle(0x3a2160, 0.95));
            bg.on("pointerout", () => bg.setFillStyle(0x2a1740, 0.95));
            bg.on("pointerdown", onClick);
            this.pauseMenu.add([bg, txt]);
            return txt;
        };
        mkBtn(-50, "▶  RESUME", () => this.togglePause());
        this.pauseMuteLabel = mkBtn(-8, isMuted() ? "♪  UNMUTE" : "♪  MUTE", () => {
            const newMuted = !isMuted();
            setMuted(newMuted);
            this.pauseMuteLabel.setText(newMuted ? "♪  UNMUTE" : "♪  MUTE");
        });
        mkBtn(34, "↻  RESTART LEVEL", () => {
            const k = this.pausedSceneKey;
            this.closePauseMenu();
            if (k) {
                this.scene.manager.getScene(k)?.scene.restart();
            }
        });
        mkBtn(76, "⌂  BACK TO TITLE", () => {
            const k = this.pausedSceneKey;
            this.closePauseMenu();
            if (k)
                this.scene.manager.getScene(k)?.scene.stop();
            this.events.emit("hud_show", false);
            this.events.emit("inventory_show", false);
            this.scene.manager.start("title");
        });
        this.layoutPauseUI();
    }
    layoutPauseUI() {
        if (!this.pauseBtn)
            return;
        const W = this.scale.width, H = this.scale.height;
        // floating top-right corner, above the game
        this.pauseBtn.setPosition(W - 14, 14);
        this.pauseDim.setSize(W, H);
        this.pauseMenu.setPosition(W / 2, H / 2);
        // hide on title screen
        const onTitle = !!this.scene.manager.getScene("title")?.scene.isActive();
        this.pauseBtn.setVisible(!onTitle);
    }
    togglePause() {
        if (this.paused) {
            this.closePauseMenu();
            return;
        }
        const k = this.getActiveGameplayScene();
        if (!k)
            return;
        this.pausedSceneKey = k;
        this.scene.manager.getScene(k)?.scene.pause();
        this.paused = true;
        this.pauseDim.setVisible(true);
        this.pauseMenu.setVisible(true);
        this.pauseMuteLabel.setText(isMuted() ? "♪  UNMUTE" : "♪  MUTE");
    }
    closePauseMenu() {
        if (!this.paused)
            return;
        this.paused = false;
        this.pauseDim.setVisible(false);
        this.pauseMenu.setVisible(false);
        if (this.pausedSceneKey) {
            this.scene.manager.getScene(this.pausedSceneKey)?.scene.resume();
        }
    }
}

class SpellbookScene extends Phaser.Scene {
    constructor() {
        super("spellbook");
        this.pageIdx = 0;
    }
    create() {
        const W = this.scale.width;
        const H = this.scale.height;
        const f = getFrame(this);
        this.dim = this.add
            .rectangle(0, 0, W, H, 0x000000, 0.65)
            .setOrigin(0, 0)
            .setInteractive();
        // Always center the spellbook over the entire canvas, on top of everything.
        const bw = Math.min(W - 24, f.mobile ? 520 : 600);
        const bh = Math.min(Math.round(H * 0.8), f.mobile ? 560 : 420);
        const cx = W / 2;
        const cy = H / 2;
        this.root = this.add.container(cx, cy).setAlpha(0);
        // shadow
        this.root.add(this.add.rectangle(6, 8, bw, bh, 0x000000, 0.55).setOrigin(0.5));
        // parchment background — layered rectangles for warmth
        this.parchment = this.add.graphics();
        this.parchment.fillStyle(0x2a1f17, 1);
        this.parchment.fillRoundedRect(-bw / 2 - 6, -bh / 2 - 6, bw + 12, bh + 12, 6);
        this.parchment.fillStyle(0xd9c79a, 1);
        this.parchment.fillRoundedRect(-bw / 2, -bh / 2, bw, bh, 4);
        this.parchment.fillStyle(0xc4ad7c, 0.4);
        // subtle stains
        for (let i = 0; i < 18; i++) {
            const x = -bw / 2 + Math.random() * bw;
            const y = -bh / 2 + Math.random() * bh;
            this.parchment.fillCircle(x, y, 8 + Math.random() * 22);
        }
        this.parchment.lineStyle(2, 0x6b4a25, 0.7);
        this.parchment.strokeRoundedRect(-bw / 2 + 8, -bh / 2 + 8, bw - 16, bh - 16, 3);
        // center spine
        this.parchment.lineStyle(1, 0x6b4a25, 0.35);
        this.parchment.lineBetween(0, -bh / 2 + 14, 0, bh / 2 - 14);
        this.root.add(this.parchment);
        this.titleText = this.add
            .text(0, -bh / 2 + 28, "", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "20px",
            color: "#3a2614",
            align: "center",
        })
            .setOrigin(0.5, 0);
        this.root.add(this.titleText);
        this.bodyText = this.add
            .text(-bw / 2 + 30, -bh / 2 + 70, "", {
            fontFamily: "Georgia, serif",
            fontSize: "14px",
            color: "#2a1a0c",
            lineSpacing: 7,
            wordWrap: { width: bw - 60 },
        })
            .setOrigin(0, 0);
        this.root.add(this.bodyText);
        // page nav hints
        const prev = this.add
            .text(-bw / 2 + 20, bh / 2 - 22, "◀ prev", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "13px",
            color: "#5a3a1c",
        })
            .setOrigin(0, 1)
            .setInteractive({ useHandCursor: true });
        const next = this.add
            .text(bw / 2 - 20, bh / 2 - 22, "next ▶", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "13px",
            color: "#5a3a1c",
        })
            .setOrigin(1, 1)
            .setInteractive({ useHandCursor: true });
        this.pageLabel = this.add
            .text(0, bh / 2 - 18, "", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "12px",
            color: "#6b4a25",
        })
            .setOrigin(0.5, 1);
        const close = this.add
            .text(bw / 2 - 14, -bh / 2 + 14, "✕", {
            fontFamily: "Georgia, serif",
            fontSize: "18px",
            color: "#5a3a1c",
        })
            .setOrigin(1, 0)
            .setInteractive({ useHandCursor: true });
        this.root.add([prev, next, this.pageLabel, close]);
        prev.on("pointerdown", () => this.turn(-1));
        next.on("pointerdown", () => this.turn(1));
        close.on("pointerdown", () => this.closeBook());
        this.dim.on("pointerdown", () => this.closeBook());
        this.input.keyboard?.on("keydown-ESC", () => this.closeBook());
        this.input.keyboard?.on("keydown-LEFT", () => this.turn(-1));
        this.input.keyboard?.on("keydown-RIGHT", () => this.turn(1));
        this.renderPage();
        this.tweens.add({ targets: this.root, alpha: 1, duration: 350, ease: "sine.out" });
        playChime(520, 1.8, 0.05);
    }
    turn(dir) {
        const next = Phaser.Math.Clamp(this.pageIdx + dir, 0, PAGES.length - 1);
        if (next === this.pageIdx)
            return;
        this.pageIdx = next;
        playChime(420, 0.5, 0.04);
        this.tweens.add({
            targets: [this.titleText, this.bodyText],
            alpha: 0,
            duration: 140,
            onComplete: () => {
                this.renderPage();
                this.tweens.add({
                    targets: [this.titleText, this.bodyText],
                    alpha: 1,
                    duration: 220,
                });
            },
        });
    }
    renderPage() {
        const p = PAGES[this.pageIdx];
        this.titleText.setText(p.title);
        this.bodyText.setText(p.body.join("\n"));
        this.pageLabel.setText(`page ${this.pageIdx + 1} of ${PAGES.length}`);
    }
    closeBook() {
        this.registry.set("bookOpen", false);
        playChime(360, 1.2, 0.04);
        this.tweens.add({
            targets: this.root,
            alpha: 0,
            duration: 250,
            onComplete: () => this.scene.stop(),
        });
    }
}
// ===== Boot =====
(function () {
  const host = document.getElementById('game-host');
  const W = Math.max(320, host.clientWidth  || 960);
  const H = Math.max(240, host.clientHeight || 540);
  const game = new Phaser.Game({
    type: Phaser.AUTO, parent: host, width: W, height: H,
    backgroundColor: '#06080c', pixelArt: true, antialias: false, roundPixels: true,
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.NO_CENTER, parent: host, expandParent: false, width: W, height: H },
    scene: [TitleScene, CottageScene, MainScene, UIScene, SpellbookScene, FlightScene, TowerScene],
    input: { activePointers: 3 },
  });
  game.scene.start('title');
  game.scene.start('ui');
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    ['cottage','main','flight','tower'].forEach(function (k) {
      const s = game.scene.getScene(k);
      if (s && s.joyActive !== undefined) { s.joyActive = false; s.joyVec = { x: 0, y: 0 }; if (s.joyPointerId !== undefined) s.joyPointerId = -1; }
    });
  });
})();
</script>
</body>
</html>
