        if (this.inv.blood < 1)
            miss.push("bat blood");
        if (this.inv.moss < 1)
            miss.push("grave moss");
        if (this.inv.spirits.length < 3)
            miss.push(`${3 - this.inv.spirits.length} more spirits`);
        return "still need " + miss.join(", ");
    }
    bindSpirit(s) {
        if (this.inv.spirits.includes(s.name)) {
            this.flashHint(`${s.name} is already in the bottle`);
            return;
        }
        this.inv.spirits.push(s.name);
        this.emitInv();
        // dissolve spirit into the bottle
        this.tweens.add({
            targets: s.sprite,
            alpha: 0,
            scale: 0.4,
            duration: 1200,
            ease: "sine.in",
            onComplete: () => s.sprite.setVisible(false),
        });
        this.flashHint(`${s.name} bound (${this.inv.spirits.length}/3)`);
    }
    takeDamage(amount) {
        if (this.damageCooldown > 0 || this.ended)
            return;
        this.hp = Math.max(0, this.hp - amount);
        this.damageCooldown = 700;
        this.emitHp();
        // red flash
        this.cameras.main.shake(120, 0.005);
        this.player.setTint(0xff5555);
        this.time.delayedCall(180, () => this.player.clearTint());
        if (this.hp <= 0) {
            this.hp = 100;
            this.player.x = this.WORLD_W / 2;
            this.player.y = this.WORLD_H * 0.86;
            this.flashHint("You collapse. The cottage hearth pulls you back…");
            this.emitHp();
        }
    }
    // ===== Crow kill =====================================================
    setupCrowKillTarget() {
        // pick first raven as the throw-target
        if (this.ravens.length === 0)
            return;
        this.crowTarget = this.ravens[0];
        this.crowTarget.setScale(1.6);
        const crowIt = {
            x: 0, // dynamic — recomputed each frame via nearestInteractable distance
            y: 0,
            label: "Throw stone at crow",
            range: 90,
            action: () => {
                if (this.crowDead || !this.crowTarget)
                    return;
                if (this.inv.stone < 1) {
                    this.flashHint("You need a stone.");
                    return;
                }
                // Note: we keep inv.stone = 1 — the ritual checklist tracks that
                // a stone was gathered, not how many remain. Throwing consumes the
                // crow target (crowIt.done) so it can't be re-used.
                crowIt.done = true;
                this.emitInv();
                const c = this.crowTarget;
                // throw a stone projectile
                const proj = this.add
                    .image(this.player.x, this.player.y - 20, "stone_item")
                    .setScale(1.4)
                    .setDepth(10050);
                this.tweens.add({
                    targets: proj,
                    x: c.x,
                    y: c.y,
                    duration: 380,
                    onComplete: () => {
                        proj.destroy();
                        this.crowDead = true;
                        this.tweens.add({
                            targets: c,
                            y: this.WORLD_H * 0.7,
                            angle: 320,
                            alpha: 0.85,
                            duration: 700,
                            ease: "sine.in",
                            onComplete: () => {
                                c.stop();
                                c.setTexture("raven_0");
                                // drop a feather at the fall point
                                const fx = c.x;
                                const fy = c.y;
                                this.featherSprite = this.add
                                    .image(fx, fy, "feather_item")
                                    .setScale(1.4)
                                    .setDepth(fy);
                                const fg = this.add
                                    .image(fx, fy, "glow")
                                    .setBlendMode(Phaser.BlendModes.ADD)
                                    .setTint(0xc9a25b)
                                    .setScale(0.5)
                                    .setAlpha(0.5)
                                    .setDepth(fy - 0.1);
                                this.tweens.add({
                                    targets: fg,
                                    alpha: { from: 0.3, to: 0.7 },
                                    duration: 1200,
                                    yoyo: true,
                                    repeat: -1,
                                });
                                const featherIt = {
                                    x: fx,
                                    y: fy,
                                    label: "Pick up crow feather",
                                    range: 28,
                                    action: () => {
                                        if (this.inv.feather > 0)
                                            return;
                                        this.inv.feather = 1;
                                        this.featherSprite?.destroy();
                                        fg.destroy();
                                        this.flashHint("Crow feather gathered");
                                        featherIt.done = true;
                                        this.emitInv();
                                    },
                                };
                                this.interactables.push(featherIt);
                            },
                        });
                    },
                });
            },
        };
        this.interactables.push(crowIt);
        // store reference so update() can refresh interactable position
        this.crowTarget.setData("interactIdx", this.interactables.length - 1);
    }
    // ===== Bat ==========================================================
    buildBat(W, H) {
        this.batCx = W * 0.74;
        this.batCy = H * 0.36;
        this.anims.create({
            key: "bat_flap",
            frames: [{ key: "bat_0" }, { key: "bat_1" }],
            frameRate: 8,
            repeat: -1,
        });
        this.batSpr = this.add
            .sprite(this.batCx, this.batCy, "bat_0")
            .setScale(1.4)
            .setDepth(10005);
        this.batSpr.play("bat_flap");
        const batIt = {
            x: this.batCx,
            y: this.batCy,
            label: "Catch the bat",
            range: 36,
            action: () => {
                if (this.batCaptured)
                    return;
                if (this.inv.blood > 0)
                    return;
                this.batCaptured = true;
                this.inv.blood = 1;
                batIt.done = true;
                this.emitInv();
                this.flashHint("Bat caught — its blood fills the vial.");
                if (this.batSpr) {
                    this.tweens.add({
                        targets: this.batSpr,
                        alpha: 0,
                        scale: 0.4,
                        duration: 500,
                        onComplete: () => this.batSpr?.destroy(),
                    });
                }
            },
        };
        this.interactables.push(batIt);
        this.batSpr.setData("interactIdx", this.interactables.length - 1);
    }
    // ===== Chapel enemies (skeletons + evil souls) ======================
    buildChapelEnemies(W, H) {
        this.anims.create({
            key: "skeleton_walk",
            frames: [{ key: "skeleton_0" }, { key: "skeleton_1" }],
            frameRate: 4,
            repeat: -1,
        });
        const skelSpots = [
            [W * 0.35, H * 0.5],
            [W * 0.7, H * 0.62],
        ];
        skelSpots.forEach(([x, y]) => {
            const s = this.add.sprite(x, y, "skeleton_0").setOrigin(0.5, 1).setScale(2.2).setDepth(y);
            s.play("skeleton_walk");
            this.skeletons.push({ spr: s, vx: 0, vy: 0 });
        });
        // evil souls — drift on a path, cannot be caught
        const evilSpots = [
            [W * 0.5, H * 0.55, 80, 30],
            [W * 0.25, H * 0.7, 50, 40],
        ];
        evilSpots.forEach(([cx, cy, rx, ry]) => {
            const e = this.add
                .image(cx, cy, "evilsoul")
                .setOrigin(0.5, 1)
                .setScale(1.6)
                .setDepth(cy);
            const halo = this.add
                .image(cx, cy - 8, "glow")
                .setBlendMode(Phaser.BlendModes.ADD)
                .setTint(0xff2a18)
                .setScale(0.9)
                .setAlpha(0.4)
                .setDepth(cy - 0.1);
            this.tweens.add({
                targets: halo,
                alpha: { from: 0.3, to: 0.55 },
                duration: 800,
                yoyo: true,
                repeat: -1,
            });
            e.setData("halo", halo);
            this.evilSouls.push({ spr: e, t: Math.random() * 6.28, cx, cy, rx, ry });
        });
    }
    updateChapelEnemies(dt) {
        // skeletons chase
        this.skeletons.forEach((sk) => {
            const dx = this.player.x - sk.spr.x;
            const dy = this.player.y - sk.spr.y;
            const d = Math.hypot(dx, dy) || 1;
            const speed = 28;
            sk.spr.x += (dx / d) * speed * (dt / 1000);
            sk.spr.y += (dy / d) * speed * (dt / 1000);
            sk.spr.setDepth(sk.spr.y);
            sk.spr.setFlipX(dx < 0);
            if (d < 22)
                this.takeDamage(10);
        });
        // evil souls drift in elliptical patterns
        this.evilSouls.forEach((ev) => {
            ev.t += dt / 1000;
            ev.spr.x = ev.cx + Math.cos(ev.t * 0.8) * ev.rx;
            ev.spr.y = ev.cy + Math.sin(ev.t * 0.8) * ev.ry;
            const halo = ev.spr.getData("halo");
            if (halo) {
                halo.x = ev.spr.x;
                halo.y = ev.spr.y - 8;
            }
            ev.spr.setDepth(ev.spr.y);
            const d = Phaser.Math.Distance.Between(ev.spr.x, ev.spr.y, this.player.x, this.player.y);
            if (d < 24)
                this.takeDamage(15);
        });
        // bat hovers around its perch
        if (this.batSpr && !this.batCaptured) {
            this.batPhase += dt / 1000;
            this.batSpr.x = this.batCx + Math.cos(this.batPhase * 1.4) * 30;
            this.batSpr.y = this.batCy + Math.sin(this.batPhase * 2.2) * 12;
            // refresh interactable position
            const idx = this.batSpr.getData("interactIdx");
            if (this.interactables[idx]) {
                this.interactables[idx].x = this.batSpr.x;
                this.interactables[idx].y = this.batSpr.y;
            }
        }
        // crow target — interactable tracks the bird until killed
        if (this.crowTarget && !this.crowDead) {
            const idx = this.crowTarget.getData("interactIdx");
            if (this.interactables[idx]) {
                this.interactables[idx].x = this.crowTarget.x;
                this.interactables[idx].y = this.crowTarget.y;
            }
        }
    }
}

// ===== FlightScene =====
// Side-scrolling flight level. The witch rides her broom across a starry
// night sky. Bats and dark spirits drift toward her — she must dodge them,
// and may cast bursts of mana from her wand to vaporize the bats.
class FlightScene extends Phaser.Scene {
    constructor() {
        super("flight");
        this.bats = [];
        this.souls = [];
        this.ghouls = [];
        this.mana = [];
        this.hp = 100;
        this.manaPool = 100;
        this.manaCost = 8;
        this.manaPouches = [];
        this.towerSpawned = false;
        this.distance = 0;
        this.goalDistance = 5200;
        this.score = 0;
        this.joyActive = false;
        this.joyPointerId = -1;
        this.joyVec = { x: 0, y: 0 };
        this.joyOrigin = { x: 0, y: 0 };
        this.damageCooldown = 0;
        this.castCooldown = 0;
        this.ended = false;
    }
    preload() {
        buildTextures(this);
    }
    create() {
        const w = this.scale.width;
        const h = this.scale.height;
        // --- night sky background ---
        const sky = this.add.graphics().setDepth(0).setScrollFactor(0);
        sky.fillGradientStyle(0x05060f, 0x05060f, 0x1a1238, 0x1a1238, 1);
        sky.fillRect(0, 0, w, h);
        // --- far stars (twinkle) ---
        this.starsFar = this.add.graphics().setDepth(1).setScrollFactor(0);
        this.starsNear = this.add.graphics().setDepth(2).setScrollFactor(0);
        this.drawStars();
        // --- moon ---
        this.moon = this.add.graphics().setDepth(3).setScrollFactor(0);
        this.drawMoon(w * 0.78, h * 0.22);
        // --- drifting clouds ---
        this.makeCloudTexture();
        this.cloudsA = this.add
            .tileSprite(0, h * 0.35, w, 100, "flight_cloud")
            .setOrigin(0, 0)
            .setAlpha(0.35)
            .setDepth(4)
            .setScrollFactor(0);
        // distant mountain silhouette for depth
        this.makeMountainTexture();
        this.add
            .tileSprite(0, h - 80, w, 80, "flight_mountains")
            .setOrigin(0, 0)
            .setAlpha(0.6)
            .setDepth(5)
            .setScrollFactor(0)
            .setName("mountains");
        // ambient drifting sparkles
        if (this.textures.get("glow")) {
            this.add.particles(0, 0, "glow", {
                x: { min: 0, max: w },
                y: { min: 0, max: h * 0.75 },
                scale: { start: 0.08, end: 0 },
                alpha: { start: 0.9, end: 0 },
                lifespan: 2200,
                speedX: { min: -30, max: -10 },
                tint: [0xfff5d6, 0x9fe6df, 0xc9a25b, 0xe6b8ff],
                frequency: 80,
                blendMode: Phaser.BlendModes.ADD,
            }).setDepth(6).setScrollFactor(0);
        }
        // --- player on broom ---
        this.anims.create({
            key: "witch_fly",
            frames: [
                { key: "player_0" },
                { key: "player_1" },
            ],
            frameRate: 4,
            repeat: -1,
        });
        this.player = this.add.container(w * 0.25, h * 0.5).setDepth(50);
        // realistic broom — long shaft + bound straw bristles
        const broomImg = this.add
            .image(0, 16, "broom_item")
            .setOrigin(0.5, 0.5)
            .setScale(1.0);
        this.witchSpr = this.add
            .sprite(2, 4, "player_0")
            .setOrigin(0.5, 1)
            .setScale(2.0);
        this.witchSpr.play("witch_fly");
        this.wandSpr = this.add
            .image(10, -6, "wand_item")
            .setOrigin(0.15, 0.5)
            .setAngle(-30)
            .setScale(1.0);
        this.player.add([broomImg, this.witchSpr, this.wandSpr]);
        // gentle bob — applied to witch sprite only so vertical input still works
        this.tweens.add({
            targets: this.witchSpr,
            y: this.witchSpr.y - 4,
            duration: 900,
            yoyo: true,
            repeat: -1,
            ease: "sine.inOut",
        });
        // broom trail
        if (this.textures.get("glow")) {
            this.add
                .particles(0, 0, "glow", {
                follow: this.player,
                followOffset: { x: -28, y: 14 },
                scale: { start: 0.18, end: 0 },
                alpha: { start: 0.55, end: 0 },
                lifespan: 700,
                speedX: { min: -40, max: -20 },
                tint: [0x9fe6df, 0xc9a25b],
                frequency: 60,
                blendMode: Phaser.BlendModes.ADD,
            })
                .setDepth(49);
        }
        // --- input ---
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys("W,A,S,D,E,SPACE");
        this.keys.E.on("down", () => this.castMana());
        this.keys.SPACE.on("down", () => this.castMana());
        // --- touch controls ---
        this.buildTouchControls();
        // --- HUD ---
        this.scoreText = this.add
            .text(this.scale.width / 2, 44, "Bats: 0", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "13px",
            color: "#e6d8b0",
            stroke: "#000",
            strokeThickness: 3,
        })
            .setOrigin(0.5)
            .setDepth(1000)
            .setScrollFactor(0);
        this.hint = this.add
            .text(this.scale.width / 2, 70, "Tap ◆ or E to cast mana. Avoid the bats.", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: "12px",
            color: "#c9a25b",
            stroke: "#000",
            strokeThickness: 3,
        })
            .setOrigin(0.5)
            .setDepth(1000)
            .setScrollFactor(0)
            .setAlpha(1);
        this.tweens.add({ targets: this.hint, alpha: 0, delay: 5000, duration: 1200 });
        // HUD in UIScene
        const ui = this.scene.get("ui");
        ui.events.emit("hud_layout", "split");
        ui.events.emit("hud_show", true);
        ui.events.emit("inventory_show", false);
        ui.events.emit("mana_show", true);
        ui.events.emit("hp", this.hp);
        ui.events.emit("mana", this.manaPool);
        // Make sure the UI overlay (HP / mana bars) renders ABOVE the flight scene.
        this.scene.bringToTop("ui");
        this.onResize();
        // --- spawn loops ---
        this.time.addEvent({
            delay: 1400,
            loop: true,
            callback: () => this.spawnBat(),
        });
        this.time.addEvent({
            delay: 3800,
            loop: true,
            callback: () => this.spawnSoul(),
        });
        this.time.addEvent({
            delay: 4700,
            loop: true,
            callback: () => this.spawnGhoul(),
        });
        this.time.addEvent({
            delay: 600,
            loop: true,
            callback: () => this.spawnShootingStar(),
        });
        // --- ambience (wind via low rain layer) ---
        // rain removed — Halloween music only
        // Halloween carousel music — starts after a short intro delay
        // Defer music start so it doesn't block Phaser's create() frame
        setTimeout(() => {
            if (!this.flightMusic) this.flightMusic = startHalloweenMusic(0.16);
        }, 400);
        this.scale.on("resize", () => this.onResize());
        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
            this.flightMusic?.stop();
            this.flightMusic = undefined;
        });
    }
    drawStars() {
        const w = this.scale.width, h = this.scale.height;
        this.starsFar.clear();
        this.starsFar.fillStyle(0xfff5d6, 0.6);
        for (let i = 0; i < 90; i++) {
            const x = (i * 97) % w;
            const y = (i * 53) % (h * 0.7);
            this.starsFar.fillRect(x, y, 1, 1);
        }
        this.starsNear.clear();
        this.starsNear.fillStyle(0xffffff, 0.9);
        for (let i = 0; i < 40; i++) {
            const x = (i * 137 + 13) % w;
            const y = (i * 71 + 7) % (h * 0.6);
            this.starsNear.fillRect(x, y, 2, 2);
        }
    }
    drawMoon(x, y) {
        this.moon.clear();
        // glow
        this.moon.fillStyle(0xfff5d6, 0.15);
        this.moon.fillCircle(x, y, 60);
        this.moon.fillStyle(0xfff5d6, 0.25);
        this.moon.fillCircle(x, y, 44);
        // body
        this.moon.fillStyle(0xf4ead0, 1);
        this.moon.fillCircle(x, y, 30);
        // craters
        this.moon.fillStyle(0xc9be9a, 0.6);
        this.moon.fillCircle(x - 8, y - 6, 4);
        this.moon.fillCircle(x + 6, y + 8, 3);
        this.moon.fillCircle(x + 10, y - 10, 2);
    }
    makeCloudTexture() {
        if (this.textures.exists("flight_cloud"))
            return;
        const g = this.add.graphics();
        g.fillStyle(0x2a2350, 1);
        for (let i = 0; i < 6; i++) {
            const cx = i * 120 + 40;
            g.fillEllipse(cx, 50, 80, 22);
            g.fillEllipse(cx + 30, 56, 60, 18);
        }
        g.generateTexture("flight_cloud", 720, 100);
        g.destroy();
    }
    makeMountainTexture() {
        if (this.textures.exists("flight_mountains"))
            return;
        const g = this.add.graphics();
        g.fillStyle(0x0a0a18, 1);
        g.beginPath();
        g.moveTo(0, 80);
        let x = 0;
        while (x < 800) {
            const peak = 25 + Math.random() * 50;
            const w = 50 + Math.random() * 80;
            g.lineTo(x + w / 2, 80 - peak);
            g.lineTo(x + w, 80);
            x += w;
        }
        g.lineTo(800, 80);
        g.closePath();
        g.fillPath();
        g.generateTexture("flight_mountains", 800, 80);
        g.destroy();
    }
    spawnShootingStar() {
        if (this.ended)
            return;
        if (Math.random() > 0.35)
            return;
        const w = this.scale.width, h = this.scale.height;
        const sx = Math.random() * w;
        const sy = Math.random() * h * 0.5;
        const star = this.add
            .image(sx, sy, "glow")
            .setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0xfff5d6)
            .setScale(0.4)
            .setDepth(7)
            .setScrollFactor(0);
        this.tweens.add({
            targets: star,
            x: sx - 160,
            y: sy + 90,
            alpha: 0,
            scale: 0.1,
            duration: 700,
            onComplete: () => star.destroy(),
        });
    }
    spawnGhoul() {
        if (this.ended)
            return;
        const h = this.scale.height;
        const cy = 88 + Math.random() * Math.max(120, h - 230);
        const c = this.add.container(this.scale.width + 60, cy).setDepth(38);
        const aura = this.add
            .image(0, 0, "glow")
            .setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0x7a3acf)
            .setScale(2.4)
            .setAlpha(0.55);
        const body = this.add.graphics();
        body.fillStyle(0x1a0f24, 0.95);
        body.fillEllipse(0, 0, 50, 40);
        body.fillStyle(0x2a1740, 0.95);
        body.fillEllipse(-6, -4, 40, 32);
        body.fillStyle(0x140820, 0.95);
        for (let i = -2; i <= 2; i++) {
            const yj = 26 + Math.random() * 8;
            body.fillTriangle(i * 9, 16, i * 9 - 6, yj, i * 9 + 6, yj - 2);
        }
        const eyeL = this.add
            .circle(-8, -5, 3, 0xff4466)
            .setBlendMode(Phaser.BlendModes.ADD);
        const eyeR = this.add
            .circle(6, -5, 3, 0xff4466)
            .setBlendMode(Phaser.BlendModes.ADD);
        const mouth = this.add.graphics();
        mouth.fillStyle(0x000000, 1);
        mouth.fillEllipse(-1, 7, 14, 7);
        c.add([aura, body, mouth, eyeL, eyeR]);
        this.tweens.add({
            targets: aura,
            alpha: { from: 0.35, to: 0.8 },
            duration: 800,
            yoyo: true,
            repeat: -1,
        });
        const vx = -48 - Math.random() * 22;
        this.ghouls.push({ c, aura, vx, t: 0, cy, hp: 3, alive: true });
    }
    buildTouchControls() {
        const w = this.scale.width, h = this.scale.height;
        this.joyOrigin = { x: 80, y: h - 80 };
        this.joyBase = this.add
            .circle(80, h - 80, 52, 0x000000, 0.34)
            .setStrokeStyle(2, 0x8a7240, 0.6)
            .setDepth(1100)
            .setScrollFactor(0)
            .setAlpha(0.28);
        this.joyKnob = this.add
            .circle(80, h - 80, 24, 0xc9a25b, 0.78)
            .setStrokeStyle(1, 0xf4ead0, 0.6)
            .setDepth(1101)
            .setScrollFactor(0)
            .setAlpha(0.46);
        this.btnCast = this.add.container(w - 60, h - 80).setDepth(10200).setScrollFactor(0).setAlpha(0.95);
        const glow = this.add
            .circle(0, 0, 52, 0xc9a84c, 0.32)
            .setBlendMode(Phaser.BlendModes.ADD);
        const glow2 = this.add
            .circle(0, 0, 46, 0xc9a84c, 0.22)
            .setBlendMode(Phaser.BlendModes.ADD);
        const bg = this.add
            .circle(0, 0, 36, 0x1a0f2e, 0.95)
            .setStrokeStyle(2, 0xc9a84c, 1);
        const g = this.add
            .text(0, -2, "◆", { fontFamily: "serif", fontSize: "22px", color: "#c9a84c" })
            .setOrigin(0.5);
        const l = this.add
            .text(0, 18, "Cast", {
            fontFamily: "Georgia, serif",
            fontSize: "9px",
            color: "#c9a84c",
        })
            .setOrigin(0.5);
        this.btnCast.add([glow, glow2, bg, g, l]);
        bg.setInteractive({ useHandCursor: true });
        bg.on("pointerdown", () => {
            this.tweens.add({ targets: this.btnCast, scale: 0.9, duration: 80, yoyo: true });
            this.castMana();
        });
        this.input.on("pointerdown", (p) => {
            if (this.joyActive)
                return;
            if (p.x > this.scale.width * 0.5)
                return;
            this.joyActive = true;
            this.joyPointerId = p.id;
            this.joyOrigin = { x: p.x, y: p.y };
            this.joyBase.setPosition(p.x, p.y);
            this.joyKnob.setPosition(p.x, p.y);
            this.tweens.add({ targets: [this.joyBase, this.joyKnob], alpha: 1, duration: 150 });
        });
        this.input.on("pointermove", (p) => {
            if (!this.joyActive || p.id !== this.joyPointerId)
                return;
            const dx = p.x - this.joyOrigin.x;
            const dy = p.y - this.joyOrigin.y;
            const d = Math.hypot(dx, dy);
            const max = 36;
            const cd = Math.min(d, max);
            const ang = Math.atan2(dy, dx);
            this.joyKnob.setPosition(this.joyOrigin.x + Math.cos(ang) * cd, this.joyOrigin.y + Math.sin(ang) * cd);
            this.joyVec = { x: Math.cos(ang) * (cd / max), y: Math.sin(ang) * (cd / max) };
        });
        const end = (p) => {
            if (p.id !== this.joyPointerId) {
                if (this.joyActive && !this.input.pointer1?.isDown && !this.input.pointer2?.isDown) { this.joyActive = false; this.joyVec = { x: 0, y: 0 }; }
                return;
            }
            this.joyActive = false;
            this.joyVec = { x: 0, y: 0 };
            this.tweens.add({ targets: this.joyBase, alpha: 0.28, duration: 200 });
            this.tweens.add({ targets: this.joyKnob, alpha: 0.46, duration: 200 });
        };
        this.input.on("pointerup", end);
        this.input.on("pointerupoutside", end);
    }
    onResize() {
        const w = this.scale.width, h = this.scale.height;
        const f = getFrame(this);
        this.drawStars();
        this.drawMoon(f.x + f.w * 0.78, f.y + f.h * 0.22);
        this.cloudsA.setSize(f.w, 100);
        this.cloudsA.setPosition(f.x, f.y + f.h * 0.35);
        const m = this.children.getByName("mountains");
        if (m) {
            m.setSize(f.w, 80);
            m.setPosition(f.x, f.y + f.h - 80);
        }
        const pad = f.mobile ? 18 : 24;
        const controlY = f.mobile
            ? f.y + f.h + Math.min(f.bottomBand - 80, 80)
            : h - 80;
        // HP + mana bars sit above the game frame (handled by UIScene).
        // The flight score / hint also go above the frame on mobile so they
        // don't overlap the play area.
        this.scoreText.setPosition(w / 2, f.mobile ? Math.max(40, f.y - 50) : 44);
        this.hint.setPosition(w / 2, f.mobile ? Math.max(64, f.y - 28) : 70);
        this.hint.setFontSize(f.mobile ? 13 : 12);
        // Interact/cast button is pinned bottom-right (24px pad) on every device
        // so it sits above any panels and never overlaps the joystick.
        this.btnCast.setPosition(w - 24 - 36, h - 24 - 36);
        if (!this.joyActive) {
            this.joyOrigin = { x: pad + 56, y: controlY };
            this.joyBase.setPosition(this.joyOrigin.x, this.joyOrigin.y);
            this.joyKnob.setPosition(this.joyOrigin.x, this.joyOrigin.y);
        }
    }
    spawnBat() {
        if (this.ended)
            return;
        const h = this.scale.height;
        const y = 60 + Math.random() * (h - 160);
        const spr = this.add
            .sprite(this.scale.width + 30, y, "raven_0")
            .setScale(1.6)
            .setTint(0x3a2244)
            .setDepth(40);
        spr.play("fly");
        const vx = -90 - Math.random() * 50;
        const vy = (Math.random() - 0.5) * 30;
        this.bats.push({ spr, vx, vy, alive: true });
    }
    spawnSoul() {
        if (this.ended)
            return;
        const h = this.scale.height;
        const cy = 80 + Math.random() * (h - 200);
        const g = this.add
            .image(this.scale.width + 30, cy, "glow")
            .setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0x7a5acf)
            .setScale(1.6)
            .setAlpha(0.75)
            .setDepth(35);
        const vx = -60 - Math.random() * 30;
        this.souls.push({ g, vx, t: 0, cy });
    }
    castMana() {
        if (this.ended)
            return;
        if (this.castCooldown > 0)
            return;
        if (this.manaPool < this.manaCost) {
            // empty fizzle
            this.tweens.add({
                targets: this.wandSpr,
                scale: { from: 1.0, to: 1.15 },
                duration: 80,
                yoyo: true,
            });
            return;
        }
        this.manaPool = Math.max(0, this.manaPool - this.manaCost);
        this.scene.get("ui").events.emit("mana", this.manaPool);
        this.castCooldown = 280;
        const p = this.player;
        const m = this.add
            .image(p.x + 24, p.y - 4, "glow")
            .setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0x9fe6df)
            .setScale(0.5)
            .setAlpha(0.95)
            .setDepth(60);
        m.setData("vx", 420);
        this.mana.push(m);
        // wand flash
        this.tweens.add({
            targets: this.wandSpr,
            scale: { from: 1.3, to: 1.7 },
            duration: 100,
            yoyo: true,
        });
    }
    takeDamage(amount) {
        if (this.damageCooldown > 0 || this.ended)
            return;
        this.hp = Math.max(0, this.hp - amount);
        this.damageCooldown = 700;
        this.scene.get("ui").events.emit("hp", this.hp);
        this.cameras.main.shake(120, 0.005);
        this.witchSpr.setTint(0xff5555);
        this.time.delayedCall(180, () => this.witchSpr.clearTint());
        if (this.hp <= 0) {
            this.hp = 60;
            this.scene.get("ui").events.emit("hp", this.hp);
        }
    }
    spawnManaPouch(x, y) {
        const c = this.add.container(x, y).setDepth(45);
        const halo = this.add
            .image(0, 0, "glow")
            .setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0x6fb6e0)
            .setScale(1.4)
            .setAlpha(0.7);
        const sack = this.add.graphics();
        // small leather pouch
        sack.fillStyle(0x3a2414, 1);
        sack.fillEllipse(0, 2, 18, 16);
        sack.fillStyle(0x55351c, 1);
        sack.fillEllipse(-2, 0, 14, 12);
        // drawstring neck
        sack.fillStyle(0x1a0f08, 1);
        sack.fillRect(-4, -8, 8, 3);
        // glowing mana droplet inside
        const drop = this.add
            .circle(0, 0, 4, 0x9fe6df, 0.95)
            .setBlendMode(Phaser.BlendModes.ADD);
        c.add([halo, sack, drop]);
        this.tweens.add({
            targets: halo,
            alpha: { from: 0.4, to: 0.9 },
            scale: { from: 1.2, to: 1.6 },
            duration: 700,
            yoyo: true,
            repeat: -1,
        });
        this.manaPouches.push({ c, vx: -40, t: 0, cy: y });
    }
    spawnTower() {
        const f = getFrame(this);
        const tx = f.x + f.w + 120;
        // Anchor tower to the bottom of the playable frame so its entrance is
        // always reachable (the player is clamped within the frame).
        const ty = f.y + f.h - 10;
        const c = this.add.container(tx, ty).setDepth(20);
        const g = this.add.graphics();
        // tall stone tower body
        g.fillStyle(0x1a1820, 1);
        g.fillRect(-26, -260, 52, 280);
        g.fillStyle(0x2a2630, 1);
        g.fillRect(-22, -258, 44, 278);
        g.fillStyle(0x3a3540, 1);
        g.fillRect(-18, -256, 36, 274);
        // stone banding
        g.fillStyle(0x1a1820, 1);
        for (let i = 0; i < 14; i++) {
            g.fillRect(-22, -250 + i * 20, 44, 1);
        }
        // arched windows with warm glow
        for (let i = 0; i < 5; i++) {
            const wy = -210 + i * 40;
            g.fillStyle(0x0a0608, 1);
            g.fillRect(-5, wy, 10, 14);
            g.fillStyle(0xffc874, 0.9);
            g.fillRect(-4, wy + 1, 8, 12);
        }
        // crenellated top
        g.fillStyle(0x1a1820, 1);
        g.fillRect(-30, -270, 60, 14);
        for (let i = 0; i < 5; i++) {
            g.fillRect(-28 + i * 13, -278, 8, 10);
        }
        // conical spire
        g.fillStyle(0x2a1f3a, 1);
        g.fillTriangle(-22, -270, 22, -270, 0, -320);
        g.fillStyle(0x3b2f55, 1);
        g.fillTriangle(-18, -270, 18, -270, 0, -312);
        // flag
        g.fillStyle(0x1a0f08, 1);
        g.fillRect(-1, -340, 2, 28);
        g.fillStyle(0xb24a4a, 1);
        g.fillTriangle(1, -340, 14, -334, 1, -328);
        // glowing aura behind
        const aura = this.add
            .image(0, -160, "glow")
            .setBlendMode(Phaser.BlendModes.ADD)
            .setTint(0xffc874)
            .setScale(4)
            .setAlpha(0.35);
        c.add([aura, g]);
        this.tweens.add({
            targets: aura,
            alpha: { from: 0.25, to: 0.55 },
            duration: 1400,
            yoyo: true,
            repeat: -1,
        });
        this.tower = c;
        // beacon hint
        this.hint.setText("A high tower rises ahead — fly into it!");
        this.tweens.killTweensOf(this.hint);
        this.hint.setAlpha(1);
        this.tweens.add({ targets: this.hint, alpha: 0, delay: 4500, duration: 1200 });
    }
    finishLevel() {
        if (this.ended)
            return;
        this.ended = true;
        const ui = this.scene.get("ui");
        // sweep player into the tower
        this.tweens.add({
            targets: this.player,
            x: this.tower.x,
            y: this.tower.y - 140,
            scale: 0.4,
            alpha: 0.2,
            duration: 1100,
            ease: "sine.in",
        });
        this.cameras.main.flash(700, 255, 240, 200);
        this.time.delayedCall(1200, () => {
            ui.events.emit("cine_line", "She vanishes into the tower's amber light.");
        });
        this.time.delayedCall(2800, () => {
            this.cameras.main.fadeOut(900, 0, 0, 0);
        });
        this.time.delayedCall(3800, () => {
            ui.events.emit("hud_show", false);
            this.scene.start("tower");
        });
    }
    update(time, dt) {
        // (methods below moved before update)
        void time;
        if (this.ended)
            return;
        // Passive mana regen — slow trickle so casting stays fun
        if (this.manaPool < 100) {
            this.manaPool = Math.min(100, this.manaPool + dt * 0.018);
            if (Math.random() < 0.04) this.scene.get("ui").events.emit("mana", this.manaPool);
        }
        // input → move
        let vx = 0, vy = 0;
        if (this.cursors.left?.isDown || this.keys.A?.isDown)
            vx -= 1;
        if (this.cursors.right?.isDown || this.keys.D?.isDown)
            vx += 1;
        if (this.cursors.up?.isDown || this.keys.W?.isDown)
            vy -= 1;
        if (this.cursors.down?.isDown || this.keys.S?.isDown)
            vy += 1;
        if (this.joyActive) {
            vx += this.joyVec.x;
            vy += this.joyVec.y;
        }
        const len = Math.hypot(vx, vy) || 1;
        const speed = 160;
        const f = getFrame(this);
        const h = this.scale.height;
        this.player.x = Phaser.Math.Clamp(this.player.x + (vx / len) * speed * (dt / 1000), f.x + 40, f.x + f.w - 40);
        this.player.y = Phaser.Math.Clamp(this.player.y + (vy / len) * speed * (dt / 1000), f.y + 40, h - 18);
        if (vx < 0)
            this.witchSpr.setFlipX(true);
        else if (vx > 0)
            this.witchSpr.setFlipX(false);
        // clouds drift
        this.cloudsA.tilePositionX += (dt / 1000) * 30;
        // bats
        this.bats.forEach((b) => {
            if (!b.alive)
                return;
            b.spr.x += b.vx * (dt / 1000);
            b.spr.y += b.vy * (dt / 1000);
            // gentle home toward player y
            b.vy += (this.player.y - b.spr.y) * 0.001 * (dt / 1000) * 100;
            b.vy = Phaser.Math.Clamp(b.vy, -60, 60);
            // collide with player
            if (Math.abs(b.spr.x - this.player.x) < 28 &&
                Math.abs(b.spr.y - this.player.y) < 22) {
                this.takeDamage(12);
                b.alive = false;
                this.tweens.add({
                    targets: b.spr,
                    alpha: 0,
                    scale: 0.5,
                    duration: 250,
                    onComplete: () => b.spr.destroy(),
                });
            }
            // collide with mana
            this.mana.forEach((m) => {
                if (!b.alive)
                    return;
                if (Math.abs(m.x - b.spr.x) < 22 &&
                    Math.abs(m.y - b.spr.y) < 18) {
                    b.alive = false;
                    this.score += 1;
                    this.scoreText.setText(`Bats: ${this.score}`);
                    // poof
                    const poof = this.add
                        .image(b.spr.x, b.spr.y, "glow")
                        .setBlendMode(Phaser.BlendModes.ADD)
                        .setTint(0x9fe6df)
                        .setScale(0.8)
                        .setDepth(60);
                    this.tweens.add({
                        targets: poof,
                        alpha: 0,
                        scale: 1.6,
                        duration: 400,
                        onComplete: () => poof.destroy(),
                    });
                    b.spr.destroy();
                    m.destroy();
                }
            });
            if (b.spr.x < -40)
                b.spr.destroy();
        });
        this.bats = this.bats.filter((b) => b.alive && b.spr.active);
        this.mana = this.mana.filter((m) => m.active);
        // souls (dangerous, can't be killed)
        this.souls.forEach((s) => {
            s.t += dt;
            s.g.x += s.vx * (dt / 1000);
            s.g.y = s.cy + Math.sin(s.t / 400) * 20;
            if (Math.abs(s.g.x - this.player.x) < 26 &&
                Math.abs(s.g.y - this.player.y) < 26) {
                this.takeDamage(8);
            }
        });
        this.souls = this.souls.filter((s) => {
            if (s.g.x < -40) {
                s.g.destroy();
                return false;
            }
            return true;
        });
        // ghouls (big, take 3 hits, deal heavy damage)
        this.ghouls.forEach((gh) => {
            if (!gh.alive)
                return;
            gh.t += dt;
            gh.c.x += gh.vx * (dt / 1000);
            gh.c.y = gh.cy + Math.sin(gh.t / 500) * 28;
            // drift toward player slowly
            gh.cy += (this.player.y - gh.c.y) * 0.0006 * dt;
            if (Math.abs(gh.c.x - this.player.x) < 34 &&
                Math.abs(gh.c.y - this.player.y) < 30) {
                this.takeDamage(18);
            }
            this.mana.forEach((m) => {
                if (!gh.alive)
                    return;
                if (Math.abs(m.x - gh.c.x) < 30 && Math.abs(m.y - gh.c.y) < 26) {
                    gh.hp -= 1;
                    // hit flash
                    const flash = this.add
                        .image(m.x, m.y, "glow")
                        .setBlendMode(Phaser.BlendModes.ADD)
                        .setTint(0xff66aa)
                        .setScale(0.7)
                        .setDepth(60);
                    this.tweens.add({
                        targets: flash,
                        alpha: 0,
                        scale: 1.4,
                        duration: 280,
                        onComplete: () => flash.destroy(),
                    });
                    m.destroy();
                    if (gh.hp <= 0) {
                        gh.alive = false;
                        this.score += 5;
                        this.scoreText.setText(`Bats: ${this.score}`);
                        const burst = this.add
                            .image(gh.c.x, gh.c.y, "glow")
                            .setBlendMode(Phaser.BlendModes.ADD)
                            .setTint(0xc97aff)
                            .setScale(1.2)
                            .setDepth(60);
                        this.tweens.add({
                            targets: burst,
                            alpha: 0,
                            scale: 3,
                            duration: 600,
                            onComplete: () => burst.destroy(),
                        });
                        // drop a mana pouch where the ghoul fell
                        this.spawnManaPouch(gh.c.x, gh.c.y);
                        gh.c.destroy();
                    }
                }
            });
        });
        this.ghouls = this.ghouls.filter((gh) => {
            if (gh.alive && gh.c.x < -60) {
                gh.c.destroy();
                return false;
            }
            return gh.alive;
        });
        // mana pouches: drift left, gentle bob, collectible
        this.manaPouches.forEach((p) => {
            p.t += dt;
            p.c.x += p.vx * (dt / 1000);
            p.c.y = p.cy + Math.sin(p.t / 300) * 8;
            if (Math.abs(p.c.x - this.player.x) < 26 &&
                Math.abs(p.c.y - this.player.y) < 24) {
                this.manaPool = Math.min(100, this.manaPool + 55);
                this.scene.get("ui").events.emit("mana", this.manaPool);
                const sparkle = this.add
                    .image(p.c.x, p.c.y, "glow")
                    .setBlendMode(Phaser.BlendModes.ADD)
                    .setTint(0x9fe6df)
                    .setScale(0.9)
                    .setDepth(60);
                this.tweens.add({
                    targets: sparkle,
                    alpha: 0,
                    scale: 2,
                    duration: 420,
                    onComplete: () => sparkle.destroy(),
                });
                p.c.destroy();
            }
        });
        this.manaPouches = this.manaPouches.filter((p) => {
            if (!p.c.active)
                return false;
            if (p.c.x < -40) {
                p.c.destroy();
                return false;
            }
            return true;
        });
        // distance accumulates while the witch flies forward (always moving with world)
        this.distance += (dt / 1000) * 90;
        if (!this.towerSpawned && this.distance >= this.goalDistance) {
            this.towerSpawned = true;
            this.spawnTower();
        }
        if (this.tower) {
            this.tower.x -= (dt / 1000) * 60;
            if (!this.ended &&
                Math.abs(this.tower.x - this.player.x) < 44 &&
                this.player.y > this.tower.y - 240 &&
                this.player.y < this.tower.y + 20) {
                this.finishLevel();
            }
        }
        // mana projectiles
        this.mana.forEach((m) => {
            m.x += m.getData("vx") * (dt / 1000);
            if (m.x > this.scale.width + 30)
                m.destroy();
        });
        if (this.castCooldown > 0)
            this.castCooldown -= dt;
        if (this.damageCooldown > 0)
            this.damageCooldown -= dt;
    }
}

// ===== TowerScene =====
// Three-floor tower:
//   Floor 1 — Decorated vampire hall, clear spiders + Lord Vyrin
//   Floor 2 — Investigation corridor: find 3 clues (diary page, amulet, blood vial) to unlock Floor 3
//   Floor 3 — Werewolf lair: defeat Prof. Lyall in 3 phases → victory
class TowerScene extends Phaser.Scene {
    constructor() {
        super("tower");
        this.hp = 100;
        this.mana = 100;
        this.stage = "intro";
        this.bats = [];
        this.bullets = [];
        this.spiders = [];
        this.vampire = undefined;
        this.vampireHp = 0;
        this.werewolf = undefined;
        this.wolfHp = 100;
        this.wolfPhase = 1;
        this.joyActive = false;
        this.joyPointerId = -1;
        this.joyVec = { x: 0, y: 0 };
        this.joyOrigin = { x: 0, y: 0 };
        this.damageCd = 0;
        this.castCd = 0;
        this.facing = 1;
        this.aim = { x: 1, y: 0 };
        this.arena = { x: 0, y: 0, w: 0, h: 0 };
        this.currentFloor = 1;
        // Floor 2 clue hunting
        this.cluesFound = 0;
        this.cluesNeeded = 3;
        this.clueItems = [];
        this.stairDownVisible = false;
        this.bossMusic = null;
    }

    preload() { buildTextures(this); }

    create() {
        const w = this.scale.width, h = this.scale.height;
        this.buildFloor1(w, h);
        this.buildTouchControls(w, h);
        this.buildBanner(w, h);

        const ui = this.scene.get("ui");
        // Small delay so any outgoing hud_show fade-tween from FlightScene finishes
        // before we reset layout and HP — prevents the bar staying invisible.
        // Step 1: set layout immediately
        ui.events.emit("hud_layout", "split");
        ui.events.emit("hud_show", true);
        ui.events.emit("mana_show", true);
        ui.events.emit("inventory_show", false);
        // Step 2: emit actual hp/mana values after layout has settled (2 frames later)
        this.time.delayedCall(80, () => {
            ui.events.emit("hp", this.hp);
            ui.events.emit("mana", this.mana);
        });
        this.scene.bringToTop("ui");

        this.cameras.main.fadeIn(700, 0, 0, 0);
        this.showBanner("THE TOWER — Floor I", 2400);
        this.time.delayedCall(1600, () => {
            ui.events.emit("cine_line", "Cold stone. Webs. Somewhere above — a heartbeat that is not yours.");
        });
        this.time.delayedCall(500, () => {
            // Re-emit after UIScene has definitely settled
            ui.events.emit("hp", this.hp);
            ui.events.emit("mana", this.mana);
        });
        // Heartbeat: keep HP bar in sync every 2s in case of any missed emit
        this.time.addEvent({ delay: 2000, loop: true, callback: () => {
            if (this.stage !== "won") {
                this.scene.get("ui").events.emit("hp", this.hp);
                this.scene.get("ui").events.emit("mana", this.mana);
            }
        }});
        this.time.delayedCall(4600, () => {
            ui.events.emit("cine_fadeout");
            this.beginSpiders();
        });
        this.scale.on("resize", () => this.onResize());
    }

    // ─── FLOOR 1 ─────────────────────────────────────────────────────────────
    buildFloor1(w, h) {
        const wallH = Math.min(80, Math.round(h * 0.18));

        // Stone floor
        const floor = this.add.graphics().setDepth(0);
        floor.fillStyle(0x14101a, 1);
        floor.fillRect(0, 0, w, h);
        floor.fillStyle(0x1f1a26, 1);
        for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 32) {
            if (((x / 32 + y / 32) & 1) === 0) floor.fillRect(x, y, 32, 32);
        }
        floor.lineStyle(1, 0x05030a, 0.6);
        for (let y = 0; y < h; y += 32) floor.lineBetween(0, y, w, y);
        for (let x = 0; x < w; x += 32) floor.lineBetween(x, 0, x, h);

        // Walls
        const walls = this.add.graphics().setDepth(2);
        walls.fillStyle(0x0a0610, 1); walls.fillRect(0, 0, w, wallH);
        walls.fillStyle(0x241a30, 1);
        for (let y = 0; y < wallH; y += 10) for (let x = 0; x < w; x += 22) {
            const off = ((y / 10) | 0) & 1 ? 11 : 0;
            walls.fillRect(x + off, y, 20, 9);
        }
        walls.fillStyle(0x05030a, 1); walls.fillRect(0, wallH - 3, w, 3);

        // Moon window
        const mx = w / 2, my = wallH / 2 + 4;
        walls.fillStyle(0x0a0510, 1); walls.fillCircle(mx, my, 26);
        walls.fillStyle(0xfff5d6, 0.7); walls.fillCircle(mx, my, 22);
        walls.fillStyle(0x6b5a2a, 1);
        walls.fillRect(mx - 26, my - 1, 52, 2);
        walls.fillRect(mx - 1, my - 26, 2, 52);

            .setBlendMode(Phaser.BlendModes.ADD).setTint(0xfff5d6).setScale(4).setAlpha(0.35).setDepth(1);
        this.tweens.add({ targets: moonGlow, alpha: { from: 0.25, to: 0.5 }, duration: 2400, yoyo: true, repeat: -1 });

        // ── Decorations ──
        this.addFloor1Decorations(w, h, wallH);

        // ── Spiral staircase DOWN (right side, visible but locked until vampire dies) ──
        this.buildSpiralStairDown(w, h, wallH);

        // Cobwebs
        if (this.textures.exists("cobweb")) {
            this.add.image(0, wallH, "cobweb").setOrigin(0, 0).setAlpha(0.55).setDepth(3);
            this.add.image(w, wallH, "cobweb").setOrigin(0, 0).setAlpha(0.55).setFlipX(true).setDepth(3);
        }

        // Candelabras
        [w * 0.18, w * 0.82].forEach(cx => {
            const cy = wallH + 60;
            this.add.image(cx, cy, "candelabra").setOrigin(0.5, 1).setDepth(cy);

                .setTint(0xffc874).setScale(1.4).setAlpha(0.55).setDepth(cy - 0.1);

        this.arena = { x: 20, y: wallH + 20, w: w - 40, h: h - wallH - 40 };

        // Player
        if (!this.anims.exists("walk")) {
            this.anims.create({ key: "walk", frames: [0,1,0,2].map(i => ({ key: `player_${i}` })), frameRate: 8, repeat: -1 });
        }
        this.player = this.add.sprite(w / 2, this.arena.y + this.arena.h - 20, "player_0")
            .setOrigin(0.5, 1).setScale(2.2).setDepth(this.arena.y + this.arena.h);
        this.player.play("walk");
        this.add.image(this.player.x, this.player.y - 24, "glow")
            .setBlendMode(Phaser.BlendModes.ADD).setTint(0xc9a25b).setScale(1.1).setAlpha(0.5)
            .setDepth(this.player.depth - 1).setName("playerHalo");

        // Input
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys("W,A,S,D,E,SPACE");
        this.keys.E.on("down", () => this.castWand());
        this.keys.SPACE.on("down", () => this.castWand());
    }

        g.fillStyle(0x3a2a18, 1); g.fillRect(clkX - 10, clkY - 74, 20, 26); // glass door
        g.fillStyle(0x9fe6df, 0.35); g.fillRect(clkX - 9, clkY - 73, 18, 24);
        // clock face
        g.fillStyle(0xf0e0b0, 1); g.fillCircle(clkX, clkY - 60, 8);
        g.fillStyle(0x1a0f06, 1);

            pendAngle += 0.04;
            pendG.clear();
            pendG.fillStyle(0x8a6a3a, 0.8);

        g.fillRect(thrX - 24, thrY + 16, 8, 22); // legs
        g.fillRect(thrX + 16, thrY + 16, 8, 22);
        g.fillStyle(0x3a1820, 1); g.fillRect(thrX - 18, thrY - 46, 36, 54); // cushion
        g.fillStyle(0xc9a84c, 0.7);
        // carved skull on throne back

        g.fillStyle(0x1a0f06, 1);
        g.fillCircle(thrX - 2, thrY - 39, 1.5);
        g.fillCircle(thrX + 2, thrY - 39, 1.5);
        g.fillRect(thrX - 2, thrY - 36, 4, 1);

        // ── Bookshelf (left of centre) ──
        const bsX = w * 0.3, bsY = wallH + 70;
        g.fillStyle(0x1a0f06, 1); g.fillRect(bsX - 22, bsY - 60, 44, 62);
        const bookColors = [0x4a1520, 0x2a3c5a, 0x5a3a14, 0x2a4a2a, 0x3a1a4a];
        for (let row = 0; row < 3; row++) {

        g.lineStyle(2, 0x8a6a3a, 1); g.strokeRect(ptX - 18, ptY - 28, 36, 44);
        g.fillStyle(0x2d1a2a, 1); g.fillRect(ptX - 15, ptY - 25, 30, 38); // dark painting
        // painted figure (vampire lord silhouette)
        g.fillStyle(0x1a0510, 1); g.fillCircle(ptX, ptY - 10, 6);
        g.fillStyle(0x2a0a18, 1); g.fillRect(ptX - 6, ptY - 4, 12, 16);
        // cape
        g.fillTriangle(ptX - 6, ptY - 4, ptX - 14, ptY + 12, ptX, ptY + 10);

        // ── Wall sconces ──
        [w * 0.25, w * 0.5, w * 0.75].forEach(sx => {
            const sy = wallH + 4;
            g.fillStyle(0x3a2a18, 1);
            g.fillRect(sx - 3, sy, 6, 10);
            g.fillStyle(0xf0e0b0, 1); g.fillRect(sx - 2, sy - 4, 4, 5);
            g.fillStyle(0xffc874, 1); g.fillCircle(sx, sy - 5, 2);
            this.add.image(sx, sy - 5, "glow").setBlendMode(Phaser.BlendModes.ADD)

        g.fillCircle(cfX, cfY - 20, 8);
        g.fillStyle(0xc9a84c, 0.8); g.fillCircle(cfX, cfY + 14, 3); // latch
        this.add.image(cfX, cfY, "glow").setBlendMode(Phaser.BlendModes.ADD)

        // ── Cauldron (bubbling, decorative) ──
        const cauldX = w * 0.38, cauldY = h * 0.65;
        g.fillStyle(0x1a1018, 1); g.fillEllipse(cauldX, cauldY, 32, 18);
        g.fillStyle(0x0f0c14, 1); g.fillEllipse(cauldX, cauldY - 4, 28, 16);
        g.fillStyle(0x4a1a30, 0.8); g.fillEllipse(cauldX, cauldY - 5, 22, 9); // brew surface
        g.fillStyle(0x1a0f10, 1);
        g.fillRect(cauldX - 16, cauldY, 32, 4); // rim

    }

    buildSpiralStairDown(w, h, wallH) {
        const sx = w - 55, sy = h - 90;
        const sg = this.add.graphics().setDepth(sy - 1);

        // Draw spiral staircase footprint
        sg.fillStyle(0x2a2030, 1); sg.fillCircle(sx, sy, 32);
        sg.fillStyle(0x3a3048, 1); sg.fillCircle(sx, sy, 26);
        sg.fillStyle(0x14101a, 1); sg.fillCircle(sx, sy, 10); // dark centre hole
        // Steps
        sg.lineStyle(2, 0x4a3a60, 1);
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            sg.lineBetween(sx, sy, sx + Math.cos(ang) * 26, sy + Math.sin(ang) * 26);
        }
        sg.lineStyle(1, 0x6a5a80, 0.6);
        sg.strokeCircle(sx, sy, 18);

        // Label
        this.stairLabel = this.add.text(sx, sy - 42, "▼ Descend", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "11px",
            color: "#6a5a80", stroke: "#000", strokeThickness: 2
        }).setOrigin(0.5).setDepth(sy + 1).setAlpha(0.5);

        // Lock indicator
        this.stairLock = this.add.text(sx, sy - 28, "🔒 Defeat the Vampire", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "10px",
            color: "#8a1a1a", stroke: "#000", strokeThickness: 2
        }).setOrigin(0.5).setDepth(sy + 1);

        // Glow (locked state = red)
        this.stairGlow = this.add.image(sx, sy, "glow")
            .setBlendMode(Phaser.BlendModes.ADD).setTint(0x8a1a1a).setScale(1.6).setAlpha(0.3).setDepth(sy - 2);

        this.stairX = sx; this.stairY = sy;
        this.stairUnlocked = false;
    }

    unlockStairDown() {
        this.stairUnlocked = true;
        this.stairLock.destroy();
        this.stairLabel.setText("▼ Descend to Floor II").setAlpha(1).setColor("#9fe6df");
        this.stairGlow.setTint(0x9fe6df);
        this.tweens.add({ targets: this.stairGlow, alpha: { from: 0.2, to: 0.6 }, duration: 900, yoyo: true, repeat: -1 });
        this.tweens.add({ targets: this.stairLabel, y: this.stairLabel.y - 4, duration: 800, yoyo: true, repeat: -1 });
        playChime(440, 2.0, 0.07);
        this.scene.get("ui").events.emit("cine_line", "The staircase unlocks. Floor II awaits below.");
    }

    // ─── FLOOR 2 ─────────────────────────────────────────────────────────────
    buildFloor2(w, h) {
        this.currentFloor = 2;
        this.cluesFound = 0;
        this.clueItems = [];

        // Wipe floor 1 children (except player, UI, controls)
        // Destroy all floor-1 display objects except the player, joystick, cast button, and banner
        [...this.children.list].forEach(c => {
            if (c === this.player) return;
            if (c === this.joyBase || c === this.joyKnob) return;
            if (c === this.btnCast || c === this.btnInteract) return;
            if (c === this.banner) return;
            try { c.destroy(); } catch {}
        });

        // Dark corridor, narrower — feels underground
        const wallH = Math.min(60, Math.round(h * 0.14));
        const floor = this.add.graphics().setDepth(0);
        floor.fillStyle(0x0a0810, 1); floor.fillRect(0, 0, w, h);
        // rough stone
        floor.fillStyle(0x12101a, 1);
        for (let y = 0; y < h; y += 24) for (let x = 0; x < w; x += 40) {
            floor.fillRect(x + (y % 40 ? 20 : 0), y, 38, 22);
        }
        // blood trails
        this.addBloodTrails(floor, w, h);

        // Dark walls
        const walls = this.add.graphics().setDepth(2);
        walls.fillStyle(0x06040c, 1); walls.fillRect(0, 0, w, wallH);
        walls.fillStyle(0x140e1e, 1);
        for (let y = 0; y < wallH; y += 8) for (let x = 0; x < w; x += 18) {
            const off = ((y / 8) | 0) & 1 ? 9 : 0;
            walls.fillRect(x + off, y, 17, 7);
        }
        walls.fillStyle(0x000000, 1); walls.fillRect(0, wallH - 2, w, 2);

        // Staircase UP (back to floor 1) — left side
        this.buildStairUp(w, h, wallH);
        // Staircase DOWN (to floor 3) — right side, locked until all clues found
        this.buildStairToFloor3(w, h, wallH);

        // Investigation decorations + clue objects
        this.addFloor2Decorations(w, h, wallH);
        this.spawnClues(w, h);

        this.arena = { x: 20, y: wallH + 20, w: w - 40, h: h - wallH - 40 };

        // Reposition player
        this.player.setPosition(80, h / 2).setDepth(h / 2);
        if (!this.player.active) return;

        // Clue counter
        this.clueCounter = this.add.text(w / 2, wallH + 14, "Clues found: 0 / 3", {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "13px",
            color: "#c9a25b", stroke: "#000", strokeThickness: 3
        }).setOrigin(0.5).setDepth(9999);

        this.scene.get("ui").events.emit("cine_line", "Something terrible happened here. Find what remains.");
    }

    addBloodTrails(g, w, h) {
        // Dragged body trails — thick dark red smears
        g.fillStyle(0x5a0808, 0.9);
        const trails = [
            [w * 0.3, h * 0.3, w * 0.6, h * 0.5],
            [w * 0.7, h * 0.6, w * 0.4, h * 0.8],
            [w * 0.15, h * 0.6, w * 0.35, h * 0.7],
            [w * 0.8, h * 0.35, w * 0.55, h * 0.45],
        ];
        trails.forEach(([x1, y1, x2, y2]) => {
            const steps = 20;
            for (let i = 0; i < steps; i++) {
                const t = i / steps;
                const x = x1 + (x2 - x1) * t + (Math.sin(i * 1.7) * 6);
                const y = y1 + (y2 - y1) * t;
                const r = 3 + Math.sin(i * 0.8) * 2;
                g.fillEllipse(x, y, r * 2, r);
                // drip spots
                if (i % 4 === 0) g.fillCircle(x + 8, y + 4, 2);
            }
        });
        // Splatter pools
        g.fillStyle(0x3a0505, 0.85);
        [[w * 0.55, h * 0.48], [w * 0.35, h * 0.72], [w * 0.78, h * 0.35]].forEach(([x, y]) => {
            g.fillEllipse(x, y, 28, 14);
            g.fillEllipse(x - 10, y + 8, 12, 6);
        });
        // Handprint smears on wall (decorative)
        g.fillStyle(0x5a0808, 0.6);
        [[w * 0.2, h * 0.22], [w * 0.65, h * 0.18]].forEach(([x, y]) => {
            g.fillCircle(x, y, 8);
            for (let f = 0; f < 4; f++) g.fillRect(x - 5 + f * 3, y - 14, 2, 10);
        });
    }

    addFloor2Decorations(w, h, wallH) {
        const g = this.add.graphics().setDepth(3);

        // ── Slumped victim silhouettes (storytelling) ──
        // Victim 1: leaning against left wall
        const v1x = 40, v1y = h * 0.45;
        g.fillStyle(0x1a0f10, 1);
        g.fillEllipse(v1x, v1y - 20, 14, 14); // head
        g.fillRect(v1x - 6, v1y - 12, 12, 20); // body
        g.fillRect(v1x - 10, v1y + 2, 8, 4); // arm out
        g.fillStyle(0xd7b48a, 0.4); g.fillEllipse(v1x, v1y - 20, 10, 10); // pale face
        g.fillStyle(0x5a0808, 0.7); g.fillCircle(v1x + 4, v1y - 17, 2); // bite mark
        g.fillCircle(v1x + 6, v1y - 17, 1.5);

        // Victim 2: face-down, middle of room
        const v2x = w * 0.45, v2y = h * 0.62;
        g.fillStyle(0x1a0f10, 1);
        g.fillEllipse(v2x - 16, v2y, 14, 10); // head
        g.fillRect(v2x - 14, v2y - 4, 28, 10); // body
        g.fillRect(v2x + 10, v2y - 8, 14, 4); // arm
        g.fillRect(v2x - 20, v2y + 4, 4, 14); // leg

        // Victim 3: seated, right wall
        const v3x = w - 36, v3y = h * 0.55;
        g.fillStyle(0x1a0f10, 1);
        g.fillEllipse(v3x, v3y - 22, 12, 12);
        g.fillRect(v3x - 5, v3y - 12, 10, 18);
        g.fillRect(v3x - 10, v3y + 4, 20, 4); // legs
        g.fillStyle(0xd7b48a, 0.3); g.fillEllipse(v3x, v3y - 22, 8, 8);

        // ── Scattered furniture wreckage ──
        g.fillStyle(0x1a0f06, 1);
        // broken table
        g.fillRect(w * 0.3 - 18, h * 0.4, 36, 3);
        g.fillRect(w * 0.3 - 16, h * 0.4 + 3, 4, 14); // one leg standing
        g.fillRect(w * 0.3 + 14, h * 0.4 - 6, 3, 4); // one leg snapped
        g.fillRect(w * 0.3 - 4, h * 0.4 + 5, 24, 2); // fallen plank

        // ── Wall inscriptions (bloody writing) ──
        this.add.text(w * 0.5, wallH + 22, '"HE IS BELOW — DO NOT FOLLOW"', {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "10px",
            color: "#5a0808", stroke: "#000", strokeThickness: 1, alpha: 0.7
        }).setOrigin(0.5).setDepth(3.5);

        this.add.text(w * 0.25, h * 0.38, '"night after night—"', {
            fontFamily: "Georgia, serif", fontStyle: "italic", fontSize: "9px",
            color: "#3a0505", alpha: 0.6
        }).setDepth(3.5);

        // ── Scattered candles (dim, some tipped over) ──
        [[w * 0.2, h * 0.55, false], [w * 0.6, h * 0.42, true], [w * 0.75, h * 0.68, false]].forEach(([cx, cy, tipped]) => {
            g.fillStyle(0xf0e0b0, 1);
            if (tipped) {
                g.fillRect(cx - 8, cy - 1, 14, 3); // lying down
            } else {
                g.fillRect(cx - 1, cy - 12, 3, 12);
                g.fillStyle(0xffc874, 0.5); g.fillCircle(cx, cy - 13, 2);
                this.add.image(cx, cy - 13, "glow").setBlendMode(Phaser.BlendModes.ADD)
                    .setTint(0xffc874).setScale(0.5).setAlpha(0.3).setDepth(3.6);
            }

        // ── Hanging chains from ceiling ──
        g.lineStyle(1, 0x3a3050, 0.8);
        [w * 0.3, w * 0.55, w * 0.72].forEach(cx => {
            const chainLen = wallH + 18 + Math.random() * 30;
            for (let i = 0; i < chainLen; i += 5) {
                g.fillStyle(0x2a2040, 1);
                g.fillRect(cx - 1, i, 2 + (i % 2), 3);
            }
            g.fillStyle(0x1a1828, 1); g.fillCircle(cx, chainLen, 4);
