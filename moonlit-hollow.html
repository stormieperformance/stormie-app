<script>
// ===== palette =====

    grassMid: 0x2c3b2d,

    brickHi: 0x5a4f42,

    roofHi: 0x3b3149,

    windowGlow: 0xffd084,

    leafDark: 0x1a2a1c,
    leafMid: 0x2d4225,
    leafHi: 0x4a6a36,
    bark: 0x2a201a,

    skyDusk: 0x1a1424,

const PAL = _PAL;
const hex = (n) => "#" + n.toString(16).padStart(6, "0");

// ===== frame =====
function getFrame(scene) {
    const w = scene.scale.width;
    const h = scene.scale.height;
    const mobile = w < 768 || h >= w;
    // The game now fills the full canvas on every device. HUD and joystick
    // overlay the gameplay (top bar / floating menu / corner joystick) just
    // like the flight and tower levels.
    return {
        x: 0,
        y: 0,
        w,
        h,
        mobile,
        topBand: 0,
        bottomBand: 0,
        canvasW: w,
        canvasH: h,
    };
}

// ===== audio =====
// Tiny WebAudio ambience generators — no asset files, no network calls.
let ctx = null;
let muted = false;
let masterGain = null;
function getCtx() {
    if (typeof window === "undefined") return null;
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch { ctx = null; }
    return ctx;
}
function getMaster(c) {
    if (!masterGain) {
        masterGain = c.createGain();
        masterGain.gain.value = muted ? 0 : 1;
        masterGain.connect(c.destination);
    }
    return masterGain;
}
function setMuted(m) {
    muted = m;
    const c = getCtx();
    if (c && masterGain) masterGain.gain.setValueAtTime(m ? 0 : 1, c.currentTime);
}
function isMuted() { return muted; }

function noiseBuffer(c, seconds = 2) {
    const len = c.sampleRate * seconds;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 3.5;
    }
    return buf;
}

function startRain(volume = 0.08) {
    const c = getCtx();
    if (!c) return { stop: () => {} };
    if (c.state === "suspended") c.resume().catch(() => {});
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 3);
    src.loop = true;
    const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 600;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 4500;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(getMaster(c));
    src.start();
    g.gain.linearRampToValueAtTime(volume, c.currentTime + 1.5);
    let stopped = false;
    const thunder = () => {
        if (stopped || !c) return;
        const t0 = c.currentTime;
        const osc = c.createOscillator(); osc.type = "sawtooth";
        osc.frequency.setValueAtTime(55, t0);
        osc.frequency.exponentialRampToValueAtTime(28, t0 + 2.5);
        const tg = c.createGain();
        tg.gain.setValueAtTime(0, t0);
        tg.gain.linearRampToValueAtTime(volume * 1.6, t0 + 0.3);
        tg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.5);
        const tlp = c.createBiquadFilter(); tlp.type = "lowpass"; tlp.frequency.value = 220;
        osc.connect(tlp); tlp.connect(tg); tg.connect(getMaster(c));
        osc.start(t0); osc.stop(t0 + 2.7);
        setTimeout(thunder, 15000 + Math.random() * 18000);
    };
    setTimeout(thunder, 6000 + Math.random() * 6000);
    return { stop: () => { stopped = true; try { g.gain.linearRampToValueAtTime(0, c.currentTime + 0.6); setTimeout(() => src.stop(), 700); } catch {} } };
}

function startFireplace(volume = 0.05) {
    const c = getCtx();
    if (!c) return { stop: () => {} };
    if (c.state === "suspended") c.resume().catch(() => {});
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 2); src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(g); g.connect(getMaster(c));
    src.start(); g.gain.linearRampToValueAtTime(volume, c.currentTime + 1.5);
    let stopped = false;
    const crackle = () => {
        if (stopped || !c) return;
        const t0 = c.currentTime;
        const cg = c.createGain();
        cg.gain.setValueAtTime(0, t0);
        cg.gain.linearRampToValueAtTime(volume * 0.6, t0 + 0.01);
        cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
        const csrc = c.createBufferSource(); csrc.buffer = noiseBuffer(c, 0.15);
        const chp = c.createBiquadFilter(); chp.type = "highpass"; chp.frequency.value = 1800;
        csrc.connect(chp); chp.connect(cg); cg.connect(getMaster(c));
        csrc.start(t0); csrc.stop(t0 + 0.15);
        setTimeout(crackle, 400 + Math.random() * 1400);
    };
    setTimeout(crackle, 1200);
    return { stop: () => { stopped = true; try { g.gain.linearRampToValueAtTime(0, c.currentTime + 0.4); setTimeout(() => src.stop(), 500); } catch {} } };
}

function playChime(freq = 660, dur = 1.6, volume = 0.06) {
    const c = getCtx();
    if (!c) return;
    if (c.state === "suspended") c.resume().catch(() => {});
    const t0 = c.currentTime;
    const o = c.createOscillator(); o.type = "sine"; o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(volume, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(getMaster(c));
    o.start(t0); o.stop(t0 + dur + 0.05);
}

// ─── Halloween Flight Music ─────────────────────────────────────────────────
// "Witch's Ride" — cute & creepy carousel waltz in minor key.
// Pure WebAudio synthesis: organ pipes + theremin lead + bass drone + jingle bells.
// Returns an Ambience handle with stop().

let halloweenMusicHandle = null;

function startHalloweenMusic(volume = 0.18) {
    const c = getCtx();
    if (!c) return { stop: () => {} };
    if (c.state === "suspended") c.resume().catch(() => {});

    const master = getMaster(c);
    const gainNode = c.createGain(); gainNode.gain.value = 0;
    gainNode.connect(master);
    gainNode.gain.linearRampToValueAtTime(volume, c.currentTime + 2.0);

    // Reverb — use a SHORT IR (0.6s) to keep generation fast and non-blocking
    const convolver = c.createConvolver();
    const irLen = Math.floor(c.sampleRate * 0.6);
    const ir = c.createBuffer(2, irLen, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.2);
    }
    convolver.buffer = ir;
    const reverbGain = c.createGain(); reverbGain.gain.value = 0.28;
    convolver.connect(reverbGain); reverbGain.connect(gainNode);
    const dryGain = c.createGain(); dryGain.gain.value = 0.72; dryGain.connect(gainNode);

    // ── Scale & rhythm ──
    // D minor pentatonic: D3=147, F3=175, G3=196, A3=220, C4=262, D4=294, F4=349, A4=440
    const dm = [147, 175, 196, 220, 262, 294, 349, 440, 587, 698, 880];
    // Waltz: 3/4 time, ~160bpm => beat = 0.375s
    const beat = 0.375;
    const bar = beat * 3;

    // ── Bass drone (pipe organ low) ──
    const bassNotes = [147, 147, 110, 131, 147, 175, 131, 147]; // D2,D2,A1,C2,D2,F2,C2,D2
    let stopped = false;
    let t = c.currentTime + 0.1;

    const playNote = (freq, start, dur, vol, type = "sine", detune = 0) => {
        if (stopped) return;
        const o = c.createOscillator(); o.type = type;
        o.frequency.value = freq; o.detune.value = detune;
        const g = c.createGain();
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(vol, start + 0.04);
        g.gain.setValueAtTime(vol, start + dur - 0.08);
        g.gain.linearRampToValueAtTime(0, start + dur);
        o.connect(g); g.connect(dryGain);
        const or = c.createOscillator(); or.type = type;
        or.frequency.value = freq; or.detune.value = detune;
        const gr = c.createGain(); gr.gain.value = 0.4;
        or.connect(gr); gr.connect(convolver);
        o.start(start); o.stop(start + dur + 0.05);
        or.start(start); or.stop(start + dur + 0.05);
    };

    // Melody sequence — cute spooky 16-bar loop
    // bars: [note_index, beat_offset, duration_beats, volume, type]
    const melody = [
        // bar 1-2: opening phrase
        [8,0,1,0.09,"sine"],[7,1,0.5,0.07,"sine"],[6,1.5,1.5,0.08,"sine"],
        [7,3,1,0.09,"sine"],[6,4,0.5,0.07,"sine"],[5,4.5,1.5,0.08,"sine"],
        // bar 3-4: answer
        [8,6,0.5,0.09,"sine"],[9,6.5,0.5,0.08,"sine"],[8,7,1,0.10,"sine"],[7,8,2,0.09,"sine"],
        // bar 5-6: descending
        [6,10,0.5,0.07,"sine"],[5,10.5,0.5,0.07,"sine"],[4,11,1,0.08,"sine"],[3,12,2,0.09,"sine"],
        // bar 7-8: spooky turn
        [2,14,0.5,0.06,"sine"],[3,14.5,0.5,0.06,"sine"],[4,15,1,0.08,"sine"],[5,16,1,0.09,"sine"],[4,17,1,0.07,"sine"],
        // bar 9-10: high run
        [8,18,0.33,0.08,"sine"],[9,18.33,0.33,0.08,"sine"],[10,18.66,0.34,0.09,"sine"],
        [9,19,1,0.10,"sine"],[8,20,2,0.09,"sine"],
        // bar 11-12
        [7,22,0.5,0.08,"sine"],[6,22.5,0.5,0.07,"sine"],[7,23,1,0.09,"sine"],[8,24,2,0.10,"sine"],
        // bar 13-14: resolve down
        [6,26,1,0.08,"sine"],[5,27,1,0.07,"sine"],[4,28,2,0.09,"sine"],
        // bar 15-16: cadence
        [3,30,1,0.09,"sine"],[2,31,0.5,0.07,"sine"],[1,31.5,0.5,0.07,"sine"],[0,32,4,0.11,"sine"],
    ];
    const loopBars = 36;

    // Organ chords (waltz: chord on beat 1, lighter on 2&3)
    const chords = [
        // bar [beat, [notes], vol]
        [0,  [147,175,220], 0.045],  // Dm
        [3,  [131,175,220], 0.040],  // C add
        [6,  [147,175,262], 0.045],  // Dm7
        [9,  [110,175,220], 0.040],  // Am
        [12, [131,196,262], 0.045],  // C
        [15, [147,220,294], 0.040],  // Dm high
        [18, [131,175,220], 0.045],  // C
        [21, [147,175,220], 0.040],  // Dm
        [24, [175,220,294], 0.045],  // F
        [27, [147,220,262], 0.040],  // Dm7
        [30, [131,196,262], 0.045],  // C
        [33, [147,175,220], 0.040],  // Dm
    ];

    // Bass walk
    const bassLine = [
        [0, 73.4, 2.8],[3, 65.4, 2.8],[6, 73.4, 2.8],[9, 55, 2.8],
        [12, 65.4, 2.8],[15, 73.4, 2.8],[18, 65.4, 2.8],[21, 73.4, 2.8],
        [24, 87.3, 2.8],[27, 73.4, 2.8],[30, 65.4, 2.8],[33, 73.4, 2.8],
    ];

    // Jingle bell accent on beat 2 of every bar (cute element)
    const bells = [];
    for (let b = 1; b < loopBars * 3; b += 3) bells.push(b);

    let loopStart = t;
    let loopTimer = null;

    const scheduleLoop = () => {
        if (stopped) return;
        const ls = loopStart;

        // Melody
        melody.forEach(([ni, bo, dur, vol]) => {
            playNote(dm[ni], ls + bo * beat, dur * beat, vol, "sine");
            // add octave shimmer for theremin effect
            if (vol > 0.08) playNote(dm[ni] * 2, ls + bo * beat, dur * beat * 0.5, vol * 0.25, "sine", 1200);
        });

        // Chords (organ-ish with sawtooth + LP filter per chord note)
        chords.forEach(([bo, notes, vol]) => {
            notes.forEach((freq, i) => {
                const chordVol = i === 0 ? vol : vol * 0.6;
                playNote(freq, ls + bo * beat, 2.6 * beat, chordVol, "sawtooth", -1200 + i * 400);
                // LP filter implied by gain shaping
            });
            // beat 2 & 3 lighter
            notes.forEach(freq => {
                playNote(freq, ls + (bo + 1) * beat, 0.8 * beat, vol * 0.3, "sawtooth", -1200);
                playNote(freq, ls + (bo + 2) * beat, 0.8 * beat, vol * 0.25, "sawtooth", -1200);
            });
        });

        // Bass
        bassLine.forEach(([bo, freq, dur]) => {
            playNote(freq, ls + bo * beat, dur * beat, 0.09, "sine");
            playNote(freq / 2, ls + bo * beat, dur * beat, 0.05, "sine");
        });

        // Bells (bright triangle ping)
        bells.forEach(bo => {
            if (bo >= loopBars * 3) return;
            const bellFreqs = [880, 1047, 1175, 1319];
            const bf = bellFreqs[Math.floor(bo / 3) % bellFreqs.length];
            playNote(bf, ls + bo * beat, 0.18, 0.035, "triangle");
        });

        loopStart += loopBars * bar;
        // Schedule next loop slightly before it ends
        const nextIn = Math.max(100, (loopStart - c.currentTime - 0.5) * 1000);
        if (!stopped) loopTimer = setTimeout(scheduleLoop, nextIn);
    };

    scheduleLoop();

    return {
        stop: () => {
            stopped = true;
            if (loopTimer) clearTimeout(loopTimer);
            try {
                gainNode.gain.cancelScheduledValues(c.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, c.currentTime + 1.2);
            } catch {}
        }
    };
}

// ─── Boss Music ─────────────────────────────────────────────────────────────
// Dark organ swell for vampire/werewolf fight floors
function startBossMusic(volume = 0.14) {
    const c = getCtx();
    if (!c) return { stop: () => {} };
    if (c.state === "suspended") c.resume().catch(() => {});
    const gainNode = c.createGain(); gainNode.gain.value = 0;
    gainNode.connect(getMaster(c));
    gainNode.gain.linearRampToValueAtTime(volume, c.currentTime + 1.5);

    let stopped = false;
    const beat = 0.32; // faster, tense
    // Ominous bass ostinato: D-C#-D-C-D-Bb-D-C
    const ostinato = [73.4, 69.3, 73.4, 65.4, 73.4, 58.3, 73.4, 65.4];
    let t = c.currentTime + 0.1;
    let loopStart = t;

    const playBossNote = (freq, start, dur, vol, type = "sawtooth") => {
        if (stopped) return;
        const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
        const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
        const g = c.createGain();
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(vol, start + 0.03);
        g.gain.setValueAtTime(vol * 0.7, start + dur - 0.05);
        g.gain.linearRampToValueAtTime(0, start + dur);
        o.connect(lp); lp.connect(g); g.connect(gainNode);
        o.start(start); o.stop(start + dur + 0.05);
    };

    const loopLen = ostinato.length;
    const scheduleLoop = () => {
        if (stopped) return;
        const ls = loopStart;
        ostinato.forEach((freq, i) => {
            playBossNote(freq, ls + i * beat, beat * 0.85, 0.09, "sawtooth");
            playBossNote(freq / 2, ls + i * beat, beat * 0.85, 0.06, "sine");
        });
        // Eerie upper voice (tritone above)
        ostinato.forEach((freq, i) => {
            if (i % 2 === 0) playBossNote(freq * 1.414, ls + i * beat + beat * 0.5, beat * 0.4, 0.04, "sine");
        });
        loopStart += loopLen * beat;
        if (!stopped) setTimeout(scheduleLoop, Math.max(50, (loopStart - c.currentTime - 0.4) * 1000));
    };
    scheduleLoop();

    return {
        stop: () => {
            stopped = true;
            try { gainNode.gain.linearRampToValueAtTime(0, c.currentTime + 1.0); } catch {}
        }
    };
}

// ─── Chapel Theremin Music ──────────────────────────────────────────────────
// "Graveyard Whisper" — spooky & eerie, minor key, slow theremin lead.
// Sparse, haunting. Sits quietly under the rain and chimes.
function startChapelMusic(volume = 0.10) {
    const c = getCtx();
    if (!c) return { stop: () => {} };
    if (c.state === "suspended") c.resume().catch(() => {});

    const gainNode = c.createGain(); gainNode.gain.value = 0;
    gainNode.connect(getMaster(c));
    gainNode.gain.linearRampToValueAtTime(volume, c.currentTime + 3.0);

    // Reverb
    const irLen = Math.floor(c.sampleRate * 0.8);
    const ir = c.createBuffer(2, irLen, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 1.6);
    }
    const conv = c.createConvolver(); conv.buffer = ir;
    const revGain = c.createGain(); revGain.gain.value = 0.55;
    conv.connect(revGain); revGain.connect(gainNode);
    const dryGain = c.createGain(); dryGain.gain.value = 0.45; dryGain.connect(gainNode);

    let stopped = false;

    // Theremin voice: sine with slow vibrato + pitch glide between notes
    // Phrygian mode on A: A3 Bb3 C4 D4 E4 F4 G4 A4
    const scale = [220, 233, 262, 294, 330, 349, 392, 440, 466, 523, 587];
    // Melody: slow, halting, eerie — long notes with glides
    const phrase = [
        [0, 4],   // A3 — long
        [2, 2],   // C4
        [1, 3],   // Bb3
        [0, 5],   // A3 — linger
        [3, 2],   // D4
        [2, 2],   // C4
        [1, 4],   // Bb3
        [4, 2],   // E4
        [3, 3],   // D4
        [2, 2],   // C4
        [0, 6],   // A3 — resolve
        [5, 2],   // F4
        [4, 2],   // E4
        [3, 3],   // D4
        [1, 3],   // Bb3
        [0, 8],   // A3 — hold
    ];
    const beatSec = 1.8; // very slow
    const loopBeats = phrase.reduce((s, [, dur]) => s + dur, 0); // total beats in phrase

    const playThereminNote = (freq, start, dur) => {
        if (stopped) return;
        const o = c.createOscillator(); o.type = "sine";
        // Vibrato LFO
        const lfo = c.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 4.8;
        const lfoGain = c.createGain(); lfoGain.gain.value = freq * 0.015; // subtle vibrato
        lfo.connect(lfoGain); lfoGain.connect(o.frequency);
        o.frequency.setValueAtTime(freq, start);
        // LP filter for that warm theremin timbre
        const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = freq * 3.5;
        const g = c.createGain();
        const att = 0.4, rel = 0.8;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(1.0, start + att);
        g.gain.setValueAtTime(1.0, start + dur - rel);
        g.gain.linearRampToValueAtTime(0, start + dur);
        o.connect(lp); lp.connect(g);
        g.connect(dryGain); g.connect(conv);
        o.start(start); lfo.start(start);
        o.stop(start + dur + 0.1); lfo.stop(start + dur + 0.1);
    };

    // Bass drone — long held fifths, very low volume
    const playDrone = (freq, start, dur) => {
        if (stopped) return;
        const o = c.createOscillator(); o.type = "sine"; o.frequency.value = freq;
        const o2 = c.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 1.5; // fifth
        const g = c.createGain();
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(0.4, start + 2.0);
        g.gain.setValueAtTime(0.4, start + dur - 2.0);
        g.gain.linearRampToValueAtTime(0, start + dur);
        const g2 = c.createGain(); g2.gain.value = 0.25;
        o.connect(g); o2.connect(g2); g.connect(conv); g2.connect(conv);
        o.start(start); o2.start(start);
        o.stop(start + dur + 0.1); o2.stop(start + dur + 0.1);
    };

    let loopStart = c.currentTime + 0.5;
    let loopTimer = null;

    const scheduleLoop = () => {
        if (stopped) return;
        const ls = loopStart;
        let t = 0;
        phrase.forEach(([ni, dur]) => {
            playThereminNote(scale[ni], ls + t * beatSec, dur * beatSec * 0.88);
            t += dur;
        });
        // Bass drones — one per 16-beat section
        playDrone(55, ls, loopBeats * beatSec * 0.5);          // A1 drone first half
        playDrone(58.3, ls + loopBeats * beatSec * 0.5, loopBeats * beatSec * 0.5); // Bb1 second half
        loopStart += loopBeats * beatSec;
        const nextIn = Math.max(100, (loopStart - c.currentTime - 1.0) * 1000);
        if (!stopped) loopTimer = setTimeout(scheduleLoop, nextIn);
    };

    scheduleLoop();

    return {
        stop: () => {
            stopped = true;
            if (loopTimer) clearTimeout(loopTimer);
            try { gainNode.gain.cancelScheduledValues(c.currentTime); gainNode.gain.linearRampToValueAtTime(0, c.currentTime + 2.0); } catch {}
        }
    };
}

function makeCanvas(scene, key, w, h, draw) {
    const tex = scene.textures.createCanvas(key, w, h);
    if (!tex)
        return;
    const ctx = tex.getContext();
    const img = ctx.createImageData(w, h);
    const px = (x, y, c, a = 255) => {
        if (x < 0 || y < 0 || x >= w || y >= h)
            return;
        const i = (y * w + x) * 4;
        img.data[i] = (c >> 16) & 0xff;
        img.data[i + 1] = (c >> 8) & 0xff;
        img.data[i + 2] = c & 0xff;
        img.data[i + 3] = a;
    };
    draw(px);
    ctx.putImageData(img, 0, 0);
    tex.refresh();
}
// deterministic prng
function rng(seed) {
    let s = seed | 0;
    return () => {
        s = (s * 1664525 + 1013904223) | 0;
        return ((s >>> 0) % 100000) / 100000;
    };
}
function fillRect(px, x, y, w, h, c, a = 255) {
    for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++)
            px(x + i, y + j, c, a);
}
function dither(px, x, y, w, h, a, b) {
    for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++)
            px(x + i, y + j, (i + j) & 1 ? a : b);
}

                .rectangle(x, 6, chipW, 28, 0x1a0f2e, 0.9)
                .setStrokeStyle(1, 0xc9a84c, 0.85);
            const lab = this.add
                .text(x, 6, lv.label, {

                fontSize: "11px",
                color: "#c9a84c",
            })
                .setOrigin(0.5);

            bg.on("pointerover", () => bg.setFillStyle(0x2a1740, 0.95));
            bg.on("pointerout", () => bg.setFillStyle(0x1a0f2e, 0.9));
            bg.on("pointerdown", (_p, _x, _y, evt) => {
                evt.stopPropagation();

            });
            this.levelSelect.add([bg, lab]);
        });
        // sequence
        this.tweens.add({ targets: this.smallText, alpha: 1, duration: 1200, delay: 400 });
        this.tweens.add({ targets: this.bigText, alpha: 1, duration: 1600, delay: 1400 });
        this.time.delayedCall(2800, () => {
            this.showPage(0);
            this.tweens.add({ targets: this.hintText, alpha: 1, duration: 700 });
        });
        // input — anywhere taps advance pages
        this.input.on("pointerdown", (p) => {
            // ignore taps directly on the begin button (it has its own handler)
            if (this.beginBtn.alpha > 0.5) {
                const local = this.beginBtn.getLocalPoint(p.x, p.y);
                if (Math.abs(local.x) < 100 && Math.abs(local.y) < 30)
                    return;
            }
            // ignore taps inside the level select strip
            const ls = this.levelSelect.getLocalPoint(p.x, p.y);
            if (Math.abs(ls.x) < 220 && ls.y > -30 && ls.y < 30)
                return;

        this.scale.on("resize", () => this.layout());
    }
    drawBg() {
        const W = this.scale.width, H = this.scale.height;
        this.bg.clear();
        this.bg.fillGradientStyle(0x05060f, 0x05060f, 0x1a1238, 0x2a1540, 1);
        this.bg.fillRect(0, 0, W, H);
        // stars
        this.bg.fillStyle(0xfff5d6, 0.7);
        for (let i = 0; i < 80; i++) {

    }
    layout() {
        const W = this.scale.width, H = this.scale.height;
        this.drawBg();
        this.smallText.setPosition(W / 2, H * 0.18);
        this.bigText.setPosition(W / 2, H * 0.32);
        this.bigText.setFontSize(W < 520 ? 30 : 40);
        this.bodyText.setPosition(W / 2, H * 0.62);
        this.bodyText.setWordWrapWidth(Math.min(W - 60, 560));
        this.beginBtn.setPosition(W / 2, H * 0.82);
        this.hintText.setPosition(W / 2, H - 40);
        if (this.levelSelect)
            this.levelSelect.setPosition(W / 2, H - 70);
        this.witch.setPosition(W * 0.22, H * 0.7);
        this.moonGlow.setPosition(W * 0.78, H * 0.28);

    showPage(idx) {
        this.pageIdx = idx;
        const p = this.pages[idx];
        const text = p.title ? `— ${p.title} —\n\n${p.body}` : p.body;
        this.tweens.add({
            targets: this.bodyText,
            alpha: 0,
            duration: 300,
            onComplete: () => {
                this.bodyText.setText(text);
                this.tweens.add({ targets: this.bodyText, alpha: 1, duration: 700 });
            },
        });
        if (idx >= this.pages.length - 1) {
            this.tweens.add({ targets: this.beginBtn, alpha: 1, duration: 800, delay: 700 });

    advance() {
        if (this.step === 0) {
            this.step = 1;
            return; // initial taps reveal title fast — actually wait for page render
        }
        if (this.pageIdx < this.pages.length - 1) {
            this.showPage(this.pageIdx + 1);
        }
    }
    startGame() {
        this.cameras.main.fadeOut(900, 0, 0, 0);
        this.time.delayedCall(950, () => {
            this.scene.start("cottage");
        });
    }
    startLevel(key) {
        this.cameras.main.fadeOut(600, 0, 0, 0);
        this.time.delayedCall(650, () => {
            this.scene.start(key);
        });
    }

        // ---------- vignette + warm tint ----------
        const vign = this.add.graphics().setDepth(900);
        vign.fillStyle(0x000000, 0.55);
        vign.fillRect(0, 0, W, 24);
        vign.fillRect(0, H - 24, W, 24);
        vign.fillRect(0, 0, 24, H);
        vign.fillRect(W - 24, 0, 24, H);
        // ---------- interactables ----------
        this.interactables.push({
            x: bookX,
            y: bookY,
            range: 30,
            label: "Read spellbook",
            action: () => this.openSpellbook(),
        }, {
            x: cX,
            y: cY,
            range: 34,
            label: "Cauldron",
            action: () => this.tryBrew(),
        }, {
            x: dX,
            y: dY,
            range: 44,
            label: "Step into the storm",
            action: () => this.exitToChapel(),
        });
        // ---------- input + cameras + UI ----------
        this.setupInput();
        this.setupCameras();
        // ---------- ambience ----------
        this.rainAmb = startRain(0.06);
        this.fireAmb = startFireplace(0.05);
        // ---------- intro cinematic ----------
        const justReturned = this.registry.get("returnedFromChapel") === true;
        this.fadeRect = this.add
            .rectangle(0, 0, this.scale.width, this.scale.height, 0x000000, justReturned ? 0 : 1)
            .setOrigin(0, 0)
            .setScrollFactor(0)
            .setDepth(99999);
        this.uiObjects.push(this.fadeRect);
        this.cameras.main.ignore(this.fadeRect);
        if (justReturned) {
            this.registry.set("returnedFromChapel", false);
            this.cinematic = false;
            this.tweens.add({ targets: this.fadeRect, alpha: 0, duration: 900 });
            const ui = this.scene.get("ui");
            this.time.delayedCall(1100, () => ui.events.emit("cine_line", "Home again. Read the spellbook, then cast the ingredients into the cauldron."));
            this.time.delayedCall(5200, () => ui.events.emit("cine_fadeout"));
            this.flashHint("Open the spellbook, then the cauldron.");
        }
        else {
            this.runIntro();
        }
        this.time.delayedCall(3200, () => {
            if (!this.cinematic && this.fadeRect.alpha > 0.05)
                this.fadeRect.setAlpha(0);
        });
        // hide chapel HUD inside the cottage
        this.scene.get("ui").events.emit("hud_show", false);
        this.scene.get("ui").events.emit("mana_show", false);
        this.scene.get("ui").events.emit("inventory_show", false);
        // restore wand prop on player if previously granted
        if (this.registry.get("wand") === true)
            this.attachWand();
        this.scale.on("resize", () => this.layoutUI());
    }
    runIntro() {
        const lines = [
            "Rain hammers the shutters. The fire whispers low.",
            "You wake on the hearth-rug, the spellbook open beside you.",
            "Something beneath the old chapel is stirring tonight.",

            targets: this.fadeRect,
            alpha: 0,
            duration: 2400,
            ease: "sine.inOut",

        let t = 800;
        lines.forEach((line, i) => {
            this.time.delayedCall(t, () => ui.events.emit("cine_line", line));
            t += 3600;
            if (i === lines.length - 1) {
                this.time.delayedCall(t, () => {
                    ui.events.emit("cine_fadeout");

                    this.flashHint("Open the spellbook on the table.");

    setupInput() {
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
            W: Phaser.Input.Keyboard.KeyCodes.W,
            A: Phaser.Input.Keyboard.KeyCodes.A,
            S: Phaser.Input.Keyboard.KeyCodes.S,
            D: Phaser.Input.Keyboard.KeyCodes.D,
            E: Phaser.Input.Keyboard.KeyCodes.E,

        });

        this.input.keyboard.on("keydown-SPACE", () => this.tryInteract());
        // ----- viewport-space UI objects (joystick, button, hint) -----
        this.joyBase = this.add.circle(0, 0, 48, 0x000000, 0.3).setStrokeStyle(2, 0xc9a25b, 0.65).setAlpha(0);
        this.joyKnob = this.add.circle(0, 0, 21, 0xc9a25b, 0.64).setStrokeStyle(1, 0xf4ead0, 0.8).setAlpha(0);
        this.btnInteract = this.add.container(0, 0).setAlpha(0.95).setDepth(10200);
        // gold glow (approximates box-shadow: 0 0 12px rgba(201,168,76,0.5))
        const btnGlow = this.add
            .circle(0, 0, 46, 0xc9a84c, 0.32)
            .setBlendMode(Phaser.BlendModes.ADD);
        const btnGlow2 = this.add
            .circle(0, 0, 40, 0xc9a84c, 0.22)
            .setBlendMode(Phaser.BlendModes.ADD);
        const btnBg = this.add
            .circle(0, 0, 34, 0x1a0f2e, 0.95)
            .setStrokeStyle(2, 0xc9a84c, 1);
        const btnIcon = this.add
            .text(0, 0, "◆", { fontFamily: "serif", fontSize: "23px", color: "#c9a84c" })
            .setOrigin(0.5);
        this.btnInteract.add([btnGlow, btnGlow2, btnBg, btnIcon]);
        this.btnInteract.setInteractive(new Phaser.Geom.Rectangle(-40, -40, 80, 80), Phaser.Geom.Rectangle.Contains);
        this.btnInteract.on("pointerdown", () => this.tryInteract());
        this.promptText = this.add
            .text(0, 0, "", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: this.scale.width < 520 ? "15px" : "13px",
            color: "#f4ead0",
            backgroundColor: "#000000aa",
            padding: { x: 8, y: 4 },
        })
            .setOrigin(0.5, 1)
            .setAlpha(0)
            .setDepth(500);
        this.hint = this.add
            .text(0, 0, "", {
            fontFamily: "Georgia, serif",
            fontStyle: "italic",
            fontSize: this.scale.width < 520 ? "15px" : "13px",
            color: "#c9a25b",
            stroke: "#000",
            strokeThickness: 3,
        })
            .setOrigin(0.5)
            .setAlpha(0)
            .setDepth(500);
        // touch joystick
        this.input.on("pointerdown", (p) => {
            if (this.cinematic)
                return;
            if (p.x > this.scale.width * 0.55)
                return; // right side reserved for buttons
            this.joyActive = true;
            this.joyPointerId = p.id;
            this.joyOrigin = { x: p.x, y: p.y };
            this.joyBase.setPosition(p.x, p.y);
            this.joyKnob.setPosition(p.x, p.y);
            this.tweens.add({ targets: [this.joyBase, this.joyKnob], alpha: 0.92, duration: 150 });
        });
        this.input.on("pointermove", (p) => {
            if (!this.joyActive || p.id !== this.joyPointerId)
                return;
            const dx = p.x - this.joyOrigin.x;
            const dy = p.y - this.joyOrigin.y;
            const d = Math.hypot(dx, dy);
            const max = 36;
            const cd = Math.min(d, max);
            const ang = Math.atan2(dy, dx);
            this.joyKnob.setPosition(this.joyOrigin.x + Math.cos(ang) * cd, this.joyOrigin.y + Math.sin(ang) * cd);
            this.joyVec = { x: Math.cos(ang) * (cd / max), y: Math.sin(ang) * (cd / max) };
        });
        const endJoy = (p) => {
            if (p.id !== this.joyPointerId) {
                // Failsafe: release if no touches remain
                if (this.joyActive && !this.input.pointer1?.isDown && !this.input.pointer2?.isDown) { this.joyActive = false; this.joyVec = { x: 0, y: 0 }; }
                return;
            }
            this.joyActive = false;
            this.joyVec = { x: 0, y: 0 };
            this.tweens.add({ targets: this.joyBase, alpha: 0, duration: 200 });
            this.tweens.add({ targets: this.joyKnob, alpha: 0, duration: 200 });
        };
        this.input.on("pointerup", endJoy);
        this.input.on("pointerupoutside", endJoy);
        this.uiObjects.push(this.joyBase, this.joyKnob, this.btnInteract, this.promptText, this.hint);
        this.layoutUI();
    }
    layoutUI() {
        const f = getFrame(this);
        const W = this.scale.width;
        const H = this.scale.height;
        const pad = f.mobile ? 18 : 22;
        // Joystick still anchors in the bottom band on mobile / near canvas
        // bottom on desktop, so the interact button doesn't collide with it.
        const controlY = f.mobile
            ? f.y + f.h + Math.min(f.bottomBand - 70, 70)
            : H - 60;
        if (!this.joyActive) {
            const jx = pad + 54;
            this.joyOrigin = { x: jx, y: controlY };
            this.joyBase.setPosition(jx, controlY);
            this.joyKnob.setPosition(jx, controlY);
        }
        // Interact button is fixed to the bottom-right of the viewport with 24px
        // padding, regardless of game frame, so it never overlaps game panels.
        this.btnInteract.setPosition(W - 24 - 34, H - 24 - 34);
        this.hint.setPosition(W / 2, f.mobile ? f.y + 18 : 40);
        if (this.fadeRect?.geom)
            this.fadeRect.setSize(W, H);
    }
    setupCameras() {
        // world cam stays in logical coords. We DO NOT use setBounds here —
        // when the canvas is larger than the (tiny) cottage interior (e.g. tall
        // mobile portrait), Phaser's bounds clamp keeps scroll at 0,0 and the
        // scene sticks to the top-left of the canvas. Instead we resize the
        // camera's *viewport* to the scaled world rect and center that rect
        // inside the canvas — guarantees the room is perfectly centered.
        this.cameras.main.setBackgroundColor(0x0a0618);
        this.applyCameraFit();
        // UI cam ignores world; world cam ignores UI
        this.uiCam = this.cameras.add(0, 0, this.scale.width, this.scale.height);
        this.uiCam.setScroll(0, 0);
        const worldChildren = this.children.list.filter((c) => !this.uiObjects.includes(c));
        this.uiCam.ignore(worldChildren);
        this.cameras.main.ignore(this.uiObjects);
        this.scale.on("resize", () => {
            this.applyCameraFit();
            this.uiCam.setSize(this.scale.width, this.scale.height);
        });
    }
    applyCameraFit() {
        const f = getFrame(this);
        const W = this.WORLD_W;
        const H = this.WORLD_H;
        this.cameras.main.setViewport(f.x, f.y, f.w, f.h);
        if (f.mobile && this.player) {
            // Mobile: the world IS the canvas (sized in create()). Render 1:1, no
            // zoom, no follow — the witch walks around a room that's already the
            // size of the screen.
            this.cameras.main.setZoom(1);
            this.cameras.main.stopFollow();
            this.cameras.main.removeBounds();
            this.cameras.main.centerOn(W / 2, H / 2);
        }
        else {
            const zoom = Math.min(f.w / W, f.h / H);
            this.cameras.main.setZoom(zoom);
            this.cameras.main.stopFollow();
            this.cameras.main.removeBounds();
            this.cameras.main.centerOn(W / 2, H / 2);
        }
    }
    tryInteract() {
        if (this.cinematic)
            return;
        if (this.promptId < 0)
            return;
        const it = this.interactables[this.promptId];
        it.action();

            "warm, watchful, alive.",

    takeBroomAndFly() {

    flashHint(text) {
        this.hint.setText(text);
        this.tweens.killTweensOf(this.hint);
        this.tweens.add({
            targets: this.hint,
            alpha: 1,
            duration: 400,
            hold: 2400,
            yoyo: true,
        });

    update(_t, dt) {
        // rain drops in window
        this.rainGfx.clear();
        this.rainGfx.lineStyle(1, 0x9fb6d6, 0.55);
        for (const d of this.rainDrops) {
            d.y += d.speed;
            // wrap inside one of the windows
            if (d.y > 82) {
                d.y = 22;
                const wf = Math.random() < 0.5 ? 0 : 1;
                d.x = (wf === 0 ? 60 : this.WORLD_W - 130) + Math.random() * 70;
            }
            this.rainGfx.lineBetween(d.x, d.y, d.x + 1, d.y + 4);
        }
        if (this.registry.get("bookOpen"))
            return;
        // movement
        let mx = 0, my = 0;
        if (this.cursors.left?.isDown || this.keys.A?.isDown)
            mx -= 1;
        if (this.cursors.right?.isDown || this.keys.D?.isDown)
            mx += 1;
        if (this.cursors.up?.isDown || this.keys.W?.isDown)
            my -= 1;
        if (this.cursors.down?.isDown || this.keys.S?.isDown)
            my += 1;
        if (this.joyActive) {
            mx = this.joyVec.x;
            my = this.joyVec.y;
        }
        if (this.cinematic) { this.joyVec = { x: 0, y: 0 }; this.joyActive = false; }
        const speed = this.cinematic ? 0 : 0.08 * dt;
        if (mx !== 0 || my !== 0) {
            const m = Math.hypot(mx, my) || 1;
            mx /= m;
            my /= m;
            this.player.x = Phaser.Math.Clamp(this.player.x + mx * speed, 30, this.WORLD_W - 30);
            this.player.y = Phaser.Math.Clamp(this.player.y + my * speed, 130, this.WORLD_H - 20);
            this.player.setDepth(this.player.y);
            if (mx < 0)
                this.player.setFlipX(true);
            else if (mx > 0)
                this.player.setFlipX(false);
            if (!this.player.anims.isPlaying)
                this.player.play("walk");
        }
        else if (this.player.anims.isPlaying) {
            this.player.anims.stop();
            this.player.setFrame(0);
        }
        // wand follows the player
        const wand = this.player.getData("wand");
        if (wand) {
            wand.x = this.player.x + (this.player.flipX ? -8 : 8);
            wand.y = this.player.y - 8;
            wand.setFlipX(this.player.flipX);
            wand.setAngle(this.player.flipX ? 25 : -25);
            wand.setDepth(this.player.depth + 1);
        }
        // closest interactable
        let best = -1;
        let bestD = Infinity;
        this.interactables.forEach((it, i) => {
            const d = Phaser.Math.Distance.Between(it.x, it.y, this.player.x, this.player.y);
            if (d < (it.range ?? 30) && d < bestD) {
                best = i;
                bestD = d;
            }
        });
        if (best !== this.promptId) {
            this.promptId = best;
            if (best >= 0) {
                const it = this.interactables[best];
                const w = this.cameras.main.worldView;
                const z = this.cameras.main.zoom;
                const sx = (it.x - w.x) * z;
                const sy = (it.y - w.y - 20) * z;
                this.promptText.setText(`✦ ${it.label}  (E)`).setPosition(sx, sy).setAlpha(1);
            }
            else {
                this.tweens.add({ targets: this.promptText, alpha: 0, duration: 200 });
            }
        }
        else if (best >= 0) {
            const it = this.interactables[best];
            const w = this.cameras.main.worldView;
            const z = this.cameras.main.zoom;
            const sx = (it.x - w.x) * z;
            const sy = (it.y - w.y - 20) * z;
            this.promptText.setPosition(sx, sy);
        }
    }
    shutdown() {
        this.rainAmb?.stop();
        this.fireAmb?.stop();
    }
    // ---------------------------------------------------------------------
    // Environmental storytelling pass for the witch's cottage. Adds beams,
    // shelves, hanging charms, crooked paintings, tapestries, soot stains,
    // floor cracks, stacked books, scrolls, scattered ingredients, skulls,
    // candles of varying heights, occult rug sigils, stools, a rocking
    // chair, a black cat near the hearth, drifting embers, moths, dust
    // motes and occasional thunder flashes. Pure decoration — no new
    // interactables, so gameplay readability is preserved.
    // ---------------------------------------------------------------------
    addCottageDetails(W, H, wallH, fpX, fpY) {
        // ===== Ceiling beams =====
        const beams = this.add.graphics().setDepth(2.05);
        beams.fillStyle(0x0d0905, 1);
        beams.fillRect(0, wallH - 12, W, 4);
        beams.fillStyle(0x1a1108, 1);
        [W * 0.15, W * 0.38, W * 0.62, W * 0.85].forEach((bx) => {
            beams.fillRect(bx - 5, 0, 10, wallH - 8);
            beams.fillStyle(0x0a0604, 1);
            beams.fillRect(bx - 5, 0, 2, wallH - 8);
            beams.fillStyle(0x1a1108, 1);
        });
        // ===== Soot stain above fireplace =====
        const soot = this.add.graphics().setDepth(2.06);
        soot.fillStyle(0x000000, 0.55);
        soot.fillEllipse(fpX, wallH - 30, 110, 50);
        soot.fillStyle(0x000000, 0.35);
        soot.fillEllipse(fpX, wallH - 50, 80, 36);
        soot.fillStyle(0x000000, 0.22);
        soot.fillEllipse(fpX, wallH - 70, 60, 22);
        // ===== Cracks in floor and walls =====
        const cracks = this.add.graphics().setDepth(1.4);
        cracks.lineStyle(1, 0x0a0604, 0.6);
        cracks.lineBetween(W * 0.22, H * 0.62, W * 0.28, H * 0.74);
        cracks.lineBetween(W * 0.28, H * 0.74, W * 0.34, H * 0.78);
        cracks.lineBetween(W * 0.6, H * 0.85, W * 0.7, H * 0.92);
        cracks.lineBetween(W * 0.7, H * 0.92, W * 0.78, H * 0.94);
        cracks.lineStyle(1, 0x000000, 0.5);
        cracks.lineBetween(W * 0.05, wallH - 30, W * 0.05, wallH - 6);
        cracks.lineBetween(W * 0.97, wallH - 50, W * 0.97, wallH - 10);
        // ===== Crooked framed paintings on back wall =====
        const paint = (cx, cy, w, h, tint, tilt) => {
            const frame = this.add.rectangle(cx, cy, w, h, 0x1a0f06).setDepth(2.12).setAngle(tilt);
            frame.setStrokeStyle(2, 0x6b4a25);
            const inner = this.add.rectangle(cx, cy, w - 6, h - 6, tint).setDepth(2.13).setAngle(tilt);
            void frame;
            void inner;
        };
        paint(W * 0.28, wallH * 0.5, 26, 32, 0x2d2335, -6);
        paint(W * 0.58, wallH * 0.42, 30, 22, 0x322218, 4);
        paint(W * 0.86, wallH * 0.55, 22, 28, 0x1f2c2a, -3);
        // ===== Old tapestry =====
        const tap = this.add.graphics().setDepth(2.11);
        tap.fillStyle(0x3a1820, 1);
        tap.fillRect(W * 0.46, 8, 34, 88);
        tap.fillStyle(0x5a2330, 0.7);

    // ---------- eerie chapel ambience -----------------------------------
    startChapelAmbience() {
        // distant storm + occasional bone-chime whispers. very low volume so
        // it sits beneath dialogue without competing with it.
        // rain removed — chapel music only
        // Eerie theremin melody — starts softly after a moment
        // Defer music so IR buffer generation doesn't block create() frame
        setTimeout(() => {
            if (!this.chapelMusic) this.chapelMusic = startChapelMusic(0.08);
        }, 600);
        const scheduleChime = () => {
            const delay = 9000 + Math.random() * 11000;
            this.chimeTimer = this.time.delayedCall(delay, () => {
                // pick a low, melancholic frequency
                const tones = [196, 220, 247, 262, 175];
                const f = tones[Math.floor(Math.random() * tones.length)];
                playChime(f, 2.2, 0.035);
                scheduleChime();
            });
        };
        scheduleChime();
        // stop on shutdown
        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
            this.chapelMusic?.stop();
            this.chapelMusic = undefined;
            this.chimeTimer?.remove(false);
            this.chimeTimer = undefined;
        });
    }
    handleResize() {
        const f = getFrame(this);
        const w = this.scale.width;
        const h = this.scale.height;
        const W = this.WORLD_W;
        const H = this.WORLD_H;
        // Main camera renders only into the centered game frame; UI cam covers
        // the full canvas so HUD/joystick/inventory sit in the bands outside.
        this.cameras.main.setViewport(f.x, f.y, f.w, f.h);
        this.uiCam.setSize(w, h);
        this.uiCam.setScroll(0, 0);
        if (f.mobile) {
            // Mobile: world IS the canvas. Render 1:1, no zoom, no follow.
            this.cameras.main.setZoom(1);
            this.cameras.main.stopFollow();
            this.cameras.main.removeBounds();
            this.cameras.main.centerOn(W / 2, H / 2);
        }
        else {
            const zoom = Math.min(f.w / W, f.h / H);
            this.cameras.main.setZoom(zoom);
            this.cameras.main.stopFollow();
            this.cameras.main.removeBounds();

        const pad = f.mobile ? 18 : 18;

    buildTouchControls(W, H) {
        // Virtual joystick (bottom-left)
        const jx = 80;
        const jy = H - 80;
        this.joyOrigin = { x: jx, y: jy };
        this.joyBase = this.add
            .circle(jx, jy, 46, 0x000000, 0.28)
            .setStrokeStyle(1, 0x8a7240, 0.45)
            .setDepth(10110)
            .setScrollFactor(0)
            .setAlpha(0);
        this.joyKnob = this.add
            .circle(jx, jy, 22, 0xc9a25b, 0.7)
            .setStrokeStyle(1, 0xf4ead0, 0.6)
            .setDepth(10111)
            .setScrollFactor(0)
            .setAlpha(0);
        // Buttons (bottom-right)
        const makeBtn = (x, y, glyph, label, onTap) => {
            const c = this.add.container(x, y).setDepth(10200);
            const glow = this.add
                .circle(0, 0, 48, 0xc9a84c, 0.32)
                .setBlendMode(Phaser.BlendModes.ADD);
            const glow2 = this.add
                .circle(0, 0, 42, 0xc9a84c, 0.22)
                .setBlendMode(Phaser.BlendModes.ADD);
            const bg = this.add
                .circle(0, 0, 36, 0x1a0f2e, 0.95)
                .setStrokeStyle(2, 0xc9a84c, 1);
            const g = this.add
                .text(0, -2, glyph, {
                fontFamily: "serif",
                fontSize: "22px",
                color: "#c9a84c",
            })
                .setOrigin(0.5);
            const l = this.add
                .text(0, 18, label, {
                fontFamily: "Georgia, serif",
                fontSize: "9px",
                color: "#c9a84c",
            })
                .setOrigin(0.5);
            c.add([glow, glow2, bg, g, l]);
            c.setAlpha(0.95);
            bg.setInteractive({ useHandCursor: true });
            bg.on("pointerover", () => this.tweens.add({ targets: c, alpha: 0.95, duration: 180 }));
            bg.on("pointerout", () => this.tweens.add({ targets: c, alpha: 0.78, duration: 250 }));
            bg.on("pointerdown", () => {
                this.tweens.add({ targets: c, scale: 0.9, duration: 80, yoyo: true });
                this.tweens.add({ targets: c, alpha: 1, duration: 100 });
                onTap();
            });
            bg.on("pointerup", () => this.tweens.add({ targets: c, alpha: 0.78, duration: 400 }));
            return c;
        };
        this.btnInteract = makeBtn(W - 60, H - 70, "◆", "Interact", () => this.tryInteract());
        // Sense button removed per design — spirits reveal via proximity and
        // are force-shown during the narrative sequence. Keep a hidden stub so
        // the rest of the scene's uiObjects bookkeeping still has a reference.
        this.btnSense = this.add.container(-9999, -9999).setVisible(false);
        // Pointer-based joystick handling (left half of screen)
        this.input.on("pointerdown", (p) => {
            if (this.joyActive)
                return;
            if (p.x > this.scale.width * 0.5)
                return; // only left side
            // Don't hijack taps on the touch buttons (right side anyway, but be safe).
            this.joyActive = true;
            this.joyPointerId = p.id;
            this.joyOrigin = { x: p.x, y: p.y };
            this.joyBase.setPosition(p.x, p.y);
            this.joyKnob.setPosition(p.x, p.y);
            // Fade joystick in only while the player is actively dragging.
            this.tweens.add({ targets: [this.joyBase, this.joyKnob], alpha: 1, duration: 180 });
        });
        this.input.on("pointermove", (p) => {
            if (!this.joyActive || p.id !== this.joyPointerId)
                return;
            const dx = p.x - this.joyOrigin.x;
            const dy = p.y - this.joyOrigin.y;
            const max = 40;
            const len = Math.hypot(dx, dy) || 1;
            const cl = Math.min(len, max);
            const nx = (dx / len) * cl;
            const ny = (dy / len) * cl;
            this.joyKnob.setPosition(this.joyOrigin.x + nx, this.joyOrigin.y + ny);
            this.joyVec = { x: nx / max, y: ny / max };
        });
        const release = (p) => {
            if (p.id !== this.joyPointerId)
                return;
            this.joyActive = false;
            this.joyPointerId = -1;
            this.joyVec = { x: 0, y: 0 };
            // Fade the joystick out so the world remains the focal point, then
            // snap back to the corner anchor recomputed by handleResize.
            this.tweens.add({
                targets: this.joyBase,
                alpha: 0,
                duration: 350,
                onComplete: () => this.handleResize(),
            });
            this.tweens.add({ targets: this.joyKnob, alpha: 0, duration: 350 });
        };
        this.input.on("pointerup", release);
        this.input.on("pointerupoutside", release);
    }
    buildFence(W, H) {
        // perimeter (with a gap at bottom-center for the gate)
        const top = 18;
        const bottom = H - 12;
        const left = 14;
        const right = W - 14;
        const gateW = 60;
        const drawRailRow = (y, x0, x1) => {
            for (let x = x0; x < x1; x += 22) {
                const rail = this.add.image(x, y, "fence_rail").setOrigin(0, 0.5);
                rail.setDepth(y - 1);
            }
            for (let x = x0; x <= x1; x += 22) {
                const post = this.add.image(x, y - 8, "fence_post").setOrigin(0.5, 0);
                post.setDepth(y - 0.5);
            }
        };
        drawRailRow(top, left, right);
        drawRailRow(bottom, left, W / 2 - gateW / 2);
        drawRailRow(bottom, W / 2 + gateW / 2, right);
        // sides
        for (let y = top; y < bottom; y += 22) {
            const post = this.add.image(left, y, "fence_post").setOrigin(0.5, 0);
            post.setDepth(y);
            const post2 = this.add.image(right, y, "fence_post").setOrigin(0.5, 0);
            post2.setDepth(y);
        }
    }
    toggleSpiritSense(on) {
        if (this.spiritSense === on)
            return;

            return;
        this.spiritSense = on;
        const targetAlpha = on ? 1 : 0;
        this.spirits.forEach((s, i) => {
            this.tweens.add({ targets: s.sprite, alpha: targetAlpha, duration: 300 });
            this.tweens.add({
                targets: this.spiritGlows[i],
                alpha: on ? 0.7 : 0,
                duration: 300,
            });
        });
        // Note: blue spirit-sense tint and fog brighten removed — caused the
        // entire level to wash light blue. Spirits still fade in/out above.
        this.scene.get("ui").events.emit("spiritSense", on);

    // ===== Narrative sequence =========================================

    triggerSpiritEncounter() {

    beginSpiritFollow() {
        const W = this.WORLD_W, H = this.WORLD_H;

            { x: W * 0.70, y: H * 0.55 },

            { x: W * 0.55, y: H * 0.75 },
            { x: W * 0.32, y: H * 0.68 },

                .text(wp.x, wp.y - 4, "✦", {
                fontFamily: "serif",
                fontSize: "14px",
                color: "#9fe6df",
                stroke: "#000",
                strokeThickness: 2,
            })
                .setOrigin(0.5)
                .setAlpha(0.18)
                .setDepth(10070);

    advanceFollow() {
        const e = this.elara;
        const wp = this.followWaypoints[this.followIdx];
        if (!wp)
            return;
        this.tweens.add({
            targets: [e.sprite],
            x: wp.x,
            y: wp.y,
            duration: 2200,
            ease: "sine.inOut",
            onUpdate: () => {

                e.y = e.sprite.y;

    endSequence() {
        if (this.returningHome)
            return;
        this.followingSpirit = false;
        // crypt seal cracks → door slides open
        if (this.cryptDoor) {
            this.tweens.add({
                targets: this.cryptDoor,
                scaleY: 0.05,
                alpha: 0.2,
                duration: 2200,
                ease: "sine.in",
            });

        this.flashHint("The seal gives way...");
        this.time.delayedCall(2600, () => {
            if (this.isInventoryComplete()) {

    nearestInteractable() {
        let best = null;
        this.interactables.forEach((it, idx) => {
            if (it.done)
                return;
            const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, it.x, it.y);
            const r = it.range ?? 28;
            if (d <= r && (!best || d < best.d))
                best = { idx, d };
        });
        return best;
    }
    tryInteract() {
        const n = this.nearestInteractable();
        if (!n)
            return;
        // If the closest interactable is a spirit, briefly enable sense so
        // mobile players don't need to discover the SHIFT key.
        const it = this.interactables[n.idx];
        if (it.label.startsWith("Bind ") && !this.spiritSense && this.sp > 10) {
            this.toggleSpiritSense(true);
        }
        this.interactables[n.idx].action();
    }
    update(time, dt) {
        const speed = 90;
        let vx = 0, vy = 0;
        if (this.cinematic) {
            // freeze player + spirit power while the intro plays
            if (this.player) {
                if (this.player.anims.currentAnim?.key !== "idle")
                    this.player.play("idle");
                const pl = this.player.getData("light");
                if (pl) {
                    pl.x = this.player.x;
                    pl.y = this.player.y - 14;
                }
            }
            this.fogA.tilePositionX += (dt / 1000) * 8;
            this.fogB.tilePositionX -= (dt / 1000) * 4;
            return;
        }
        if (this.cursors.left?.isDown || this.keys.A.isDown)
            vx -= 1;
        if (this.cursors.right?.isDown || this.keys.D.isDown)
            vx += 1;
        if (this.cursors.up?.isDown || this.keys.W.isDown)
            vy -= 1;
        if (this.cursors.down?.isDown || this.keys.S.isDown)
            vy += 1;
        // touch joystick adds to keyboard input
        if (this.joyActive) {
            vx += this.joyVec.x;
            vy += this.joyVec.y;
        }
        const len = Math.hypot(vx, vy) || 1;
        vx = (vx / len) * speed;
        vy = (vy / len) * speed;
        this.player.x += (vx * dt) / 1000;
        this.player.y += (vy * dt) / 1000;
        // clamp inside fence
        this.player.x = Phaser.Math.Clamp(this.player.x, 28, this.WORLD_W - 28);
        this.player.y = Phaser.Math.Clamp(this.player.y, 80, this.WORLD_H - 24);
        if (vx !== 0 || vy !== 0) {
            if (this.player.anims.currentAnim?.key !== "walk")
                this.player.play("walk");
            if (vx !== 0)
                this.player.setFlipX(vx < 0);
        }
        else {
            if (this.player.anims.currentAnim?.key !== "idle")
                this.player.play("idle");
        }
        this.player.setDepth(this.player.y);
        // player light follow
        const pl = this.player.getData("light");
        pl.x = this.player.x;
        pl.y = this.player.y - 14;
        // spirit power drain when sensing
        if (this.spiritSense) {
            this.sp = Math.max(0, this.sp - (dt / 1000) * 4);
            if (this.sp <= 0)
                this.toggleSpiritSense(false);
        }
        else {
            this.sp = Math.min(100, this.sp + (dt / 1000) * 3);
        }
        this.scene.get("ui").events.emit("sp", this.sp);
        // fog drift
        this.fogA.tilePositionX += (dt / 1000) * 8;
        this.fogA.tilePositionY += (dt / 1000) * 2;
        this.fogB.tilePositionX -= (dt / 1000) * 4;
        this.fogB.tilePositionY += (dt / 1000) * 1;
        // ravens — the first one is the crow the player must hit with a stone,
        // so keep it circling the player so it's always within frame.
        this.ravens.forEach((r, i) => {
            if (i === 0 && !this.crowDead) {
                const cx = this.player.x;
                const cy = Math.max(60, this.player.y - 110);
                const rx = 90;
                const ry = 26;
                r.x = cx + Math.cos(time / 700) * rx;
                r.y = cy + Math.sin(time / 500) * ry;
                r.setDepth(9999);
            }
            else {
                r.x += (dt / 1000) * (18 + i * 6);
                r.y += Math.sin(time / 600 + i) * 0.2;
                if (r.x > this.WORLD_W + 20)
                    r.x = -20;
            }
        });
        // interaction prompt
        const n = this.nearestInteractable();
        if (n) {
            const it = this.interactables[n.idx];
            this.promptKey.setVisible(true);
            this.promptKey.x = it.x;
            this.promptKey.y = it.y - 64;
            this.promptKey.getData("txt").setText(it.label);
            this.highlightRing.setVisible(true);
            this.highlightRing.setPosition(it.x, it.y - 12);
        }
        else {
            this.promptKey.setVisible(false);
            this.highlightRing.setVisible(false);
        }
        // gently reveal nearby spirits and their markers even without sense
        this.spirits.forEach((s, i) => {
            const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, s.x, s.y);
            const proximity = Phaser.Math.Clamp(1 - d / 140, 0, 1);
            const marker = this.spiritMarkers[i];
            // marker visible based on proximity OR sense
            const mAlpha = this.spiritSense ? 1 : proximity * 0.9;
            marker.setAlpha(mAlpha);
            // sprite: faintly visible when very close, fully when sense on
            if (!this.spiritSense) {
                const sAlpha = proximity * 0.55;
                s.sprite.setAlpha(sAlpha);
                this.spiritGlows[i].setAlpha(proximity * 0.5);
            }
        });
        // follow-the-spirit progression
        if (this.followingSpirit && this.followWaypoints.length) {
            const wp = this.followWaypoints[this.followIdx];
            if (wp) {
                const dPlayer = Phaser.Math.Distance.Between(this.player.x, this.player.y, wp.x, wp.y);
                const dSpirit = Phaser.Math.Distance.Between(this.elara.sprite.x, this.elara.sprite.y, wp.x, wp.y);
                // brighten the marker once reached
                const m = this.followMarkers[this.followIdx];
                if (m && dPlayer < 80)
                    m.setAlpha(Math.min(0.9, m.alpha + 0.01));
                if (dPlayer < 60 && dSpirit < 10) {
                    const reached = this.followIdx;
                    this.followIdx++;
                    if (reached === this.followWaypoints.length - 1) {
                        // arrived at the crypt door
                        this.scene.get("ui").events.emit("dialogue", {
                            name: "Elara",
                            lines: [wp.line ?? "It remembers the bells."],
                        });
                        this.time.delayedCall(3500, () => this.endSequence());
                    }
                    else {
                        this.advanceFollow();
                    }
                }
            }
        }
        // chapel enemies + bat + crow target
        this.updateChapelEnemies(dt);
        if (this.damageCooldown > 0)
            this.damageCooldown -= dt;
    }
    // ===== Inventory + HP helpers ========================================

    missingItemsHint() {

            miss.push("a stone");
