
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Cemetery Medium</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:#06070b;
font-family:Verdana,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
image-rendering:pixelated;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 270;

canvas.width = WIDTH;
canvas.height = HEIGHT;

const keys = {};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()] = false;
});

const player = {
x:240,
y:170,
speed:1.6,
dir:0
};

let rain = 0;
let spiritMode = false;
let pulse = 0;

const spirits = [
{
x:320,
y:118,
msg:"I still wait for my wife beneath the cedar tree."
},
{
x:110,
y:195,
msg:"The bells rang for me, but nobody came."
},
{
x:390,
y:155,
msg:"Please don't let them forget my name."
}
];

let activeMessage = "The cemetery breathes softly in the rain.";

function rect(x,y,w,h,c){
ctx.fillStyle = c;
ctx.fillRect(x,y,w,h);
}

function pixel(x,y,c){
ctx.fillStyle = c;
ctx.fillRect(x,y,1,1);
}

function glow(x,y,r,c){

const g = ctx.createRadialGradient(x,y,0,x,y,r);

g.addColorStop(0,c);
g.addColorStop(1,"rgba(0,0,0,0)");

ctx.fillStyle = g;

ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fill();

}

function drawSky(){

const g = ctx.createLinearGradient(0,0,0,HEIGHT);

g.addColorStop(0,"#08111c");
g.addColorStop(1,"#102018");

ctx.fillStyle = g;
ctx.fillRect(0,0,WIDTH,HEIGHT);

glow(380,45,80,"rgba(180,210,255,0.08)");

}

function drawRain(){

ctx.strokeStyle = "rgba(255,255,255,0.06)";
ctx.lineWidth = 1;

for(let i=0;i<170;i++){

const x = (i*41)%WIDTH;
const y = ((i*29)+rain)%HEIGHT;

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+2,y+8);
ctx.stroke();

}

rain += 2;

}

function drawGround(){

rect(0,0,WIDTH,HEIGHT,"#29432a");

for(let i=0;i<1800;i++){

const x = (i*53)%WIDTH;
const y = (i*97)%HEIGHT;

pixel(
x,
y,
i%2 ? "#3e5f3c" : "#355334"
);

}

}

function drawPaths(){

rect(208,0,64,HEIGHT,"#8a795a");
rect(0,122,WIDTH,36,"#8a795a");

for(let i=0;i<700;i++){

pixel(
208 + ((i*7)%64),
(i*13)%HEIGHT,
i%2 ? "#a58f69" : "#776548"
);

}

}

function drawChurch(){

rect(175,38,130,92,"#595968");

ctx.fillStyle="#6d4f96";

ctx.beginPath();
ctx.moveTo(160,56);
ctx.lineTo(240,2);
ctx.lineTo(320,56);
ctx.fill();

rect(223,82,34,48,"#101018");

ctx.fillStyle="#ddd";

ctx.fillRect(236,16,8,32);
ctx.fillRect(220,28,40,8);

rect(217,80,10,20,"#f2d68b");
rect(253,80,10,20,"#f2d68b");

glow(222,90,22,"rgba(242,214,139,0.18)");
glow(258,90,22,"rgba(242,214,139,0.18)");

}

function drawTree(x,y,s=1){

ctx.fillStyle="#162d17";

ctx.beginPath();
ctx.arc(x,y,24*s,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#244625";

ctx.beginPath();
ctx.arc(x-8,y-10,12*s,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#573b22";

rect(x-3,y+18,6,20,"#573b22");

}

function drawFence(){

for(let i=0;i<WIDTH;i+=13){

rect(i,198,10,3,"#9f875c");
rect(i+4,198,2,22,"#7d6840");

}

}

function drawGrave(x,y,big=false){

if(big){

rect(x,y,22,38,"#767785");
rect(x+4,y-6,14,8,"#a0a1af");

ctx.fillStyle="#444";

rect(x+10,y+12,2,16,"#444");
rect(x+6,y+18,10,2,"#444");

}else{

rect(x,y,12,22,"#9d9daa");
rect(x+3,y-4,6,5,"#bcbcca");

ctx.fillStyle="#444";

rect(x+5,y+6,2,10,"#444");
rect(x+2,y+10,8,2,"#444");

}

}

function drawFlowers(x,y){

const colors = [
"#d07cff",
"#ffe27a",
"#8ee28f",
"#ff9ab1"
];

for(let i=0;i<12;i++){

pixel(
x+((i*3)%12),
y+((i*5)%8),
colors[i%colors.length]
);

}

}

function drawLantern(x,y){

rect(x,y,3,12,"#444");

rect(x-2,y-5,7,7,"#f2d68b");

glow(x+1,y-2,26,"rgba(242,214,139,0.18)");

}

function drawSpirit(s){

if(!spiritMode) return;

ctx.globalAlpha = 0.45 + Math.sin(pulse*0.05)*0.15;

ctx.fillStyle="#9edfff";

ctx.beginPath();
ctx.arc(s.x,s.y,10,0,Math.PI*2);
ctx.fill();

rect(s.x-5,s.y+8,10,14,"#9edfff");

glow(s.x,s.y+8,34,"rgba(158,223,255,0.14)");

ctx.globalAlpha = 1;

}

function drawPlayer(){

rect(player.x,player.y+8,14,16,"#31273f");

rect(player.x+3,player.y,8,10,"#f2c7b2");

ctx.fillStyle="#171018";

rect(player.x+1,player.y-1,12,4,"#171018");

rect(player.x+4,player.y+24,2,5,"#171018");
rect(player.x+8,player.y+24,2,5,"#171018");

glow(player.x+7,player.y+16,20,"rgba(255,255,255,0.03)");

}

function drawUI(){

ctx.fillStyle="rgba(0,0,0,0.82)";
ctx.fillRect(10,210,460,50);

ctx.strokeStyle="#c79d5f";
ctx.lineWidth=2;
ctx.strokeRect(10,210,460,50);

ctx.fillStyle="#fff";
ctx.font="10px Verdana";

ctx.fillText("THE CEMETERY MEDIUM",22,226);

ctx.fillStyle="#8edbff";
ctx.fillText("SPIRIT SENSE ACTIVE",22,240);

ctx.fillStyle="#ddd";
ctx.fillText(activeMessage,22,254);

}

function update(){

pulse++;

if(keys["arrowleft"] || keys["a"]){
player.x -= player.speed;
}

if(keys["arrowright"] || keys["d"]){
player.x += player.speed;
}

if(keys["arrowup"] || keys["w"]){
player.y -= player.speed;
}

if(keys["arrowdown"] || keys["s"]){
player.y += player.speed;
}

spiritMode = keys[" "];

activeMessage = spiritMode
? "The dead drift closer when the veil opens."
: "The cemetery breathes softly in the rain.";

if(spiritMode){

spirits.forEach(s=>{

const dx = player.x - s.x;
const dy = player.y - s.y;

if(Math.sqrt(dx*dx+dy*dy) < 40){
activeMessage = s.msg;
}

});

}

player.x = Math.max(0,Math.min(WIDTH-14,player.x));
player.y = Math.max(0,Math.min(HEIGHT-16,player.y));

}

function render(){

drawSky();

drawGround();

drawRain();

drawPaths();

drawTree(42,42,1.1);
drawTree(78,228,1.2);
drawTree(425,45,1.1);
drawTree(448,220,1.25);

drawChurch();

drawFence();

drawGrave(90,88);
drawGrave(118,160);

drawGrave(355,92);
drawGrave(395,145,true);

drawGrave(300,182);
drawGrave(168,176);

drawFlowers(105,105);
drawFlowers(185,188);
drawFlowers(312,112);
drawFlowers(410,168);

drawLantern(205,198);
drawLantern(276,198);

spirits.forEach(drawSpirit);

drawPlayer();

drawUI();

}

function loop(){

update();

render();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
