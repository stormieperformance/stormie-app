
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gravekeeper</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:#111;
font-family:Verdana,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
image-rendering:pixelated;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 270;

canvas.width = WIDTH;
canvas.height = HEIGHT;

const keys = {};

window.addEventListener("keydown", e=>{
keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e=>{
keys[e.key.toLowerCase()] = false;
});

const player = {
x:240,
y:145,
speed:1.3
};

let spiritVisible = false;
let rainOffset = 0;

function rect(x,y,w,h,c){
ctx.fillStyle = c;
ctx.fillRect(x,y,w,h);
}

function drawGrass(){

rect(0,0,WIDTH,HEIGHT,"#2f4b2f");

for(let i=0;i<600;i++){

ctx.fillStyle = i%2
? "#3d613c"
: "#355535";

ctx.fillRect(
(i*37)%WIDTH,
(i*91)%HEIGHT,
2,
2
);

}

}

function drawRain(){

ctx.strokeStyle = "rgba(255,255,255,0.08)";
ctx.lineWidth = 1;

for(let i=0;i<120;i++){

const x = (i*43)%WIDTH;
const y = ((i*37)+rainOffset)%HEIGHT;

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+2,y+8);
ctx.stroke();

}

rainOffset += 3;

}

function drawPaths(){

rect(210,0,60,HEIGHT,"#8b7a5c");

rect(0,125,WIDTH,35,"#8b7a5c");

}

function drawChurch(){

rect(175,35,130,90,"#5b5b69");

ctx.fillStyle="#6c4f91";

ctx.beginPath();
ctx.moveTo(165,50);
ctx.lineTo(240,0);
ctx.lineTo(315,50);
ctx.fill();

rect(223,78,34,47,"#14141a");

ctx.fillStyle="#ddd";

ctx.fillRect(236,15,8,28);
ctx.fillRect(220,25,40,8);

ctx.fillStyle="#775";

ctx.fillRect(218,75,8,20);
ctx.fillRect(254,75,8,20);

}

function drawTree(x,y){

ctx.fillStyle="#203d20";

ctx.beginPath();
ctx.arc(x,y,24,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#5b4025";

ctx.fillRect(x-3,y+18,6,18);

}

function drawFence(){

for(let i=0;i<WIDTH;i+=16){

rect(i,198,12,3,"#8f7d55");
rect(i+4,198,3,20,"#76643d");

}

}

function drawGrave(x,y,big=false){

if(big){

rect(x,y,20,34,"#7f7f88");
rect(x+4,y-6,12,8,"#9a9aa5");

ctx.fillStyle="#444";

ctx.fillRect(x+9,y+10,2,14);
ctx.fillRect(x+5,y+16,10,2);

}else{

rect(x,y,12,20,"#999");
rect(x+3,y-4,6,5,"#aaa");

ctx.fillStyle="#444";

ctx.fillRect(x+5,y+5,2,10);
ctx.fillRect(x+2,y+9,8,2);

}

}

function drawFlowers(x,y){

ctx.fillStyle="#b46bc7";
ctx.fillRect(x,y,2,2);

ctx.fillStyle="#d9d27a";
ctx.fillRect(x+3,y+1,2,2);

ctx.fillStyle="#7fc97f";
ctx.fillRect(x+1,y+3,4,1);

}

function drawLantern(x,y){

ctx.fillStyle="#444";
ctx.fillRect(x,y,3,12);

ctx.fillStyle="#f4d27a";
ctx.fillRect(x-2,y-5,7,7);

ctx.fillStyle="rgba(244,210,122,0.15)";

ctx.beginPath();
ctx.arc(x+1,y-2,18,0,Math.PI*2);
ctx.fill();

}

function drawSpirit(){

if(!spiritVisible) return;

ctx.globalAlpha = 0.65;

ctx.fillStyle="#9adfff";

ctx.beginPath();
ctx.arc(305,125,12,0,Math.PI*2);
ctx.fill();

ctx.fillRect(299,137,12,16);

ctx.globalAlpha = 0.15;

ctx.beginPath();
ctx.arc(305,132,28,0,Math.PI*2);
ctx.fill();

ctx.globalAlpha = 1;

}

function drawPlayer(){

rect(player.x,player.y+8,14,16,"#2f2b3d");

rect(player.x+3,player.y,8,10,"#f2c9b2");

ctx.fillStyle="#1b121b";

ctx.fillRect(player.x+1,player.y-1,12,4);

}

function drawUI(){

ctx.fillStyle="rgba(0,0,0,0.82)";
ctx.fillRect(10,210,460,50);

ctx.strokeStyle="#c79f5d";
ctx.lineWidth=2;
ctx.strokeRect(10,210,460,50);

ctx.fillStyle="#fff";
ctx.font="10px Verdana";

ctx.fillText("GRAVEKEEPER",24,225);

ctx.fillStyle="#8ed7ff";
ctx.fillText("SPIRIT SENSE",24,240);

ctx.fillStyle="#ddd";

if(spiritVisible){

ctx.fillText('"The roses near the chapel were mine..."',24,252);

}else{

ctx.fillText("Press SPACE to reveal wandering spirits.",24,252);

}

}

function update(){

if(keys["arrowleft"] || keys["a"]){
player.x -= player.speed;
}

if(keys["arrowright"] || keys["d"]){
player.x += player.speed;
}

if(keys["arrowup"] || keys["w"]){
player.y -= player.speed;
}

if(keys["arrowdown"] || keys["s"]){
player.y += player.speed;
}

spiritVisible = keys[" "];

player.x = Math.max(0,Math.min(WIDTH-14,player.x));
player.y = Math.max(0,Math.min(HEIGHT-16,player.y));

}

function render(){

ctx.fillStyle="#0b1420";
ctx.fillRect(0,0,WIDTH,HEIGHT);

drawGrass();
drawRain();
drawPaths();

drawTree(45,45);
drawTree(75,220);
drawTree(420,55);
drawTree(440,220);

drawChurch();

drawFence();

drawGrave(92,88);
drawGrave(118,150);

drawGrave(352,90);
drawGrave(390,145,true);

drawGrave(295,175);
drawGrave(165,165);

drawFlowers(110,103);
drawFlowers(304,106);
drawFlowers(188,185);

drawLantern(205,196);
drawLantern(275,196);

drawSpirit();

drawPlayer();

drawUI();

}

function loop(){

update();
render();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
