<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cryptkeeper</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:#08110d;
font-family:Verdana,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
image-rendering:pixelated;
image-rendering:crisp-edges;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 480;
const HEIGHT = 270;

canvas.width = WIDTH;
canvas.height = HEIGHT;

const keys = {};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()] = false;
});

const player = {
x:235,
y:150,
speed:1.5,
frame:0
};

let spiritMode = false;
let rain = 0;

function rect(x,y,w,h,c){
ctx.fillStyle=c;
ctx.fillRect(x,y,w,h);
}

function pixel(x,y,c){
ctx.fillStyle=c;
ctx.fillRect(x,y,1,1);
}

function drawSky(){

const g = ctx.createLinearGradient(0,0,0,HEIGHT);

g.addColorStop(0,"#08131d");
g.addColorStop(1,"#102117");

ctx.fillStyle = g;
ctx.fillRect(0,0,WIDTH,HEIGHT);

}

function drawGrass(){

rect(0,0,WIDTH,HEIGHT,"#2f4f2f");

for(let i=0;i<1400;i++){

const x = (i*47)%WIDTH;
const y = (i*91)%HEIGHT;

pixel(x,y,i%3 ? "#486f42" : "#3b5c37");

}

}

function drawRain(){

ctx.strokeStyle="rgba(255,255,255,0.07)";
ctx.lineWidth=1;

for(let i=0;i<150;i++){

const x = (i*37)%WIDTH;
const y = ((i*29)+rain)%HEIGHT;

ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+2,y+7);
ctx.stroke();

}

rain += 2;

}

function drawPath(){

rect(210,0,60,HEIGHT,"#8e7a59");
rect(0,120,WIDTH,34,"#8e7a59");

for(let i=0;i<300;i++){

pixel(
210 + ((i*7)%60),
(i*17)%HEIGHT,
i%2 ? "#a08c69" : "#7d6b4e"
);

}

}

function drawFence(){

for(let i=0;i<WIDTH;i+=14){

rect(i,198,10,3,"#9d875c");
rect(i+3,198,3,22,"#7b6640");

}

}

function drawChurch(){

rect(175,35,130,90,"#5f6070");

ctx.fillStyle="#72529a";

ctx.beginPath();
ctx.moveTo(162,52);
ctx.lineTo(240,0);
ctx.lineTo(318,52);
ctx.fill();

rect(223,78,34,47,"#14131a");

ctx.fillStyle="#d9d9e4";

ctx.fillRect(236,14,8,30);
ctx.fillRect(221,25,38,8);

rect(217,76,10,18,"#f3d68a");
rect(253,76,10,18,"#f3d68a");

ctx.fillStyle="rgba(243,214,138,0.15)";
ctx.beginPath();
ctx.arc(222,85,18,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(258,85,18,0,Math.PI*2);
ctx.fill();

}

function drawTree(x,y,size=1){

ctx.fillStyle="#1d371f";

ctx.beginPath();
ctx.arc(x,y,20*size,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#274727";

ctx.beginPath();
ctx.arc(x-8,y-8,10*size,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#5d4023";

rect(x-3,y+16,6,20,"#5d4023");

}

function drawGrave(x,y,big=false){

if(big){

rect(x,y,22,36,"#777887");
rect(x+4,y-6,14,8,"#9ea0ad");

ctx.fillStyle="#45454f";

rect(x+10,y+10,2,16,"#45454f");
rect(x+6,y+16,10,2,"#45454f");

}else{

rect(x,y,12,20,"#9a9aa5");
rect(x+3,y-4,6,5,"#b7b7c2");

ctx.fillStyle="#444";

rect(x+5,y+5,2,10,"#444");
rect(x+2,y+9,8,2,"#444");

}

}

function drawFlowers(x,y){

const colors = [
"#c86be3",
"#ffe07a",
"#6ed37a",
"#ff8ea1"
];

for(let i=0;i<10;i++){

pixel(
x+((i*3)%10),
y+((i*7)%8),
colors[i%colors.length]
);

}

}

function drawLantern(x,y){

rect(x,y,3,12,"#444");

rect(x-2,y-5,7,7,"#f3d68a");

ctx.fillStyle="rgba(243,214,138,0.12)";

ctx.beginPath();
ctx.arc(x+1,y-2,22,0,Math.PI*2);
ctx.fill();

}

function drawSpirit(){

if(!spiritMode) return;

ctx.globalAlpha = 0.65;

ctx.fillStyle="#9edfff";

ctx.beginPath();
ctx.arc(320,128,12,0,Math.PI*2);
ctx.fill();

rect(314,140,12,16,"#9edfff");

ctx.globalAlpha = 0.15;

ctx.beginPath();
ctx.arc(320,136,34,0,Math.PI*2);
ctx.fill();

ctx.globalAlpha = 1;

}

function drawPlayer(){

rect(player.x,player.y+8,14,16,"#31293d");

rect(player.x+3,player.y,8,10,"#f3c8b2");

ctx.fillStyle="#1a1118";

rect(player.x+1,player.y-1,12,4,"#1a1118");

rect(player.x+4,player.y+24,2,5,"#1a1118");
rect(player.x+8,player.y+24,2,5,"#1a1118");

}

function drawUI(){

ctx.fillStyle="rgba(0,0,0,0.83)";
ctx.fillRect(10,210,460,50);

ctx.strokeStyle="#c59d5f";
ctx.lineWidth=2;
ctx.strokeRect(10,210,460,50);

ctx.fillStyle="#fff";
ctx.font="10px Verdana";

ctx.fillText("CRYPTKEEPER",22,226);

ctx.fillStyle="#8edbff";
ctx.fillText("SPIRIT SENSE",22,240);

ctx.fillStyle="#ddd";

if(spiritMode){

ctx.fillText('"The roses behind the chapel were mine..."',22,253);

}else{

ctx.fillText("Press SPACE to reveal wandering spirits.",22,253);

}

}

function update(){

if(keys["arrowleft"] || keys["a"]){
player.x -= player.speed;
}

if(keys["arrowright"] || keys["d"]){
player.x += player.speed;
}

if(keys["arrowup"] || keys["w"]){
player.y -= player.speed;
}

if(keys["arrowdown"] || keys["s"]){
player.y += player.speed;
}

spiritMode = keys[" "];

player.x = Math.max(0,Math.min(WIDTH-14,player.x));
player.y = Math.max(0,Math.min(HEIGHT-16,player.y));

}

function render(){

drawSky();

drawGrass();

drawRain();

drawPath();

drawTree(40,40,1.1);
drawTree(72,230,1.3);
drawTree(425,42,1.1);
drawTree(450,215,1.2);

drawChurch();

drawFence();

drawGrave(90,85);
drawGrave(118,155);

drawGrave(355,92);
drawGrave(392,145,true);

drawGrave(305,178);
drawGrave(170,172);

drawFlowers(104,104);
drawFlowers(188,188);
drawFlowers(314,110);
drawFlowers(410,165);

drawLantern(205,198);
drawLantern(276,198);

drawSpirit();

drawPlayer();

drawUI();

}

function loop(){

update();

render();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
