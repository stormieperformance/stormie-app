<body>

  <h1>TINY SHELL</h1>
  <p>A small thing in a big strange world. Move with <b>← →</b> or the left side of the screen. <b>Space / tap right</b> to jump.</p>

</div>
<div id="toast" class="toast"></div>

<script>
(() => {
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  W = cvs.clientWidth = window.innerWidth;
  H = cvs.clientHeight = window.innerHeight;
  cvs.width = W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

// ===== AUDIO (short SFX only, NO ambient/drone) =====
let ac=null, master=null, muted=false;
function unlockAudio(){
  if(ac) return;
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value=0.5; master.connect(ac.destination);
  }catch(e){}
}
function tone(freq,dur,type='sine',vol=0.3,bend=0){
  if(!ac||muted) return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.value=freq;
  if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+bend),ac.currentTime+dur);
  g.gain.value=0; g.gain.linearRampToValueAtTime(vol,ac.currentTime+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  o.connect(g).connect(master); o.start(); o.stop(ac.currentTime+dur+0.02);
}
function noise(dur,vol=0.2,filter=1200){
  if(!ac||muted) return;
  const b=ac.createBuffer(1,Math.floor(ac.sampleRate*dur),ac.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=ac.createBufferSource(); s.buffer=b;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filter;
  const g=ac.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(master); s.start();
}
const sfx={
  jump:()=>tone(520,.18,'square',.18,-120),
  land:()=>noise(.08,.15,800),
  stomp:()=>{tone(180,.12,'square',.22,-80); noise(.1,.18,600);},
  hurt:()=>{tone(140,.22,'sawtooth',.28,-60); noise(.15,.2,900);},
  berry:()=>{tone(880,.08,'triangle',.22); setTimeout(()=>tone(1320,.1,'triangle',.2),60);},
  crystal:()=>{tone(1320,.08,'triangle',.22); setTimeout(()=>tone(1760,.1,'triangle',.2),50); setTimeout(()=>tone(2200,.12,'triangle',.18),110);},
  bounce:()=>tone(660,.14,'sine',.25,300),
  launch:()=>{tone(300,.05,'square',.25,800); noise(.12,.15,2000);},
  portal:()=>{tone(440,.4,'sine',.18,800); setTimeout(()=>tone(660,.4,'sine',.16,800),100);},
  check:()=>{tone(990,.1,'triangle',.2); setTimeout(()=>tone(1480,.14,'triangle',.18),80);},
  fall:()=>tone(220,.5,'sawtooth',.2,-180),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.22),i*110));},
  bossHit:()=>{noise(.18,.3,500); tone(110,.2,'square',.3,-40);},
  bossDie:()=>{[200,160,120,80].forEach((f,i)=>setTimeout(()=>{tone(f,.3,'sawtooth',.3,-40);noise(.2,.25,400);},i*180));},
  shoot:()=>tone(800,.08,'square',.15,-300),
  acid:()=>tone(360,.12,'square',.15,-200),
  explode:()=>{noise(.3,.35,1500); tone(80,.3,'sawtooth',.3,-30);},
  charge:()=>tone(220,.15,'sawtooth',.18,200),
  break:()=>{noise(.15,.22,2000); tone(440,.08,'square',.15,-200);},
};

// ===== INPUT =====
const keys={left:false,right:false,jump:false,jumpPressed:false,jumpReleased:false};
addEventListener('keydown',e=>{
  unlockAudio();
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ if(!keys.jump) keys.jumpPressed=true; keys.jump=true; }
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') keys.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') keys.right=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ keys.jump=false; keys.jumpReleased=true; }
});

// touch
const touches={};
const joy={active:false,id:null,sx:0,sy:0,x:0,y:0};
cvs.addEventListener('touchstart',e=>{
  unlockAudio();
  for(const t of e.changedTouches){
    if(t.clientX < W/2){
      if(!joy.active){ joy.active=true; joy.id=t.identifier; joy.sx=t.clientX; joy.sy=t.clientY; joy.x=t.clientX; joy.y=t.clientY; }
    } else {
      touches[t.identifier]='jump';
      if(!keys.jump) keys.jumpPressed=true; keys.jump=true;
    }
  }
  e.preventDefault();
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){ joy.x=t.clientX; joy.y=t.clientY; }
  }
  e.preventDefault();
},{passive:false});
function endTouch(e){
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){ joy.active=false; joy.id=null; }
    if(touches[t.identifier]==='jump'){ delete touches[t.identifier]; }
  }
  // any remaining jump touches?
  let anyJump=false; for(const k in touches) if(touches[k]==='jump') anyJump=true;
  if(!anyJump){ keys.jump=false; keys.jumpReleased=true; }
}
cvs.addEventListener('touchend',endTouch);
cvs.addEventListener('touchcancel',endTouch);

function joyVec(){
  if(!joy.active) return 0;
  const dx=joy.x-joy.sx; const d=Math.max(-60,Math.min(60,dx))/60;
  return Math.abs(d)<0.15?0:d;
}

// ===== UTIL =====
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function aabbResolve(p,solids){
  // returns {grounded}
  let grounded=false;
  // X axis
  p.x += p.vx;
  for(const s of solids){
    if(s.disabled) continue;
    if(rectsOverlap(p,s)){
      if(p.vx>0) p.x = s.x - p.w;
      else if(p.vx<0) p.x = s.x+s.w;
      p.vx=0;
    }
  }
  // Y axis
  p.y += p.vy;
  for(const s of solids){
    if(s.disabled) continue;
    if(rectsOverlap(p,s)){
      if(p.vy>0){ p.y=s.y-p.h; grounded=true; if(s.onLand) s.onLand(); }
      else if(p.vy<0){ p.y=s.y+s.h; }
      p.vy=0;
    }
  }
  return grounded;
}

// ===== TOAST =====
const toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(msg,dur=1600){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),dur);
}

// ===== PARTICLES =====
const particles=[];
function spawnParticles(x,y,n,opts={}){
  const max = 220;
  for(let i=0;i<n && particles.length<max;i++){
    particles.push({
      x,y,
      vx:rand(-1,1)*(opts.spd||120),
      vy:rand(-1,1)*(opts.spd||120) - (opts.up||0),
      life:opts.life||0.6, age:0,
      r:opts.r||rand(1.5,3.5),
      c:opts.c||'#fff',
      g:opts.g||600,
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.age+=dt;
    if(p.age>=p.life){ particles.splice(i,1); continue; }
    p.vy += p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}
function drawParticles(){
  for(const p of particles){
    const a = 1 - p.age/p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x-cam.x,p.y-cam.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ===== CAMERA =====
const cam={x:0,y:0,shake:0};
function shake(v){ cam.shake=Math.min(24,cam.shake+v); }

// ===== PLAYER =====
const player={
  x:0,y:0,w:22,h:26,vx:0,vy:0,
  speed:230, jump:430, grav:1500,
  facing:1, coyote:0, buffer:0,
  stretch:1, squash:1, landAnim:0,
  hp:3, iframes:0, dead:false,
  checkpoint:null,
};
function resetPlayer(){
  const sp = currentLevel.spawn;
  player.x = (player.checkpoint?.x ?? sp.x);
  player.y = (player.checkpoint?.y ?? sp.y);
  player.vx=0; player.vy=0; player.hp=3; player.iframes=1; player.dead=false;
}

// ===== LEVEL DEFINITIONS =====

    // platforms

    // mushrooms (enemies)
    [[420,440],[1100,440],[1750,440],[2350,440],[3050,440]].forEach(e=>this.enemies.push(mkWalker(e[0],e[1])));
    // berries
    [[330,330],[540,270],[1030,350],[1730,330],[2330,330],[3030,330]].forEach(p=>this.pickups.push({x:p[0],y:p[1],w:14,h:14,kind:'berry',got:false,phase:Math.random()*6}));

    this.pickups.push({x:340,y:340,w:14,h:14,kind:'crystal',got:false,phase:Math.random()*6});
    this.pickups.push({x:560,y:280,w:14,h:14,kind:'crystal',got:false,phase:Math.random()*6});

    // === gap with moving platform (900-1300) ===
    this.movers.push(mkMover(940,420,140,16,940,1180,1.6));
    this.pickups.push({x:1010,y:380,w:14,h:14,kind:'crystal',got:false,phase:0});

// ===== ENEMY FACTORIES =====
function mkWalker(x,y){return{kind:'walker',x,y:y-22,w:24,h:22,vx:-40,vy:0,hp:1,alive:true,dir:-1};}
function mkBeetle(x,y){return{kind:'beetle',x,y:y-26,w:34,h:26,vx:0,vy:0,hp:1,alive:true,dir:-1,state:'idle',timer:0};}
function mkFlyer(x,y){return{kind:'flyer',x,y,w:26,h:18,vx:0,vy:0,hp:1,alive:true,ox:x,oy:y,t:Math.random()*6};}
function mkExploder(x,y){return{kind:'exploder',x,y:y-22,w:24,h:22,vx:30,vy:0,hp:1,alive:true,dir:1,fuse:0,armed:false};}
function mkCrawler(x,y){return{kind:'crawler',x,y,w:22,h:14,vx:40,vy:0,hp:1,alive:true,dir:1};}
function mkSpitter(x,y){return{kind:'spitter',x,y:y-26,w:28,h:26,vx:0,vy:0,hp:2,alive:true,dir:-1,timer:rand(0,1.5)};}
function mkLeaper(x,y){return{kind:'leaper',x,y:y-26,w:26,h:26,vx:0,vy:0,hp:1,alive:true,dir:-1,timer:rand(0.5,1.5),onGround:true};}
function mkArmored(x,y){return{kind:'armored',x,y:y-30,w:34,h:30,vx:-30,vy:0,hp:3,alive:true,dir:-1,hitFlash:0};}
function mkSwarmling(x,y){return{kind:'swarmling',x,y,w:12,h:10,vx:rand(-30,30),vy:0,hp:1,alive:true,t:Math.random()*6};}

function mkMover(x,y,w,h,minX,maxX,speed){return{kind:'mover',x,y,w,h,minX,maxX,speed,dir:1,prevX:x};}
function mkFaller(x,y,w,h){return{kind:'faller',x,y,w,h,triggered:false,timer:0,fallVY:0,startY:y};}
function mkBouncer(x,y){return{kind:'bouncer',x,y:y-14,w:36,h:14,cool:0};}
function mkLauncher(x,y){return{kind:'launcher',x,y:y-6,w:42,h:8,cool:0};}

// projectiles
const projectiles=[];
function spawnAcid(x,y,vx,vy){ projectiles.push({x,y,vx,vy,r:5,life:3,kind:'acid'}); sfx.acid(); }

// ===== STATE =====
let currentLevel = lvl1;
let levelIndex = 1;
let crystalsCollected = 0, berriesCollected = 0;
let levelComplete = false;
let started = false;

function loadLevel(idx){
  levelIndex = idx;
  currentLevel = idx===1?lvl1:lvl2;
  currentLevel.build();
  player.checkpoint = null;
  resetPlayer();
  cam.x=0; cam.y=0; cam.shake=0;
  particles.length=0; projectiles.length=0;
  levelComplete=false;
  document.getElementById('lvlTag').textContent = currentLevel.name;
  if(idx===2) toast('LEVEL 2 · THE HOLLOW SWARM',2200);
}

// ===== UPDATE =====
let last=performance.now();
function update(dt){
  if(!started) return;
  const L=currentLevel;

  // input
  let ax = 0;
  if(keys.left) ax-=1; if(keys.right) ax+=1;
  const jv = joyVec(); if(Math.abs(jv)>0) ax = jv;

  // player movement
  if(!player.dead){
    const target = ax*player.speed;
    player.vx += (target-player.vx)*0.25;
    if(Math.abs(player.vx)<2 && ax===0) player.vx=0;
    if(ax!==0) player.facing = ax>0?1:-1;

    // coyote/buffer
    player.coyote -= dt; player.buffer -= dt;
    if(keys.jumpPressed){ player.buffer = 0.12; keys.jumpPressed=false; }
    if(player.buffer>0 && player.coyote>0){
      player.vy = -player.jump; player.coyote=0; player.buffer=0;
      player.stretch = 1.25; player.squash=0.85;
      sfx.jump();
    }
    if(keys.jumpReleased){ if(player.vy<-200) player.vy=-200; keys.jumpReleased=false; }

    player.vy += player.grav*dt;
    if(player.vy>900) player.vy=900;
  } else {
    player.vy += player.grav*dt;
  }

  // build solids list
  const solids = [...L.solids];
  for(const m of L.movers){
    m.prevX = m.x;
    m.x += m.dir*m.speed*60*dt;
    if(m.x<m.minX){m.x=m.minX;m.dir=1;}
    if(m.x>m.maxX){m.x=m.maxX;m.dir=-1;}
    solids.push(m);
  }
  for(const f of L.fallers){
    if(f.triggered){
      f.timer+=dt;
      if(f.timer>0.4){
        f.fallVY += 1200*dt; f.y += f.fallVY*dt;
        if(f.y>700) f.disabled=true;
      }
    }
    if(!f.disabled) solids.push(f);
  }
  for(const b of L.bouncers||[]) solids.push(b);
  for(const l of L.launchers||[]) solids.push(l);
  for(const b of L.breakables||[]) if(!b.broken) solids.push(b);

  // carry player on moving platform if grounded on it
  // simple: if standing on mover (was grounded last frame), shift x by mover delta
  // We'll detect after resolve via standing check below.

  // store ground reference
  const prevY = player.y;

  // resolve player physics with special handling for some solid kinds
  // make scratch solids with onLand callbacks
  const scratch = solids.map(s=>{
    if(s.kind==='bouncer') return {...s, onLand:()=>{
      if(s.cool>0) return;
      player.vy = -680; s.cool=0.2; sfx.bounce();
      spawnParticles(s.x+s.w/2,s.y, 14, {c:'#7ef0d5',spd:160,life:.5});
    }};
    if(s.kind==='launcher') return {...s, onLand:()=>{
      if(s.cool>0) return;
      player.vy = -900; player.vx *= 1.4; s.cool=0.3; sfx.launch();
      shake(6);
      spawnParticles(s.x+s.w/2,s.y, 22, {c:'#ffd05a',spd:260,life:.5});
    }};
    if(s.kind==='faller') return {...s, onLand:()=>{ if(!s.triggered){ s.triggered=true; sfx.break(); }}};
    if(s.kind==='breakable') return {...s, onLand:()=>{
      s.timer += 1; if(s.timer>=1){ s.broken=true; sfx.break();
        spawnParticles(s.x+s.w/2,s.y, 10, {c:'#8a6a4a',spd:120,life:.5});
      }
    }};
    return s;
  });

  for(const s of scratch){ if(s.cool>0) s.cool-=dt; }

  const grounded = player.dead?false:aabbResolve(player, scratch);
  if(grounded){
    if(!player.wasGrounded){ sfx.land(); player.landAnim=0.15; player.squash=0.85; player.stretch=1.15; shake(2); }
    player.coyote = 0.1;
  }
  player.wasGrounded = grounded;

  // squash/stretch decay
  player.stretch += (1-player.stretch)*0.18;
  player.squash  += (1-player.squash)*0.18;
  player.landAnim = Math.max(0,player.landAnim-dt);

  // checkpoints
  for(const cp of L.checkpoints||[]){
    if(!cp.active && rectsOverlap(player,cp)){
      cp.active=true; player.checkpoint={x:cp.x,y:cp.y-10}; sfx.check();
      toast('CHECKPOINT',1200);
      spawnParticles(cp.x+9,cp.y, 16, {c:'#9adbff',spd:140,life:.6});
    }
  }

  // pickups
  for(const p of L.pickups){
    if(p.got) continue;
    p.phase+=dt*3;
    if(rectsOverlap(player,p)){
      p.got=true;
      if(p.kind==='berry'){ berriesCollected++; sfx.berry(); }
      else { crystalsCollected++; sfx.crystal(); }
      spawnParticles(p.x+7,p.y+7,12,{c:p.kind==='berry'?'#ff7f9a':'#9adbff',spd:160,life:.5});
    }
  }
  for(const c of L.crystals||[]){
    if(c.got) continue; c.phase+=dt*2;
    if(rectsOverlap(player,c)){ c.got=true; crystalsCollected++; sfx.crystal();
      spawnParticles(c.x+9,c.y+11,18,{c:'#a6d8ff',spd:200,life:.7}); shake(2);
    }
  }

  // hazards
  for(const h of L.hazards){
    if(rectsOverlap(player,h)) hurtPlayer();
  }

  // ====== ENEMIES ======
  for(const e of L.enemies){
    if(!e.alive) continue;
    updateEnemy(e, dt, L);
    // player-enemy collision
    if(player.iframes<=0 && !player.dead && rectsOverlap(player,e)){
      // stomp from above
      if(player.vy>0 && player.y+player.h - e.y < 18){
        if(e.kind==='armored'){
          e.hp--; e.hitFlash=0.2; player.vy=-360; sfx.bossHit(); shake(4);
          if(e.hp<=0){ killEnemy(e); }
        } else {
          if(e.kind==='exploder'){
            e.armed=true; e.fuse=0.05; // trigger explosion soon
          }
          killEnemy(e);
          player.vy=-360;
        }
      } else {
        hurtPlayer();
      }
    }
  }

  // projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.life-=dt;
    p.vy += 400*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.life<=0 || p.y>700){ projectiles.splice(i,1); continue; }
    // hit solids -> splash
    let hit=false;
    for(const s of L.solids){ if(p.x>s.x&&p.x<s.x+s.w&&p.y>s.y&&p.y<s.y+s.h){ hit=true; break; } }
    if(hit){
      L.hazards.push({x:p.x-12,y:p.y-4,w:24,h:8,kind:'acid',temp:2});
      projectiles.splice(i,1); continue;
    }
    // hit player
    if(player.iframes<=0 && !player.dead){
      if(Math.hypot(p.x-(player.x+player.w/2),p.y-(player.y+player.h/2))<14){
        hurtPlayer(); projectiles.splice(i,1);
      }
    }
  }
  // temp hazards
  for(let i=L.hazards.length-1;i>=0;i--){
    const h=L.hazards[i];
    if(h.temp!==undefined){ h.temp-=dt; if(h.temp<=0) L.hazards.splice(i,1); }
  }

  // boss trigger
  if(L===lvl2 && !L.bossTriggered && player.x>5650){
    L.bossTriggered=true;
    L.boss = mkBoss(6000, 200);
    L.solids.push({x:5600,y:0,w:16,h:600,kind:'rock',isWall:true});
    toast('THE HOLLOW QUEEN',2400);
    sfx.portal(); shake(10);
  }
  if(L.boss && L.boss.alive){
    updateBoss(L.boss,dt,L);
  }
  if(L.boss && !L.boss.alive && !levelComplete){
    levelComplete=true; sfx.win();
    toast('YOU SURVIVED THE SWARM',3000);
  }

  // iframes
  if(player.iframes>0) player.iframes-=dt;

  // fall off world
  if(player.y>700 && !player.dead){ sfx.fall(); player.dead=true; setTimeout(()=>{ resetPlayer(); },700); }
  if(player.dead && player.y>900){ resetPlayer(); }

  // goal (level 1)
  if(L===lvl1 && L.goal && rectsOverlap(player,L.goal) && !levelComplete){
    levelComplete=true; sfx.portal();
    setTimeout(()=>loadLevel(2), 900);
  }

  // camera
  const targetCamX = player.x - W*0.4;
  const targetCamY = player.y - H*0.55;
  cam.x += (clamp(targetCamX,0,L.width-W) - cam.x)*0.12;
  cam.y += (clamp(targetCamY,-200,260) - cam.y)*0.1;
  if(cam.shake>0){ cam.shake *= 0.86; if(cam.shake<0.2) cam.shake=0; }

  // particles
  updateParticles(dt);
}

function killEnemy(e){
  e.alive=false; sfx.stomp(); shake(3);
  spawnParticles(e.x+e.w/2,e.y+e.h/2,14,{c:'#ff9aa2',spd:160,life:.5});
  if(e.kind==='exploder'){
    setTimeout(()=>{
      sfx.explode(); shake(12);
      spawnParticles(e.x+e.w/2,e.y+e.h/2,38,{c:'#ffae3a',spd:300,life:.7,up:120});
      // damage radius
      if(player.iframes<=0 && Math.hypot(player.x-e.x,player.y-e.y)<70) hurtPlayer();
      // damage boss
      const L=currentLevel;
      if(L.boss && L.boss.alive){
        if(Math.hypot(L.boss.x+L.boss.w/2-e.x,L.boss.y+L.boss.h/2-e.y)<120){ damageBoss(L.boss,1); }
      }
    },120);
  }
}

function hurtPlayer(){
  if(player.iframes>0||player.dead) return;
  player.hp--; player.iframes=1.2; sfx.hurt(); shake(6);
  player.vy=-300; player.vx = (player.facing>0?-1:1)*200;
  spawnParticles(player.x+player.w/2,player.y+player.h/2,14,{c:'#ff5a6a',spd:200,life:.5});
  if(player.hp<=0){ player.dead=true; setTimeout(()=>resetPlayer(),700); }
}

// ===== ENEMY AI =====
function applyGravityAndGround(e,L,dt){
  e.vy += 1500*dt;
  e.x += e.vx*dt;
  // x wall
  for(const s of L.solids){
    if(s.kind==='rock'||s.kind==='grass'||s.kind==='crystal'){
      if(rectsOverlap(e,s)){
        if(e.vx>0) e.x=s.x-e.w; else if(e.vx<0) e.x=s.x+s.w;
        e.vx*=-1; if(e.dir!==undefined) e.dir*=-1;
      }
    }
  }
  e.y += e.vy*dt;
  e.onGround=false;
  for(const s of L.solids){
    if(s.kind==='rock'||s.kind==='grass'||s.kind==='crystal'){
      if(rectsOverlap(e,s)){
        if(e.vy>0){ e.y=s.y-e.h; e.onGround=true; }
        else if(e.vy<0){ e.y=s.y+s.h; }
        e.vy=0;
      }
    }
  }
  // edge flip for walkers
  if(e.onGround && e.dir!==undefined){
    const fx = e.x + (e.dir>0?e.w+2:-2);
    let support=false;
    for(const s of L.solids){
      if((s.kind==='rock'||s.kind==='grass'||s.kind==='crystal') && fx>s.x && fx<s.x+s.w && Math.abs((e.y+e.h)-s.y)<4){support=true;break;}
    }
    if(!support){ e.dir*=-1; e.vx*=-1; }
  }
}
function updateEnemy(e,dt,L){
  if(e.hitFlash>0) e.hitFlash-=dt;
  switch(e.kind){
    case 'walker': e.vx = 40*e.dir; applyGravityAndGround(e,L,dt); break;
    case 'beetle': {
      const dx = player.x-e.x;
      if(e.state==='idle'){
        e.vx = 30*e.dir; applyGravityAndGround(e,L,dt);
        if(Math.abs(dx)<260 && Math.abs(player.y-e.y)<60){
          e.state='charging'; e.timer=0.3; e.dir = dx>0?1:-1; sfx.charge();
        }
      } else {
        e.timer-=dt;
        if(e.timer>0){ e.vx=0; applyGravityAndGround(e,L,dt); }
        else { e.vx = 260*e.dir; applyGravityAndGround(e,L,dt);
          if(Math.abs(dx)>500) e.state='idle';
        }
      }
    } break;
    case 'flyer': {
      e.t+=dt;
      const dx = player.x-e.x, dy=player.y-e.y;
      e.x += Math.sign(dx)*40*dt;
      e.y = e.oy + Math.sin(e.t*3)*20 + Math.sign(dy)*Math.min(80,Math.abs(dy)*0.3);
    } break;
    case 'exploder': {
      const dx = player.x-e.x;
      e.dir = dx>0?1:-1;
      e.vx = 70*e.dir;
      applyGravityAndGround(e,L,dt);
      if(Math.abs(dx)<60 && Math.abs(player.y-e.y)<40 && !e.armed){
        e.armed=true; e.fuse=0.4;
      }
      if(e.armed){
        e.fuse-=dt;
        if(e.fuse<=0){ killEnemy(e); }
      }
    } break;
    case 'crawler': {
      // walks on ceiling (constant y above its ceiling)
      e.x += 50*e.dir*dt;
      // flip at edges of ceiling slab
      let support=false;
      for(const s of L.solids){
        if(s.kind==='rock' && (e.x+(e.dir>0?e.w+2:-2))>s.x && (e.x+(e.dir>0?e.w+2:-2))<s.x+s.w && Math.abs(e.y - (s.y+s.h))<4) support=true;
      }
      if(!support) e.dir*=-1;
    } break;
    case 'spitter': {
      applyGravityAndGround(e,L,dt);
      const dx = player.x-e.x;
      e.dir = dx>0?1:-1;
      e.timer-=dt;
      if(e.timer<=0 && Math.abs(dx)<420){
        e.timer = 1.8 + Math.random()*0.6;
        const sx = e.x+e.w/2, sy=e.y+6;
        const tx = player.x, ty=player.y;
        const vx = (tx-sx)*0.8, vy=-220;
        spawnAcid(sx,sy,vx*0.5,vy);
      }
    } break;
    case 'leaper': {
      applyGravityAndGround(e,L,dt);
      e.timer-=dt;
      if(e.onGround && e.timer<=0){
        const dx = player.x-e.x;
        if(Math.abs(dx)<320){
          e.vy=-480; e.vx = clamp(dx,-180,180); e.timer=1.4;
        } else e.timer = 0.6;
      } else if(e.onGround) e.vx*=0.8;
    } break;
    case 'armored': applyGravityAndGround(e,L,dt); e.vx = 30*e.dir; break;
    case 'swarmling': {
      e.t+=dt;
      const dx = player.x-e.x, dy = player.y-e.y;
      const d = Math.hypot(dx,dy)+0.01;
      e.vx += (dx/d)*180*dt; e.vy += (dy/d)*180*dt;
      e.vx *= 0.96; e.vy *= 0.96;
      e.vx += Math.cos(e.t*5+e.x)*40*dt;
      e.x += e.vx*dt; e.y += e.vy*dt;
    } break;
  }
}

// ===== BOSS =====
function mkBoss(x,y){
  return{kind:'boss',x,y,w:140,h:120,vx:0,vy:0,hp:8,maxHp:8,alive:true,
    phase:1,timer:1.0,state:'idle',anchorY:y,t:0,iframes:0,flash:0};
}
function damageBoss(b,n){
  if(b.iframes>0) return;
  b.hp-=n; b.iframes=0.6; b.flash=0.3; sfx.bossHit(); shake(8);
  spawnParticles(b.x+b.w/2,b.y+b.h/2,18,{c:'#ff5a6a',spd:240,life:.6});
  if(b.hp<=0){
    b.alive=false; sfx.bossDie(); shake(20);
    for(let i=0;i<60;i++) spawnParticles(b.x+b.w/2+rand(-40,40),b.y+b.h/2+rand(-40,40),1,{c:i%2?'#ff9aa2':'#ffd05a',spd:300,life:1.2,up:200});
  } else if(b.hp<=4 && b.phase===1){
    b.phase=2; toast('PHASE 2',1400); sfx.portal();
  }
}
function updateBoss(b,dt,L){
  b.t+=dt; b.timer-=dt; if(b.iframes>0) b.iframes-=dt; if(b.flash>0) b.flash-=dt;
  // float in place with sin
  b.y = b.anchorY + Math.sin(b.t*1.5)*30;
  // track player horizontally
  const targetX = player.x - b.w/2 + 40;
  b.x += (targetX - b.x)*0.5*dt;
  // attacks
  if(b.timer<=0){
    if(b.phase===1){
      // spit barrage (3 acids)
      for(let i=0;i<3;i++){
        setTimeout(()=>{
          const sx=b.x+b.w/2, sy=b.y+b.h;
          const dx=player.x-sx, dy=player.y-sy;
          spawnAcid(sx,sy,dx*0.6+rand(-40,40),-100);
        }, i*180);
      }
      b.timer = 2.4;
    } else {
      // phase 2: spawn swarmlings + acid
      for(let i=0;i<4;i++) L.enemies.push(mkSwarmling(b.x+b.w/2+rand(-30,30), b.y+b.h));
      setTimeout(()=>{
        const sx=b.x+b.w/2, sy=b.y+b.h;
        const dx=player.x-sx;
        spawnAcid(sx,sy,dx*0.6,-200);
      },300);
      b.timer = 1.8;
    }
  }
  // weak point on top: player can stomp
  const weak = {x:b.x+30,y:b.y-6,w:b.w-60,h:18};
  if(player.iframes<=0 && rectsOverlap(player,weak) && player.vy>0){
    damageBoss(b,1); player.vy=-460;
  } else if(player.iframes<=0 && rectsOverlap(player,b)){
    hurtPlayer();
  }
}

// ===== RENDERING =====
function drawForest(){
  const L=currentLevel;
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,L.bg.top); g.addColorStop(.6,L.bg.mid); g.addColorStop(1,L.bg.low);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // parallax hills
  ctx.fillStyle='#0e2a1a';
  for(let i=0;i<6;i++){
    const px = -((cam.x*0.2 + i*220)%(W+440)) + 220;
    ctx.beginPath(); ctx.arc(px,H*0.62, 200, Math.PI, 0); ctx.fill();
  }
  // ground/solids
  drawSolids();
  drawCheckpoints();
  drawPickups();
  drawHazards();
  drawMovers();
  drawEnemies();
  drawPlayer();
  if(L.goal){
    const gx=L.goal.x-cam.x, gy=L.goal.y-cam.y;
    ctx.save();
    ctx.translate(gx+L.goal.w/2,gy+L.goal.h/2);
    const r = 30+Math.sin(performance.now()/300)*4;
    const grad = ctx.createRadialGradient(0,0,4,0,0,r);
    grad.addColorStop(0,'#fff'); grad.addColorStop(1,'#7ef0d500');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawHollow(){
  const L=currentLevel;
  // deep gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,L.bg.top); g.addColorStop(.5,L.bg.mid); g.addColorStop(1,L.bg.low);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // parallax stalactites/crystals
  for(let i=0;i<10;i++){
    const px = -((cam.x*0.15 + i*260)%(W+520)) + 260;
    const py = 60 + (i%3)*30;
    ctx.fillStyle = '#1b1133';
    ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px+40,py); ctx.lineTo(px+80,0); ctx.closePath(); ctx.fill();
  }
  // far crystals
  for(let i=0;i<14;i++){
    const px = -((cam.x*0.35 + i*200)%(W+400)) + 200;
    ctx.fillStyle='rgba(120,180,255,0.12)';
    ctx.beginPath(); ctx.moveTo(px,H-90); ctx.lineTo(px+18,H-160); ctx.lineTo(px+34,H-90); ctx.closePath(); ctx.fill();
  }
  // glowing pools
  ctx.fillStyle='rgba(126,240,213,0.07)';
  for(let i=0;i<6;i++){
    const px = -((cam.x*0.5 + i*340)%(W+680)) + 340;
    ctx.beginPath(); ctx.ellipse(px,H-40,180,30,0,0,Math.PI*2); ctx.fill();
  }
  drawSolids();
  drawDecals();
  drawBreakables();
  drawFallers();
  drawMovers();
  drawLaunchers();
  drawBouncers();
  drawCheckpoints();
  drawPickups();
  drawCrystals();
  drawHazards();
  drawProjectiles();
  drawEnemies();
  drawBoss();
  drawPlayer();
  if(L.fog) drawFog();
  if(L.dark) drawVignette();
}

function drawSolids(){
  for(const s of currentLevel.solids){
    if(s.disabled||s.isWall) continue;
    const x=s.x-cam.x,y=s.y-cam.y;
    if(s.kind==='grass'){
      ctx.fillStyle='#2c5a34'; ctx.fillRect(x,y,s.w,s.h);
      ctx.fillStyle='#48894f'; ctx.fillRect(x,y,s.w,4);
    } else if(s.kind==='plat'){
      ctx.fillStyle='#5a3a26'; ctx.fillRect(x,y,s.w,s.h);
      ctx.fillStyle='#48894f'; ctx.fillRect(x,y,s.w,3);
    } else if(s.kind==='rock'){
      const grad=ctx.createLinearGradient(0,y,0,y+s.h);
      grad.addColorStop(0,'#3a2d4f'); grad.addColorStop(1,'#16101f');
      ctx.fillStyle=grad; ctx.fillRect(x,y,s.w,s.h);
      ctx.fillStyle='#5a4a78'; ctx.fillRect(x,y,s.w,3);
    } else if(s.kind==='crystal'){
      const grad=ctx.createLinearGradient(0,y,0,y+s.h);
      grad.addColorStop(0,'#2a4a78'); grad.addColorStop(1,'#0e1a35');
      ctx.fillStyle=grad; ctx.fillRect(x,y,s.w,s.h);
      ctx.strokeStyle='rgba(150,210,255,0.35)'; ctx.lineWidth=1;
      for(let i=0;i<3;i++) ctx.strokeRect(x+i*4,y+i*4,s.w-i*8,s.h-i*8);
    }
  }
}
function drawDecals(){
  for(const d of currentLevel.decals||[]){
    const x=d.x-cam.x, y=d.y-cam.y;
    if(d.kind==='glowmush'){
      ctx.fillStyle='#2b1a3a'; ctx.fillRect(x-2,y-d.h,4,d.h);
      ctx.fillStyle=d.c; ctx.beginPath(); ctx.arc(x,y-d.h,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=d.c+'44'; ctx.beginPath(); ctx.arc(x,y-d.h,14,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawBreakables(){
  for(const b of currentLevel.breakables||[]){
    if(b.broken) continue;
    const x=b.x-cam.x, y=b.y-cam.y;
    const cracked = b.timer>0;
    ctx.fillStyle='#5e3e22'; ctx.fillRect(x,y,b.w,b.h);
    ctx.fillStyle='#7a5230'; ctx.fillRect(x,y,b.w,3);
    if(cracked){ ctx.strokeStyle='#0006'; ctx.beginPath(); ctx.moveTo(x+4,y+3); ctx.lineTo(x+b.w-6,y+b.h-2); ctx.stroke(); }
  }
}
function drawFallers(){
  for(const f of currentLevel.fallers||[]){
    if(f.disabled) continue;
    const x=f.x-cam.x, y=f.y-cam.y;
    const flicker = f.triggered && Math.floor(performance.now()/60)%2===0;
    ctx.fillStyle = flicker?'#a44':'#3a2d4f'; ctx.fillRect(x,y,f.w,f.h);
    ctx.fillStyle='#7a6aa0'; ctx.fillRect(x,y,f.w,3);
  }
}
function drawMovers(){
  for(const m of currentLevel.movers||[]){
    const x=m.x-cam.x, y=m.y-cam.y;
    ctx.fillStyle='#243b66'; ctx.fillRect(x,y,m.w,m.h);
    ctx.fillStyle='#6aa0ff'; ctx.fillRect(x,y,m.w,3);
  }
}
function drawLaunchers(){
  for(const l of currentLevel.launchers||[]){
    const x=l.x-cam.x, y=l.y-cam.y;
    ctx.fillStyle='#5a3a10'; ctx.fillRect(x,y,l.w,l.h);
    ctx.fillStyle='#ffd05a'; ctx.fillRect(x,y-2,l.w,2);
    // arrow
    ctx.fillStyle='#ffd05a';
    ctx.beginPath(); ctx.moveTo(x+l.w/2-6,y-6); ctx.lineTo(x+l.w/2+6,y-6); ctx.lineTo(x+l.w/2,y-14); ctx.closePath(); ctx.fill();
  }
}
function drawBouncers(){
  for(const b of currentLevel.bouncers||[]){
    const x=b.x-cam.x, y=b.y-cam.y;
    ctx.fillStyle='#2b1a3a'; ctx.fillRect(x+6,y+6,b.w-12,8);
    ctx.fillStyle='#7ef0d5';
    ctx.beginPath(); ctx.ellipse(x+b.w/2,y+6,b.w/2,8,0,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7ef0d544'; ctx.beginPath(); ctx.ellipse(x+b.w/2,y+6,b.w/2+6,12,0,Math.PI,Math.PI*2); ctx.fill();
  }
}
function drawCheckpoints(){
  for(const cp of currentLevel.checkpoints||[]){
    const x=cp.x-cam.x, y=cp.y-cam.y;
    ctx.fillStyle='#2a2a3a'; ctx.fillRect(x+6,y,4,cp.h);
    ctx.fillStyle = cp.active?'#7ef0d5':'#888';
    ctx.beginPath(); ctx.moveTo(x+10,y); ctx.lineTo(x+10,y+10); ctx.lineTo(x+22,y+5); ctx.closePath(); ctx.fill();
    if(cp.active){
      ctx.fillStyle='rgba(126,240,213,0.2)';
      ctx.beginPath(); ctx.arc(x+10,y+cp.h,16+Math.sin(performance.now()/250)*3,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawPickups(){
  for(const p of currentLevel.pickups){
    if(p.got) continue;
    const x=p.x-cam.x, y=p.y-cam.y + Math.sin(p.phase)*3;
    if(p.kind==='berry'){
      ctx.fillStyle='#ff7f9a'; ctx.beginPath(); ctx.arc(x+7,y+7,6,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#48894f'; ctx.fillRect(x+6,y+1,2,3);
    } else {
      ctx.fillStyle='#9adbff'; ctx.beginPath(); ctx.moveTo(x+7,y); ctx.lineTo(x+14,y+7); ctx.lineTo(x+7,y+14); ctx.lineTo(x,y+7); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(154,219,255,0.3)'; ctx.beginPath(); ctx.arc(x+7,y+7,12,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawCrystals(){
  for(const c of currentLevel.crystals||[]){
    if(c.got) continue;
    const x=c.x-cam.x, y=c.y-cam.y + Math.sin(c.phase)*3;
    ctx.fillStyle='rgba(166,216,255,0.2)'; ctx.beginPath(); ctx.arc(x+9,y+11,22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#a6d8ff';
    ctx.beginPath(); ctx.moveTo(x+9,y); ctx.lineTo(x+18,y+11); ctx.lineTo(x+9,y+22); ctx.lineTo(x,y+11); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff8'; ctx.fillRect(x+8,y+4,2,6);
  }
}
function drawHazards(){
  for(const h of currentLevel.hazards){
    const x=h.x-cam.x, y=h.y-cam.y;
    if(h.kind==='spike'){
      ctx.fillStyle='#cdd6e0';
      const n = Math.max(1,Math.floor(h.w/8));
      for(let i=0;i<n;i++){
        ctx.beginPath(); ctx.moveTo(x+i*(h.w/n),y+h.h); ctx.lineTo(x+(i+0.5)*(h.w/n),y); ctx.lineTo(x+(i+1)*(h.w/n),y+h.h); ctx.closePath(); ctx.fill();
      }
    } else if(h.kind==='acid'){
      ctx.fillStyle='rgba(150,255,140,0.5)'; ctx.fillRect(x,y,h.w,h.h);
      ctx.fillStyle='#a6ff8a'; ctx.fillRect(x,y,h.w,3);
    }
  }
}
function drawProjectiles(){
  for(const p of projectiles){
    const x=p.x-cam.x, y=p.y-cam.y;
    ctx.fillStyle='rgba(150,255,140,0.4)'; ctx.beginPath(); ctx.arc(x,y,p.r+3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#a6ff8a'; ctx.beginPath(); ctx.arc(x,y,p.r,0,Math.PI*2); ctx.fill();
  }
}

function drawEnemies(){
  for(const e of currentLevel.enemies){
    if(!e.alive) continue;
    const x=e.x-cam.x, y=e.y-cam.y;
    ctx.save();
    if(e.hitFlash>0){ ctx.globalAlpha = 0.5+Math.random()*0.5; }
    switch(e.kind){
      case 'walker':
        ctx.fillStyle='#c45c8c'; ctx.beginPath(); ctx.arc(x+e.w/2,y+8,12,Math.PI,0); ctx.fill();
        ctx.fillStyle='#fdd'; ctx.fillRect(x+4,y+10,e.w-8,e.h-10);
        ctx.fillStyle='#000'; ctx.fillRect(x+e.w/2-4,y+12,2,2); ctx.fillRect(x+e.w/2+2,y+12,2,2);
        break;
      case 'beetle':
        ctx.fillStyle='#3a2d4f'; ctx.fillRect(x,y+4,e.w,e.h-4);
        ctx.fillStyle='#7a3aa0'; ctx.beginPath(); ctx.ellipse(x+e.w/2,y+6,e.w/2,8,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#ff5a6a'; ctx.fillRect(x+(e.dir>0?e.w-6:2),y+10,4,4);
        if(e.state==='charging'){ ctx.fillStyle='#ff5a6a88'; ctx.fillRect(x-10*e.dir,y+12,10,4); }
        break;
      case 'flyer':
        ctx.fillStyle='#7ef0d5'; ctx.beginPath(); ctx.ellipse(x+e.w/2,y+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2); ctx.fill();
        const wf = Math.sin(performance.now()/40)*4;
        ctx.fillStyle='rgba(126,240,213,0.5)';
        ctx.beginPath(); ctx.ellipse(x+4,y+e.h/2+wf,8,3,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x+e.w-4,y+e.h/2-wf,8,3,0,0,Math.PI*2); ctx.fill();
        break;
      case 'exploder':
        const pulse = e.armed?Math.abs(Math.sin(performance.now()/40)):0.5;
        ctx.fillStyle = e.armed?`rgba(255,${100+pulse*100},0,1)`:'#a04a2a';
        ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2,e.w/2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.fillRect(x+8,y+8,3,3); ctx.fillRect(x+e.w-11,y+8,3,3);
        break;
      case 'crawler':
        ctx.fillStyle='#582a78'; ctx.beginPath(); ctx.ellipse(x+e.w/2,y+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#582a78'; ctx.lineWidth=2;
        for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+4+i*5,y+e.h); ctx.lineTo(x+4+i*5,y+e.h+5); ctx.stroke(); }
        break;
      case 'spitter':
        ctx.fillStyle='#3a5a2a'; ctx.fillRect(x,y+6,e.w,e.h-6);
        ctx.fillStyle='#6a9a4a'; ctx.beginPath(); ctx.arc(x+e.w/2,y+6,e.w/2,Math.PI,0); ctx.fill();
        ctx.fillStyle='#a6ff8a'; ctx.fillRect(x+(e.dir>0?e.w-6:2),y+10,4,4);
        break;
      case 'leaper':
        ctx.fillStyle='#a04060'; ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2,e.w/2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.fillRect(x+6,y+8,4,4); ctx.fillRect(x+e.w-10,y+8,4,4);
        ctx.fillStyle='#000'; ctx.fillRect(x+7,y+9,2,2); ctx.fillRect(x+e.w-9,y+9,2,2);
        break;
      case 'armored':
        ctx.fillStyle='#888'; ctx.fillRect(x,y+6,e.w,e.h-6);
        ctx.fillStyle='#aaa'; ctx.beginPath(); ctx.arc(x+e.w/2,y+8,e.w/2,Math.PI,0); ctx.fill();
        ctx.strokeStyle='#444'; ctx.lineWidth=2; ctx.strokeRect(x+2,y+8,e.w-4,e.h-10);
        // hp pips
        ctx.fillStyle='#ff5a6a'; for(let i=0;i<e.hp;i++) ctx.fillRect(x+4+i*6,y+2,4,3);
        break;
      case 'swarmling':
        ctx.fillStyle='#ffae3a'; ctx.beginPath(); ctx.arc(x+e.w/2,y+e.h/2,e.w/2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000'; ctx.fillRect(x+e.w/2-1,y+e.h/2-1,2,2);
        break;
    }
    ctx.restore();
  }
}

function drawBoss(){
  const b = currentLevel.boss;
  if(!b||!b.alive) return;
  const x = b.x-cam.x, y=b.y-cam.y;
  ctx.save();
  if(b.flash>0){ ctx.globalAlpha = 0.6; }
  // body
  const grad = ctx.createRadialGradient(x+b.w/2,y+b.h/2,10,x+b.w/2,y+b.h/2,b.w);
  grad.addColorStop(0,'#a04060'); grad.addColorStop(1,'#2a0a20');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.ellipse(x+b.w/2,y+b.h/2+10,b.w/2,b.h/2,0,0,Math.PI*2); ctx.fill();
  // crown / weak point
  ctx.fillStyle='#ffd05a';
  ctx.beginPath(); ctx.ellipse(x+b.w/2,y+8,b.w/2-20,16,0,Math.PI,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,208,90,0.4)';
  ctx.beginPath(); ctx.ellipse(x+b.w/2,y+8,b.w/2-12,22,0,Math.PI,Math.PI*2); ctx.fill();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x+b.w/2-22,y+b.h/2+4,6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+b.w/2+22,y+b.h/2+4,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  const ex = clamp((player.x-b.x)/200,-2,2), ey=clamp((player.y-b.y)/200,-2,2);
  ctx.beginPath(); ctx.arc(x+b.w/2-22+ex,y+b.h/2+4+ey,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+b.w/2+22+ex,y+b.h/2+4+ey,3,0,Math.PI*2); ctx.fill();
  // hp bar
  ctx.restore();
  const bw = 200, bx=W/2-bw/2, by=24;
  ctx.fillStyle='#0008'; ctx.fillRect(bx-3,by-3,bw+6,12);
  ctx.fillStyle='#ff5a6a'; ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),6);
  ctx.fillStyle='#fff'; ctx.font='700 11px system-ui'; ctx.textAlign='center';
  ctx.fillText('THE HOLLOW QUEEN',W/2,by-6);
}

function drawPlayer(){
  if(player.dead) return;
  const x = player.x-cam.x, y=player.y-cam.y;
  const sx = player.stretch, sy=player.squash;
  const blink = player.iframes>0 && Math.floor(performance.now()/60)%2===0;
  if(blink) ctx.globalAlpha=0.4;
  ctx.save();
  ctx.translate(x+player.w/2, y+player.h);
  ctx.scale(sx,sy);
  // shell
  ctx.fillStyle='#f6c45e';
  ctx.beginPath(); ctx.ellipse(0,-player.h/2,player.w/2,player.h/2,0,0,Math.PI*2); ctx.fill();
  // shell pattern
  ctx.strokeStyle='#a06010'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,-player.h/2,player.w/2-3,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
  // body underneath
  ctx.fillStyle='#7ec07a';
  ctx.fillRect(-player.w/2+2,-6,player.w-4,6);
  // head
  ctx.fillStyle='#7ec07a';
  ctx.beginPath(); ctx.arc(player.facing*7,-4,5,0,Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle='#000';
  ctx.fillRect(player.facing*7+(player.facing>0?1:-2),-5,2,2);
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawFog(){
  ctx.fillStyle='rgba(20,10,40,0.18)';
  for(let i=0;i<3;i++){
    const off = -((cam.x*0.4 + i*200 + performance.now()/40)%(W+400)) + 200;
    ctx.beginPath(); ctx.ellipse(off,H*0.6+i*40,260,40,0,0,Math.PI*2); ctx.fill();
  }
}
function drawVignette(){
  const g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3, W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.7)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawHUD(){
  // hearts
  for(let i=0;i<3;i++){
    const x = 10 + i*22, y = 40;
    ctx.fillStyle = i<player.hp?'#ff5a6a':'#3a2030';
    ctx.beginPath();
    ctx.moveTo(x+8,y+14);
    ctx.bezierCurveTo(x-4,y+6,x+2,y-4,x+8,y+4);
    ctx.bezierCurveTo(x+14,y-4,x+20,y+6,x+8,y+14);
    ctx.fill();
  }
  // counters
  ctx.fillStyle='#fff'; ctx.font='700 13px system-ui'; ctx.textAlign='right';
  ctx.fillText('◆ '+crystalsCollected+'   ● '+berriesCollected, W-12, 56);

  // touch joystick visual
  if(joy.active){
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.arc(joy.sx,joy.sy,60,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(joy.x,joy.y,24,0,Math.PI*2); ctx.fill();
  }
  // jump button hint
  if('ontouchstart' in window){
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(W-80,H-90,50,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='700 12px system-ui'; ctx.textAlign='center';
    ctx.fillText('JUMP',W-80,H-86);
  }

  if(levelComplete && currentLevel===lvl2){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='900 38px system-ui'; ctx.fillText('THE HOLLOW FALLS',W/2,H/2-10);
    ctx.font='15px system-ui'; ctx.fillText('You carried the swarm home.',W/2,H/2+24);
  }
}

// ===== RENDER =====
function render(){
  ctx.save();
  if(cam.shake>0){ ctx.translate(rand(-cam.shake,cam.shake),rand(-cam.shake,cam.shake)); }
  if(currentLevel===lvl1) currentLevel.draw();
  else currentLevel.draw();
  drawParticles();
  ctx.restore();
  drawHUD();
}

// ===== LOOP =====
function loop(now){
  const dt = Math.min(.033,(now-last)/1000); last=now;
  update(dt); render();
  requestAnimationFrame(loop);
}

// ===== MENU / BUTTONS =====
document.getElementById('playBtn').addEventListener('click',()=>{
  unlockAudio();
  document.getElementById('menu').classList.add('hide');
  started=true;
});
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted=!muted; if(master) master.gain.value = muted?0:0.5;
  document.getElementById('muteBtn').textContent = muted?'🔇':'🔊';
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  player.checkpoint=null; loadLevel(levelIndex);
});

// initial
lvl1.build();
loadLevel(1);
started=false;
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
