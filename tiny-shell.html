<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TINY SHELL</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1f16;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: white;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #8fd6ff;
  }
  .ui {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: start;
    pointer-events: none;
  }
  .title {
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 14px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.18);
  }
  .score {
    font-weight: 800;
    font-size: 14px;
    background: rgba(255,255,255,0.25);
    padding: 8px 12px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
  }
  .controls {
    position: fixed;
    bottom: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    z-index: 20;
  }
  .left-controls {
    display: flex;
    gap: 12px;
  }
  button {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.28);
    color: white;
    font-size: 24px;
    font-weight: 900;
    backdrop-filter: blur(8px);
    touch-action: none;
  }
  .jump {
    width: 78px;
    height: 78px;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .message {
    position: fixed;
    bottom: 105px;
    left: 20px;
    right: 20px;
    text-align: center;
    font-size: 13px;
    opacity: 0.9;
    pointer-events: none;
    text-shadow: 0 2px 0 rgba(0,0,0,0.18);
  }
</style>
</head>

<body>
<canvas id="game"></canvas>

<div class="ui">
  <div>
    <div class="title">TINY SHELL</div>
    <div style="font-size:12px;opacity:.85;margin-top:4px;">Cozy forest platformer prototype</div>
  </div>
  <div class="score" id="score">Berries: 0 / 12</div>
</div>

<div class="message" id="message">Move, jump, collect berries, stomp grumpy mushrooms.</div>

<div class="controls">
  <div class="left-controls">
    <button id="left">‹</button>
    <button id="right">›</button>
  </div>
  <button class="jump" id="jump">JUMP</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const keys = { left:false, right:false, jump:false };

function bindButton(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener("pointerdown", e => { e.preventDefault(); keys[key] = true; });
  btn.addEventListener("pointerup", e => { e.preventDefault(); keys[key] = false; });
  btn.addEventListener("pointerleave", e => { keys[key] = false; });
}
bindButton("left", "left");
bindButton("right", "right");
bindButton("jump", "jump");

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") keys.jump = true;
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") keys.jump = false;
});

const world = {
  width: 3200,
  gravity: 1800,
  floor: 0
};

let cameraX = 0;
let last = performance.now();

const player = {
  x: 80,
  y: 0,
  w: 34,
  h: 40,
  vx: 0,
  vy: 0,
  speed: 390,
  jump: 690,
  grounded: false,
  face: 1,
  alive: true,
  won: false,
  squash: 0
};

const platforms = [
  {x:0,y:520,w:520,h:80},
  {x:560,y:470,w:220,h:34},
  {x:840,y:420,w:240,h:34},
  {x:1160,y:520,w:500,h:80},
  {x:1480,y:405,w:180,h:32},
  {x:1760,y:350,w:250,h:32},
  {x:2100,y:500,w:500,h:80},
  {x:2450,y:415,w:230,h:32},
  {x:2760,y:520,w:520,h:80}
];

const berries = [
  {x:190,y:460},{x:330,y:460},{x:640,y:410},{x:900,y:360},
  {x:1250,y:460},{x:1540,y:350},{x:1830,y:295},{x:2190,y:440},
  {x:2360,y:440},{x:2520,y:360},{x:2860,y:460},{x:3030,y:460}
].map(b => ({...b, taken:false, bob:Math.random()*10}));

const enemies = [
  {x:720,y:430,w:34,h:32,vx:55,min:590,max:760,alive:true},
  {x:1320,y:480,w:34,h:32,vx:70,min:1190,max:1600,alive:true},
  {x:2240,y:460,w:34,h:32,vx:65,min:2120,max:2550,alive:true}
];

const particles = [];

function rects(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function resetPlayer() {
  player.x = 80;
  player.y = 420;
  player.vx = 0;
  player.vy = 0;
  player.alive = true;
  player.won = false;
  messageEl.textContent = "Move, jump, collect berries, stomp grumpy mushrooms.";
}

function addParticles(x,y,n=12) {
  for (let i=0;i<n;i++) {
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*240,
      vy:(Math.random()-1.2)*260,
      life:0.7+Math.random()*0.5,
      r:2+Math.random()*4
    });
  }
}

function update(dt) {
  if (player.won) return;

  let move = 0;
  if (keys.left) move -= 1;
  if (keys.right) move += 1;

  player.vx = move * player.speed;
  if (move !== 0) player.face = move;

  if (keys.jump && player.grounded) {
    player.vy = -player.jump;
    player.grounded = false;
    player.squash = 1;
    addParticles(player.x + player.w/2, player.y + player.h, 5);
  }

  player.vy += world.gravity * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.x = Math.max(0, Math.min(world.width - player.w, player.x));

  player.grounded = false;

  for (const p of platforms) {
    if (rects(player, p)) {
      if (player.vy >= 0 && player.y + player.h - player.vy * dt <= p.y + 8) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  }

  for (const berry of berries) {
    if (!berry.taken) {
      const bx = berry.x, by = berry.y;
      const dx = player.x + player.w/2 - bx;
      const dy = player.y + player.h/2 - by;
      if (Math.hypot(dx, dy) < 34) {
        berry.taken = true;
        addParticles(bx, by, 14);
        messageEl.textContent = "Berry collected.";
      }
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx * dt;
    if (e.x < e.min || e.x > e.max) e.vx *= -1;

    if (rects(player, e)) {
      const stomp = player.vy > 0 && player.y + player.h - player.vy * dt < e.y + 12;
      if (stomp) {
        e.alive = false;
        player.vy = -520;
        addParticles(e.x + e.w/2, e.y + e.h/2, 18);
        messageEl.textContent = "Boop. Mushroom defeated.";
      } else {
        messageEl.textContent = "Ouch. Try again.";
        addParticles(player.x + player.w/2, player.y + player.h/2, 20);
        resetPlayer();
      }
    }
  }

  if (player.y > 850) {
    messageEl.textContent = "You fell into the soft moss. Try again.";
    resetPlayer();
  }

  const collected = berries.filter(b => b.taken).length;
  scoreEl.textContent = `Berries: ${collected} / ${berries.length}`;

  if (player.x > 3040 && collected >= berries.length) {
    player.won = true;
    messageEl.textContent = "Level complete. Tiny Shell found the forest gate.";
    addParticles(player.x, player.y, 40);
  } else if (player.x > 3040) {
    messageEl.textContent = "The forest gate wants all berries first.";
  }

  cameraX += ((player.x - W * 0.35) - cameraX) * Math.min(1, dt * 5);
  cameraX = Math.max(0, Math.min(world.width - W, cameraX));

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    if (p.life <= 0) particles.splice(i,1);
  }

  player.squash = Math.max(0, player.squash - dt * 5);
}

function drawSky() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#9ee8ff");
  g.addColorStop(0.55,"#c5f3cf");
  g.addColorStop(1,"#6bb36e");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "rgba(255,255,255,0.7)";
  for (let i=0;i<7;i++) {
    const x = (i*430 - cameraX*0.15) % (W+260) - 160;
    const y = 70 + (i%3)*38;
    cloud(x,y);
  }
}

function cloud(x,y) {
  ctx.beginPath();
  ctx.arc(x,y,24,0,Math.PI*2);
  ctx.arc(x+28,y-8,30,0,Math.PI*2);
  ctx.arc(x+62,y,24,0,Math.PI*2);
  ctx.arc(x+34,y+12,26,0,Math.PI*2);
  ctx.fill();
}

function drawForest() {
  for (let layer=0; layer<3; layer++) {
    const speed = [0.25,0.4,0.65][layer];
    const base = H - [190,150,110][layer];
    const color = ["#4f9866","#36784e","#245d3d"][layer];

    ctx.fillStyle = color;
    for (let i=0;i<18;i++) {
      const x = (i*230 - cameraX*speed) % (W+260) - 130;
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.lineTo(x+55, base-170-layer*24);
      ctx.lineTo(x+110, base);
      ctx.closePath();
      ctx.fill();

      ctx.fillRect(x+48, base-20, 14, 80);
    }
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    const x = p.x - cameraX;
    const y = p.y;
    if (x + p.w < -50 || x > W+50) continue;

    ctx.fillStyle = "#6b4b2a";
    roundRect(x,y,p.w,p.h,14);
    ctx.fill();

    ctx.fillStyle = "#49a85e";
    roundRect(x,y,p.w,22,14);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(x+8,y+5,p.w-16,3);
  }
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
}

function drawBerries(t) {
  for (const b of berries) {
    if (b.taken) continue;
    const x = b.x - cameraX;
    const y = b.y + Math.sin(t*5 + b.bob)*5;
    if (x < -40 || x > W+40) continue;

    ctx.fillStyle = "#ff5e8a";
    ctx.beginPath();
    ctx.arc(x,y,12,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.65)";
    ctx.beginPath();
    ctx.arc(x-4,y-5,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#377d42";
    ctx.beginPath();
    ctx.ellipse(x+2,y-14,8,4,-0.5,0,Math.PI*2);
    ctx.fill();
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.x - cameraX;
    const y = e.y;
    if (x < -60 || x > W+60) continue;

    ctx.fillStyle = "#b96a4a";
    ctx.beginPath();
    ctx.arc(x+17,y+16,18,Math.PI,0);
    ctx.lineTo(x+35,y+32);
    ctx.lineTo(x,y+32);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#fff0d0";
    ctx.beginPath();
    ctx.arc(x+10,y+15,3,0,Math.PI*2);
    ctx.arc(x+24,y+15,3,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#3b1f18";
    ctx.fillRect(x+9,y+23,16,3);
  }
}

function drawPlayer() {
  const x = player.x - cameraX;
  const y = player.y;

  const squashY = player.grounded ? 1 - player.squash*0.08 : 1;
  const squashX = player.grounded ? 1 + player.squash*0.08 : 1;

  ctx.save();
  ctx.translate(x + player.w/2, y + player.h/2);
  ctx.scale(squashX, squashY);

  ctx.fillStyle = "#57b86f";
  ctx.beginPath();
  ctx.arc(0,2,20,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#2f7d55";
  ctx.beginPath();
  ctx.ellipse(-2,6,19,15,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#77d989";
  ctx.beginPath();
  ctx.arc(player.face*16,-7,13,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(player.face*20,-10,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#183224";
  ctx.beginPath();
  ctx.arc(player.face*21,-10,2,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#f5d66b";
  ctx.beginPath();
  ctx.arc(player.face*25,-3,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = "#fff3a6";
    ctx.beginPath();
    ctx.arc(p.x - cameraX, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGate() {
  const x = 3100 - cameraX;
  const y = 430;
  ctx.fillStyle = "#7b4d2b";
  roundRect(x,y,70,90,18);
  ctx.fill();

  ctx.fillStyle = "#ffe89a";
  ctx.beginPath();
  ctx.arc(x+35,y+42,8,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.font = "12px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("GATE", x+35, y-10);
}

function render(t) {
  drawSky();
  drawForest();
  drawPlatforms();
  drawGate();
  drawBerries(t);
  drawEnemies();
  drawPlayer();
  drawParticles();

  if (player.won) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "900 38px system-ui";
    ctx.fillText("LEVEL COMPLETE", W/2, H/2 - 10);
    ctx.font = "15px system-ui";
    ctx.fillText("Well done!", W/2, H/2 + 24);
  }
}

function loop(now) {
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);
  render(now/1000);
  requestAnimationFrame(loop);
}

resetPlayer();
requestAnimationFrame(loop);
</script>
</body>
</html>
