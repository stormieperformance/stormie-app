<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TINY SHELL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#102315;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:white}
canvas{display:block;width:100vw;height:100vh;background:#8fd6ff}
.ui{position:fixed;top:14px;left:14px;right:14px;z-index:10;display:flex;justify-content:space-between;align-items:start;pointer-events:none}
.title{font-weight:900;letter-spacing:2px;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.score{font-weight:800;font-size:14px;background:rgba(255,255,255,.25);padding:8px 12px;border-radius:999px;backdrop-filter:blur(8px)}
.controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:20}
.left-controls{display:flex;gap:12px}
button{width:64px;height:64px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.28);color:white;font-size:24px;font-weight:900;backdrop-filter:blur(8px);touch-action:none}
.jump{width:78px;height:78px;font-size:15px;letter-spacing:1px}
.message{position:fixed;bottom:105px;left:20px;right:20px;text-align:center;font-size:13px;opacity:.92;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.18)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui">
  <div>
    <div class="title">TINY SHELL</div>
    <div style="font-size:12px;opacity:.85;margin-top:4px;">Level 1: Whispering Forest</div>
  </div>
  <div class="score" id="score">Berries: 0 / 24</div>
</div>

<div class="message" id="message">Move, jump, collect berries, stomp grumpy mushrooms.</div>

<div class="controls">
  <div class="left-controls">
    <button id="left">‹</button>
    <button id="right">›</button>
  </div>
  <button class="jump" id="jump">JUMP</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const messageEl=document.getElementById("message");

let W,H,dpr;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const keys={left:false,right:false,jump:false};
function bindButton(id,key){
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
  b.addEventListener("pointerup",e=>{e.preventDefault();keys[key]=false});
  b.addEventListener("pointerleave",()=>keys[key]=false);
}
bindButton("left","left");bindButton("right","right");bindButton("jump","jump");

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w")keys.jump=true;
});
addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w")keys.jump=false;
});

const world={width:5600,gravity:1800};
let cameraX=0,last=performance.now();

const player={x:80,y:420,w:34,h:40,vx:0,vy:0,speed:390,jump:690,grounded:false,face:1,won:false,squash:0};

const platforms=[
  {x:0,y:520,w:560,h:80},
  {x:640,y:470,w:220,h:34},
  {x:930,y:420,w:240,h:34},
  {x:1260,y:520,w:500,h:80},
  {x:1600,y:405,w:180,h:32},
  {x:1880,y:350,w:250,h:32},
  {x:2220,y:500,w:530,h:80},
  {x:2560,y:420,w:190,h:32},
  {x:2880,y:360,w:210,h:32},
  {x:3190,y:520,w:440,h:80},
  {x:3450,y:610,w:260,h:34,cave:true},
  {x:3800,y:610,w:260,h:34,cave:true},
  {x:4150,y:520,w:420,h:80},
  {x:4480,y:430,w:210,h:32},
  {x:4800,y:365,w:220,h:32},
  {x:5120,y:520,w:600,h:80}
];

const berries=[
  [190,460],[330,460],[690,410],[990,360],[1330,460],[1660,350],
  [1950,295],[2280,440],[2430,440],[2640,365],[2940,305],[3280,460],
  [3520,555],[3650,555],[3860,555],[3980,555],[4240,460],[4380,460],
  [4540,375],[4860,310],[5010,310],[5200,460],[5360,460],[5480,460]
].map(b=>({x:b[0],y:b[1],taken:false,bob:Math.random()*10}));

const enemies=[
  {x:720,y:430,w:34,h:32,vx:55,min:650,max:820,alive:true},
  {x:1420,y:480,w:34,h:32,vx:70,min:1280,max:1700,alive:true},
  {x:2380,y:460,w:34,h:32,vx:65,min:2240,max:2680,alive:true},
  {x:3300,y:480,w:34,h:32,vx:80,min:3200,max:3600,alive:true},
  {x:4300,y:480,w:34,h:32,vx:75,min:4180,max:4540,alive:true},
  {x:5270,y:480,w:34,h:32,vx:90,min:5140,max:5540,alive:true}
];

const particles=[];
const fireflies=[];
for(let i=0;i<60;i++){
  fireflies.push({x:Math.random()*world.width,y:260+Math.random()*320,t:Math.random()*99});
}

function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function resetPlayer(){
  player.x=80;player.y=420;player.vx=0;player.vy=0;player.won=false;
  messageEl.textContent="Move, jump, collect berries, stomp grumpy mushrooms.";
}

function addParticles(x,y,n=12,color="#fff3a6"){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-.5)*240,vy:(Math.random()-1.2)*260,life:.7+Math.random()*.5,r:2+Math.random()*4,color});
  }
}

function update(dt){
  if(player.won)return;

  let move=0;
  if(keys.left)move--;
  if(keys.right)move++;
  player.vx=move*player.speed;
  if(move)player.face=move;

  if(keys.jump&&player.grounded){
    player.vy=-player.jump;
    player.grounded=false;
    player.squash=1;
    addParticles(player.x+player.w/2,player.y+player.h,5);
  }

  player.vy+=world.gravity*dt;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  player.x=Math.max(0,Math.min(world.width-player.w,player.x));
  player.grounded=false;

  for(const p of platforms){
    if(rects(player,p)){
      if(player.vy>=0&&player.y+player.h-player.vy*dt<=p.y+8){
        player.y=p.y-player.h;
        player.vy=0;
        player.grounded=true;
      }
    }
  }

  for(const b of berries){
    if(!b.taken&&Math.hypot(player.x+player.w/2-b.x,player.y+player.h/2-b.y)<34){
      b.taken=true;
      addParticles(b.x,b.y,14);
      messageEl.textContent=b.x>3400&&b.x<4100?"Crystal berry found in the hidden cave.":"Berry collected.";
    }
  }

  for(const e of enemies){
    if(!e.alive)continue;
    e.x+=e.vx*dt;
    if(e.x<e.min||e.x>e.max)e.vx*=-1;

    if(rects(player,e)){
      const stomp=player.vy>0&&player.y+player.h-player.vy*dt<e.y+12;
      if(stomp){
        e.alive=false;
        player.vy=-520;
        addParticles(e.x+e.w/2,e.y+e.h/2,18,"#ffd37a");
        messageEl.textContent="Boop. Mushroom defeated.";
      }else{
        messageEl.textContent="Ouch. Back to the soft moss.";
        addParticles(player.x+player.w/2,player.y+player.h/2,20,"#ffffff");
        resetPlayer();
      }
    }
  }

  if(player.y>850){
    messageEl.textContent="You fell into the soft moss. Try again.";
    resetPlayer();
  }

  if(player.x>3350&&player.x<4100)messageEl.textContent="A hidden cave glows under the forest roots.";
  if(player.x>4450&&player.x<5000)messageEl.textContent="Rain begins to fall. Keep going.";

  const collected=berries.filter(b=>b.taken).length;
  scoreEl.textContent=`Berries: ${collected} / ${berries.length}`;

  if(player.x>5400&&collected>=berries.length){
    player.won=true;
    messageEl.textContent="Level complete. The forest grows stranger ahead.";
    addParticles(player.x,player.y,50,"#ffffff");
  }else if(player.x>5400){
    messageEl.textContent="The forest gate wants every berry first.";
  }

  cameraX+=((player.x-W*.35)-cameraX)*Math.min(1,dt*5);
  cameraX=Math.max(0,Math.min(world.width-W,cameraX));

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;
    if(p.life<=0)particles.splice(i,1);
  }

  player.squash=Math.max(0,player.squash-dt*5);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}

function drawSky(t){
  const dark=Math.min(1,Math.max(0,(cameraX-3100)/1700));
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,dark?"#5fa1c7":"#9ee8ff");
  g.addColorStop(.55,dark?"#7bbf9b":"#c5f3cf");
  g.addColorStop(1,dark?"#386b48":"#6bb36e");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.fillStyle="rgba(255,255,255,.7)";
  for(let i=0;i<8;i++){
    const x=(i*430-cameraX*.15)%(W+260)-160;
    const y=70+(i%3)*38;
    cloud(x,y);
  }

  if(cameraX>4300){
    ctx.strokeStyle="rgba(255,255,255,.35)";
    ctx.lineWidth=1;
    for(let i=0;i<90;i++){
      const x=(i*71+t*160)%W;
      const y=(i*137+t*420)%H;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-10,y+20);ctx.stroke();
    }
  }
}

function cloud(x,y){
  ctx.beginPath();
  ctx.arc(x,y,24,0,Math.PI*2);ctx.arc(x+28,y-8,30,0,Math.PI*2);
  ctx.arc(x+62,y,24,0,Math.PI*2);ctx.arc(x+34,y+12,26,0,Math.PI*2);
  ctx.fill();
}

function drawForest(){
  for(let layer=0;layer<3;layer++){
    const speed=[.25,.4,.65][layer],base=H-[190,150,110][layer];
    ctx.fillStyle=["#4f9866","#36784e","#245d3d"][layer];
    for(let i=0;i<26;i++){
      const x=(i*230-cameraX*speed)%(W+260)-130;
      ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+55,base-170-layer*24);ctx.lineTo(x+110,base);ctx.closePath();ctx.fill();
      ctx.fillRect(x+48,base-20,14,80);
    }
  }
}

function drawCaveOverlay(){
  if(cameraX<3000||cameraX>4200)return;
  ctx.fillStyle="rgba(8,18,30,.55)";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(120,230,255,.13)";
  ctx.beginPath();
  ctx.arc(W*.5,H*.55,260,0,Math.PI*2);
  ctx.fill();
}

function drawPlatforms(){
  for(const p of platforms){
    const x=p.x-cameraX,y=p.y;
    if(x+p.w<-80||x>W+80)continue;
    ctx.fillStyle=p.cave?"#3e3552":"#6b4b2a";
    roundRect(x,y,p.w,p.h,14);ctx.fill();
    ctx.fillStyle=p.cave?"#62d6d0":"#49a85e";
    roundRect(x,y,p.w,22,14);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.18)";
    ctx.fillRect(x+8,y+5,p.w-16,3);
  }
}

function drawBerries(t){
  for(const b of berries){
    if(b.taken)continue;
    const x=b.x-cameraX,y=b.y+Math.sin(t*5+b.bob)*5;
    if(x<-40||x>W+40)continue;
    const cave=b.x>3400&&b.x<4100;
    ctx.fillStyle=cave?"#8df7ff":"#ff5e8a";
    ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.beginPath();ctx.arc(x-4,y-5,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=cave?"#dffcff":"#377d42";
    ctx.beginPath();ctx.ellipse(x+2,y-14,8,4,-.5,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemies(){
  for(const e of enemies){
    if(!e.alive)continue;
    const x=e.x-cameraX,y=e.y;
    if(x<-60||x>W+60)continue;
    ctx.fillStyle="#b96a4a";
    ctx.beginPath();ctx.arc(x+17,y+16,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff0d0";
    ctx.beginPath();ctx.arc(x+10,y+15,3,0,Math.PI*2);ctx.arc(x+24,y+15,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#3b1f18";ctx.fillRect(x+9,y+23,16,3);
  }
}

function drawFireflies(t){
  for(const f of fireflies){
    const x=f.x-cameraX,y=f.y+Math.sin(t*2+f.t)*8;
    if(x<-20||x>W+20)continue;
    const visible=cameraX>2800?0.8:0.35;
    ctx.globalAlpha=visible*(.5+.5*Math.sin(t*4+f.t));
    ctx.fillStyle="#fff6a8";
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawPlayer(){
  const x=player.x-cameraX,y=player.y;
  const sy=player.grounded?1-player.squash*.08:1;
  const sx=player.grounded?1+player.squash*.08:1;
  ctx.save();ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(sx,sy);

  ctx.fillStyle="#57b86f";ctx.beginPath();ctx.arc(0,2,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2f7d55";ctx.beginPath();ctx.ellipse(-2,6,19,15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#77d989";ctx.beginPath();ctx.arc(player.face*16,-7,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="white";ctx.beginPath();ctx.arc(player.face*20,-10,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#183224";ctx.beginPath();ctx.arc(player.face*21,-10,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5d66b";ctx.beginPath();ctx.arc(player.face*25,-3,3,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawGate(){
  const x=5480-cameraX,y=430;
  ctx.fillStyle="#7b4d2b";roundRect(x,y,70,90,18);ctx.fill();
  ctx.fillStyle="#ffe89a";ctx.beginPath();ctx.arc(x+35,y+42,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.5)";
  ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText("GATE",x+35,y-10);
}

function render(t){
  drawSky(t);drawForest();drawCaveOverlay();drawPlatforms();drawGate();drawFireflies(t);
  drawBerries(t);drawEnemies();drawPlayer();drawParticles();

  if(player.won){
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";ctx.textAlign="center";
    ctx.font="900 38px system-ui";ctx.fillText("LEVEL COMPLETE",W/2,H/2-10);
    ctx.font="15px system-ui";ctx.fillText("The forest grows stranger ahead.",W/2,H/2+24);
  }
}

function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render(now/1000);requestAnimationFrame(loop);
}

resetPlayer();
requestAnimationFrame(loop);
</script>
</body>
</html>
