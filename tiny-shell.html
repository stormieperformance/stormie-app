
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>TINY SHELL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#102315;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:white}
canvas{display:block;width:100vw;height:100vh;background:#8fd6ff;touch-action:none}
.ui{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;z-index:10;display:flex;justify-content:space-between;align-items:start;pointer-events:none}
.title{font-weight:900;letter-spacing:2px;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.pill{font-weight:800;font-size:13px;background:rgba(255,255,255,.25);padding:8px 12px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.topright{display:flex;gap:8px;align-items:center;pointer-events:auto}
.iconbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;border:0;background:rgba(255,255,255,.25);color:white;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;touch-action:manipulation}
.controls{position:fixed;inset:0;z-index:20;pointer-events:none}
button{border-radius:999px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.28);color:white;font-weight:900;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;cursor:pointer}
.jump{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:96px;height:96px;font-size:15px;letter-spacing:1px;pointer-events:auto;transition:transform .08s ease,background .08s ease}
.jump:active{transform:scale(.93);background:rgba(255,255,255,.45)}
.message{position:fixed;bottom:max(140px,calc(env(safe-area-inset-bottom) + 140px));left:20px;right:20px;text-align:center;font-size:13px;opacity:.92;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:opacity .4s}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(20,50,40,.55),rgba(8,20,15,.92));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .5s}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{text-align:center;padding:32px 28px;max-width:340px}
.panel h1{font-size:38px;letter-spacing:6px;font-weight:900;margin-bottom:6px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.panel .sub{font-size:12px;opacity:.75;letter-spacing:2px;margin-bottom:24px}
.panel p{font-size:13px;opacity:.85;line-height:1.5;margin-bottom:22px}
.bigbtn{display:inline-block;padding:14px 36px;font-size:14px;letter-spacing:3px;border-radius:999px;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.15);color:white;font-weight:900;cursor:pointer;transition:transform .1s,background .15s}
.bigbtn:active{transform:scale(.96);background:rgba(255,255,255,.3)}
.hint{font-size:11px;opacity:.55;margin-top:18px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
  <div>
    <div class="title">TINY SHELL</div>
    <div style="font-size:12px;opacity:.85;margin-top:4px;">Level 1 · Whispering Forest</div>
  </div>
  <div class="topright">
    <div class="pill" id="score">Berries 0/24</div>
    <button class="iconbtn" id="muteBtn" title="Mute">♪</button>
    <button class="iconbtn" id="restartBtn" title="Restart">↻</button>
  </div>
</div>
<div class="message" id="message"></div>
<div class="controls">
  <button class="jump" id="jump">JUMP</button>
</div>
<div class="overlay" id="menu">
  <div class="panel">
    <h1>TINY SHELL</h1>
    <div class="sub">A WHISPERING FOREST</div>
    <p>Wander. Collect every berry. Boop the grumpy mushrooms. Find the gate.</p>
    <button class="bigbtn" id="startBtn">BEGIN</button>
    <div class="hint">Touch left side to move · Tap JUMP · Keyboard: ← → / Space</div>
  </div>
</div>
<script>
(()=>{
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),messageEl=document.getElementById("message");
const menuEl=document.getElementById("menu"),startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn"),muteBtn=document.getElementById("muteBtn");
const jumpBtn=document.getElementById("jump");

/* ---------- AUDIO ---------- */
let audioCtx=null,masterGain=null,ambientNodes=null,muted=false,audioReady=false;
function initAudio(){
  if(audioCtx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=muted?0:0.7;
    masterGain.connect(audioCtx.destination);
  }catch(e){}
}
function unlockAudio(){
  initAudio();
  if(!audioCtx)return;
  if(audioCtx.state==="suspended"){
    audioCtx.resume().then(()=>{audioReady=true;startAmbient();}).catch(()=>{});
  }else{
    audioReady=true;startAmbient();
  }
}
["pointerdown","touchstart","keydown","click"].forEach(ev=>{
  window.addEventListener(ev,unlockAudio,{passive:true});
});
function tone(freq,duration,type="sine",volume=0.05,attack=0.005){
  if(!audioCtx||!audioReady)return;
  try{
    const t=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(volume,t+attack);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    osc.connect(g);g.connect(masterGain);
    osc.start(t);osc.stop(t+duration+0.02);
  }catch(e){}
}
function noiseBurst(duration=0.15,volume=0.05,filterFreq=800){
  if(!audioCtx||!audioReady)return;
  try{
    const t=audioCtx.currentTime;
    const buf=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*duration),audioCtx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const src=audioCtx.createBufferSource();src.buffer=buf;
    const filt=audioCtx.createBiquadFilter();filt.type="lowpass";filt.frequency.value=filterFreq;
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(volume,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
    src.connect(filt);filt.connect(g);g.connect(masterGain);
    src.start(t);
  }catch(e){}
}
const sfx={
  jump:()=>{tone(380,0.09,"square",0.05);tone(560,0.07,"square",0.03,0.01);},
  land:()=>{noiseBurst(0.08,0.04,500);},
  berry:()=>{tone(880,0.07,"sine",0.06);setTimeout(()=>tone(1320,0.09,"sine",0.05),50);},
  stomp:()=>{tone(180,0.08,"sawtooth",0.06);noiseBurst(0.12,0.05,600);setTimeout(()=>tone(110,0.1,"square",0.04),40);},
  hurt:()=>{tone(260,0.1,"sawtooth",0.06);setTimeout(()=>tone(160,0.18,"sawtooth",0.05),80);},
  fall:()=>{tone(220,0.1,"sawtooth",0.05);setTimeout(()=>tone(140,0.18,"sawtooth",0.05),80);setTimeout(()=>tone(70,0.3,"sawtooth",0.05),180);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.22,"sine",0.06),i*140));}
};
function startAmbient(){
  
function setMuted(m){
  muted=m;
  if(masterGain)masterGain.gain.value=muted?0:0.7;
  muteBtn.textContent=muted?"♪̸":"♪";
}
muteBtn.addEventListener("click",e=>{e.stopPropagation();setMuted(!muted);});

/* ---------- CANVAS ---------- */
let W,H,dpr;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true;
}
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,100));resize();

/* ---------- INPUT ---------- */
const keys={left:false,right:false,jump:false,jumpPressed:false,jumpReleased:false};

// Jump button — pointer events, multitouch safe
let jumpPointerId=null;
function pressJump(e){
  if(e)e.preventDefault();
  if(!keys.jump)keys.jumpPressed=true;
  keys.jump=true;
}
function releaseJump(e){
  if(e)e.preventDefault();
  if(keys.jump)keys.jumpReleased=true;
  keys.jump=false;
  jumpPointerId=null;
}
jumpBtn.addEventListener("pointerdown",e=>{jumpPointerId=e.pointerId;pressJump(e);jumpBtn.setPointerCapture(e.pointerId);},{passive:false});
jumpBtn.addEventListener("pointerup",e=>{if(e.pointerId===jumpPointerId)releaseJump(e);},{passive:false});
jumpBtn.addEventListener("pointercancel",e=>{if(e.pointerId===jumpPointerId)releaseJump(e);},{passive:false});
jumpBtn.addEventListener("contextmenu",e=>e.preventDefault());

// Joystick on left half of screen — separate pointer
let joy={active:false,id:null,cx:0,cy:0,x:0,y:0,dx:0,dy:0};
function isUIElement(el){
  return el && (el===jumpBtn||el===restartBtn||el===muteBtn||el===startBtn||el.closest&&el.closest(".ui,.overlay,.controls button"));
}
canvas.addEventListener("pointerdown",e=>{
  if(isUIElement(e.target))return;
  if(joy.active)return;
  if(e.clientX>W*0.6 && e.pointerType!=="mouse")return;
  joy.active=true;joy.id=e.pointerId;
  joy.cx=joy.x=e.clientX;joy.cy=joy.y=e.clientY;
  joy.dx=joy.dy=0;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
},{passive:false});
function joyMove(e){
  if(!joy.active||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;
  const d=Math.hypot(dx,dy),max=46;
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joy.x=joy.cx+dx;joy.y=joy.cy+dy;joy.dx=dx;joy.dy=dy;
  const dead=8;
  keys.left=dx<-dead;keys.right=dx>dead;
}
function joyEnd(e){
  if(!joy.active||e.pointerId!==joy.id)return;
  joy.active=false;joy.id=null;joy.dx=joy.dy=0;
  keys.left=false;keys.right=false;
}
window.addEventListener("pointermove",joyMove,{passive:false});
window.addEventListener("pointerup",joyEnd,{passive:false});
window.addEventListener("pointercancel",joyEnd,{passive:false});
window.addEventListener("blur",()=>{keys.left=keys.right=keys.jump=false;joy.active=false;joy.id=null;});
document.addEventListener("visibilitychange",()=>{if(document.hidden){keys.left=keys.right=keys.jump=false;joy.active=false;}});

addEventListener("keydown",e=>{
  if(e.repeat)return;
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=true;
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=true;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){keys.jumpPressed=!keys.jump;keys.jump=true;e.preventDefault();}
  if(e.key==="r"||e.key==="R")restart();
  if(e.key==="m"||e.key==="M")setMuted(!muted);
});
addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=false;
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=false;
  if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){keys.jumpReleased=true;keys.jump=false;}
});

/* ---------- WORLD ---------- */
const world={width:5600,gravity:1900};
let cameraX=0,cameraShake=0,last=performance.now(),gameStarted=false,timeAlive=0;
const player={x:80,y:420,w:34,h:40,vx:0,vy:0,speed:400,jump:720,grounded:false,wasGrounded:false,face:1,won:false,squash:0,stretch:0,coyote:0,buffer:0,respawnFlash:0,deaths:0};

const platforms=[
  {x:0,y:520,w:560,h:80},{x:640,y:470,w:220,h:34},{x:930,y:420,w:240,h:34},
  {x:1260,y:520,w:500,h:80},{x:1600,y:405,w:180,h:32},{x:1880,y:350,w:250,h:32},
  {x:2220,y:500,w:530,h:80},{x:2560,y:420,w:190,h:32},{x:2880,y:360,w:210,h:32},
  {x:3190,y:520,w:440,h:80},{x:3450,y:610,w:260,h:34,cave:true},{x:3800,y:610,w:260,h:34,cave:true},
  {x:4150,y:520,w:420,h:80},{x:4480,y:430,w:210,h:32},{x:4800,y:365,w:220,h:32},
  {x:5120,y:520,w:600,h:80}
];
const berriesData=[
  [190,460],[330,460],[690,410],[990,360],[1330,460],[1660,350],
  [1950,295],[2280,440],[2430,440],[2640,365],[2940,305],[3280,460],
  [3520,555],[3650,555],[3860,555],[3980,555],[4240,460],[4380,460],
  [4540,375],[4860,310],[5010,310],[5200,460],[5360,460],[5480,460]
];
let berries=[];
let enemies=[];
const particles=[];
const fireflies=[];
for(let i=0;i<70;i++)fireflies.push({x:Math.random()*world.width,y:240+Math.random()*340,t:Math.random()*99,s:0.6+Math.random()*0.8});
const rainDrops=[];
for(let i=0;i<80;i++)rainDrops.push({x:Math.random()*W,y:Math.random()*H,s:0.5+Math.random()});

function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function setMessage(t){messageEl.textContent=t;messageEl.style.opacity="0.95";}
function resetEntities(){
  berries=berriesData.map(b=>({x:b[0],y:b[1],taken:false,bob:Math.random()*10}));
  enemies=[
    {x:720,y:430,w:34,h:32,vx:55,min:650,max:820,alive:true,bounce:0},
    {x:1420,y:480,w:34,h:32,vx:70,min:1280,max:1700,alive:true,bounce:0},
    {x:2380,y:460,w:34,h:32,vx:65,min:2240,max:2680,alive:true,bounce:0},
    {x:3300,y:480,w:34,h:32,vx:80,min:3200,max:3600,alive:true,bounce:0},
    {x:4300,y:480,w:34,h:32,vx:75,min:4180,max:4540,alive:true,bounce:0},
    {x:5270,y:480,w:34,h:32,vx:90,min:5140,max:5540,alive:true,bounce:0}
  ];
}
function respawnPlayer(soft){
  player.x=80;player.y=420;player.vx=0;player.vy=0;player.won=false;
  player.coyote=0;player.buffer=0;player.respawnFlash=1;
  if(!soft){setMessage("Move, jump, collect berries, stomp grumpy mushrooms.");}
}
function restart(){
  resetEntities();respawnPlayer(false);
  cameraX=0;cameraShake=0;particles.length=0;
  player.deaths=0;
  setMessage("A new walk through the forest.");
}
restartBtn.addEventListener("click",e=>{e.stopPropagation();restart();});
startBtn.addEventListener("click",()=>{
  unlockAudio();
  menuEl.classList.add("hidden");
  gameStarted=true;
  setMessage("Move, jump, collect berries, stomp grumpy mushrooms.");
});

function addParticles(x,y,n=12,color="#fff3a6",spread=1){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-.5)*240*spread,vy:(Math.random()-1.2)*260*spread,life:.6+Math.random()*.6,r:2+Math.random()*4,color,grav:380+Math.random()*120});
  }
}
function addDust(x,y){
  for(let i=0;i<6;i++)particles.push({x:x+(Math.random()-.5)*20,y,vx:(Math.random()-.5)*120,vy:-Math.random()*60,life:.4,r:2+Math.random()*2,color:"rgba(255,255,255,0.6)",grav:60});
}
function shake(amount){cameraShake=Math.min(cameraShake+amount,16);}

/* ---------- UPDATE ---------- */
function update(dt){
  if(!gameStarted)return;
  timeAlive+=dt;

  if(player.respawnFlash>0)player.respawnFlash-=dt*2;

  if(!player.won){
    let move=0;
    if(keys.left)move--;
    if(keys.right)move++;
    const targetVx=move*player.speed;
    player.vx+=(targetVx-player.vx)*Math.min(1,dt*18);
    if(move)player.face=move;

    if(player.grounded)player.coyote=0.1;else player.coyote=Math.max(0,player.coyote-dt);
    if(keys.jumpPressed)player.buffer=0.12;else player.buffer=Math.max(0,player.buffer-dt);
    keys.jumpPressed=false;

    if(player.buffer>0&&player.coyote>0){
      player.vy=-player.jump;
      player.grounded=false;
      player.coyote=0;player.buffer=0;
      player.squash=0;player.stretch=1;
      addDust(player.x+player.w/2,player.y+player.h);
      sfx.jump();
    }
    if(keys.jumpReleased&&player.vy<-260)player.vy=-260;
    keys.jumpReleased=false;

    player.vy+=world.gravity*dt;
    if(player.vy>1100)player.vy=1100;
    player.x+=player.vx*dt;
    player.y+=player.vy*dt;
    player.x=Math.max(0,Math.min(world.width-player.w,player.x));

    player.wasGrounded=player.grounded;
    player.grounded=false;
    for(const p of platforms){
      if(rects(player,p)){
        if(player.vy>=0&&player.y+player.h-player.vy*dt<=p.y+8){
          player.y=p.y-player.h;
          if(player.vy>520){
            player.squash=Math.min(1.2,player.vy/700);
            shake(player.vy/180);
            addDust(player.x+player.w/2,player.y+player.h);
            sfx.land();
          }else if(player.vy>200){
            player.squash=0.5;
          }
          player.vy=0;
          player.grounded=true;
        }
      }
    }

    for(const b of berries){
      if(!b.taken&&Math.hypot(player.x+player.w/2-b.x,player.y+player.h/2-b.y)<32){
        b.taken=true;
        const cave=b.x>3400&&b.x<4100;
        addParticles(b.x,b.y,16,cave?"#8df7ff":"#ffd9e4");
        setMessage(cave?"Crystal berry found.":"Berry collected.");
        sfx.berry();
      }
    }

    for(const e of enemies){
      if(!e.alive){e.bounce=Math.max(0,e.bounce-dt);continue;}
      e.x+=e.vx*dt;
      if(e.x<e.min||e.x>e.max){e.vx*=-1;e.x=Math.max(e.min,Math.min(e.max,e.x));}
      if(rects(player,e)){
        const stomp=player.vy>0&&player.y+player.h-player.vy*dt<e.y+14;
        if(stomp){
          e.alive=false;e.bounce=1;
          player.vy=keys.jump?-560:-420;
          player.squash=0.6;
          addParticles(e.x+e.w/2,e.y+e.h/2,20,"#ffd37a");
          shake(5);
          setMessage("Boop. Mushroom defeated.");
          sfx.stomp();
        }else{
          setMessage("Ouch. Back to the soft moss.");
          addParticles(player.x+player.w/2,player.y+player.h/2,24,"#ffffff");
          shake(8);
          sfx.hurt();
          player.deaths++;
          respawnPlayer(true);
        }
      }
    }

    if(player.y>H+200||player.y>900){
      setMessage("You fell into the soft moss. Try again.");
      sfx.fall();shake(6);
      player.deaths++;
      respawnPlayer(true);
    }

    if(player.x>3350&&player.x<4100&&Math.random()<dt*0.6)setMessage("A hidden cave glows under the forest roots.");
    if(player.x>4450&&player.x<5000&&Math.random()<dt*0.6)setMessage("Rain begins to fall. Keep going.");

    const collected=berries.filter(b=>b.taken).length;
    scoreEl.textContent=`Berries ${collected}/${berries.length}`;
    if(player.x>5400&&collected>=berries.length){
      player.won=true;
      setMessage("Level complete. The forest grows stranger ahead.");
      addParticles(player.x+player.w/2,player.y+player.h/2,60,"#ffffff",1.4);
      shake(10);
      sfx.win();
    }else if(player.x>5400){
      setMessage("The forest gate wants every berry first.");
    }
  }

  const targetCam=player.x-W*.35;
  cameraX+=(targetCam-cameraX)*Math.min(1,dt*5);
  cameraX=Math.max(0,Math.min(world.width-W,cameraX));
  cameraShake*=Math.pow(0.001,dt);

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||400)*dt;p.vx*=Math.pow(0.5,dt);
    if(p.life<=0)particles.splice(i,1);
  }

  player.squash=Math.max(0,player.squash-dt*4);
  player.stretch=Math.max(0,player.stretch-dt*4);
}

/* ---------- RENDER ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
}
function drawSky(t){
  const dark=Math.min(1,Math.max(0,(cameraX-3100)/1700));
  const rainAmt=Math.min(1,Math.max(0,(cameraX-4300)/400));
  const g=ctx.createLinearGradient(0,0,0,H);
  const top=blendColors("#9ee8ff","#5f8aa8",dark*0.6+rainAmt*0.4);
  const mid=blendColors("#c5f3cf","#7bbf9b",dark*0.7);
  const bot=blendColors("#6bb36e","#386b48",dark*0.8);
  g.addColorStop(0,top);g.addColorStop(.55,mid);g.addColorStop(1,bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.65)";
  for(let i=0;i<8;i++){
    const x=(i*430-cameraX*.15)%(W+260)-160;
    const y=70+(i%3)*38;cloud(x,y);
  }
  ctx.fillStyle=`rgba(180,210,200,${0.25+dark*0.2})`;
  for(let i=0;i<10;i++){
    const x=(i*340-cameraX*0.1)%(W+340)-170;
    ctx.beginPath();ctx.arc(x,H-220,180,Math.PI,0);ctx.fill();
  }
  if(rainAmt>0){
    ctx.strokeStyle=`rgba(220,235,245,${0.35*rainAmt})`;
    ctx.lineWidth=1;
    for(const d of rainDrops){
      d.y+=600*0.016*d.s;d.x-=120*0.016*d.s;
      if(d.y>H){d.y=-10;d.x=Math.random()*W+200;}
      if(d.x<-20)d.x=W+20;
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-8,d.y+16);ctx.stroke();
    }
  }
}
function blendColors(a,b,t){
  const pa=hex(a),pb=hex(b);
  const r=Math.round(pa[0]+(pb[0]-pa[0])*t);
  const g=Math.round(pa[1]+(pb[1]-pa[1])*t);
  const bl=Math.round(pa[2]+(pb[2]-pa[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function cloud(x,y){
  ctx.beginPath();
  ctx.arc(x,y,24,0,Math.PI*2);ctx.arc(x+28,y-8,30,0,Math.PI*2);
  ctx.arc(x+62,y,24,0,Math.PI*2);ctx.arc(x+34,y+12,26,0,Math.PI*2);
  ctx.fill();
}
function drawForest(){
  const dark=Math.min(1,Math.max(0,(cameraX-3100)/1700));
  for(let layer=0;layer<3;layer++){
    const speed=[.25,.4,.65][layer],base=H-[190,150,110][layer];
    const baseCol=["#4f9866","#36784e","#245d3d"][layer];
    ctx.fillStyle=blendColors(baseCol,"#1a3a2a",dark*0.6);
    for(let i=0;i<26;i++){
      const x=(i*230-cameraX*speed)%(W+260)-130;
      ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+55,base-170-layer*24);ctx.lineTo(x+110,base);ctx.closePath();ctx.fill();
      ctx.fillRect(x+48,base-20,14,80);
    }
  }
}
function drawCaveOverlay(){
  if(cameraX<3000||cameraX>4200)return;
  const a=Math.min(1,(cameraX-3000)/200)*Math.min(1,(4200-cameraX)/200);
  ctx.fillStyle=`rgba(8,18,30,${0.55*a})`;ctx.fillRect(0,0,W,H);
  const grd=ctx.createRadialGradient(W*.5,H*.55,40,W*.5,H*.55,320);
  grd.addColorStop(0,`rgba(140,240,255,${0.18*a})`);
  grd.addColorStop(1,"rgba(140,240,255,0)");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}
function drawPlatforms(){
  for(const p of platforms){
    const x=p.x-cameraX,y=p.y;
    if(x+p.w<-80||x>W+80)continue;
    ctx.fillStyle=p.cave?"#3e3552":"#6b4b2a";
    roundRect(x,y,p.w,p.h,14);ctx.fill();
    ctx.fillStyle=p.cave?"#62d6d0":"#49a85e";
    roundRect(x,y,p.w,22,14);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.18)";
    ctx.fillRect(x+8,y+5,p.w-16,3);
    if(!p.cave){
      ctx.fillStyle="#5fc278";
      for(let i=20;i<p.w-20;i+=40){
        ctx.beginPath();ctx.moveTo(x+i,y);ctx.lineTo(x+i+3,y-6);ctx.lineTo(x+i+6,y);ctx.closePath();ctx.fill();
      }
    }
  }
}
function drawBerries(t){
  for(const b of berries){
    if(b.taken)continue;
    const x=b.x-cameraX,y=b.y+Math.sin(t*5+b.bob)*5;
    if(x<-40||x>W+40)continue;
    const cave=b.x>3400&&b.x<4100;
    ctx.globalAlpha=0.4+0.2*Math.sin(t*4+b.bob);
    ctx.fillStyle=cave?"#8df7ff":"#ff8db0";
    ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=cave?"#8df7ff":"#ff5e8a";
    ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";
    ctx.beginPath();ctx.arc(x-4,y-4,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=cave?"#dffcff":"#377d42";
    ctx.beginPath();ctx.ellipse(x+2,y-13,8,4,-.5,0,Math.PI*2);ctx.fill();
  }
}
function drawEnemies(t){
  for(const e of enemies){
    const x=e.x-cameraX,y=e.y;
    if(x<-60||x>W+60)continue;
    if(!e.alive){
      if(e.bounce>0){
        ctx.globalAlpha=e.bounce;
        ctx.fillStyle="#b96a4a";
        ctx.beginPath();ctx.arc(x+17,y+30,14,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      continue;
    }
    const wob=Math.sin(t*6+e.x*0.01)*2;
    ctx.fillStyle="#b96a4a";
    ctx.beginPath();ctx.arc(x+17,y+16+wob,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff0d0";
    ctx.beginPath();ctx.arc(x+8,y+8+wob,3,0,Math.PI*2);ctx.arc(x+24,y+5+wob,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+10,y+22,3,0,Math.PI*2);ctx.arc(x+24,y+22,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#3b1f18";
    const eyeDir=e.vx>0?1:-1;
    ctx.beginPath();ctx.arc(x+10+eyeDir,y+22,1.5,0,Math.PI*2);ctx.arc(x+24+eyeDir,y+22,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillRect(x+11,y+27,12,2);
  }
}
function drawFireflies(t){
  for(const f of fireflies){
    const x=f.x-cameraX,y=f.y+Math.sin(t*2+f.t)*8;
    if(x<-20||x>W+20)continue;
    const dark=Math.min(1,Math.max(0,(cameraX-2200)/1400));
    const visible=0.3+dark*0.7;
    ctx.globalAlpha=visible*(.5+.5*Math.sin(t*4+f.t))*f.s;
    ctx.fillStyle="#fff6a8";
    ctx.beginPath();ctx.arc(x,y,3*f.s,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha*=0.4;
    ctx.beginPath();ctx.arc(x,y,8*f.s,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawPlayer(t){
  const x=player.x-cameraX,y=player.y;
  const sq=1-player.squash*0.25, st=1+player.stretch*0.15;
  const sx=1+player.squash*0.18-player.stretch*0.1;
  const sy=sq*st;
  ctx.save();
  if(player.respawnFlash>0)ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(player.respawnFlash*20));
  ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(sx,sy);
  ctx.fillStyle="#57b86f";ctx.beginPath();ctx.arc(0,2,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2f7d55";ctx.beginPath();ctx.ellipse(-2,6,19,15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#77d989";ctx.beginPath();ctx.arc(player.face*16,-7,13,0,Math.PI*2);ctx.fill();
  const blink=(Math.sin(t*0.5)+1)*0.5<0.04?0.2:1;
  ctx.fillStyle="white";ctx.beginPath();ctx.ellipse(player.face*20,-10,4,4*blink,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#183224";ctx.beginPath();ctx.ellipse(player.face*21,-10,2,2*blink,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5d66b";ctx.beginPath();ctx.arc(player.face*25,-3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawGate(){
  const x=5480-cameraX,y=430;
  if(x<-100||x>W+100)return;
  const collected=berries.filter(b=>b.taken).length;
  const open=collected>=berries.length;
  ctx.fillStyle=open?"#a47543":"#7b4d2b";roundRect(x,y,70,90,18);ctx.fill();
  ctx.fillStyle=open?"#fff5b8":"#ffe89a";
  ctx.beginPath();ctx.arc(x+35,y+42,open?12:8,0,Math.PI*2);ctx.fill();
  if(open){
    ctx.globalAlpha=0.4;
    ctx.beginPath();ctx.arc(x+35,y+42,24,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle="rgba(255,255,255,.6)";
  ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(open?"OPEN":"GATE",x+35,y-10);
}
function drawJoystick(){
  if(!joy.active)return;
  ctx.save();
  ctx.globalAlpha=0.3;ctx.fillStyle="white";
  ctx.beginPath();ctx.arc(joy.cx,joy.cy,48,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.55;
  ctx.beginPath();ctx.arc(joy.x,joy.y,24,0,Math.PI*2);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}
function drawVignette(){
  const dark=Math.min(1,Math.max(0,(cameraX-2800)/1800));
  if(dark<=0.05)return;
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,`rgba(0,0,0,${0.55*dark})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function render(t){
  const sx=(Math.random()-0.5)*cameraShake;
  const sy=(Math.random()-0.5)*cameraShake;
  ctx.save();ctx.translate(sx,sy);
  drawSky(t);drawForest();drawCaveOverlay();drawPlatforms();drawGate();
  drawFireflies(t);drawBerries(t);drawEnemies(t);drawPlayer(t);drawParticles();
  drawVignette();
  ctx.restore();
  drawJoystick();

  if(player.won){
    ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";ctx.textAlign="center";
    ctx.font="900 38px system-ui";ctx.fillText("LEVEL COMPLETE",W/2,H/2-10);
    ctx.font="14px system-ui";ctx.globalAlpha=0.85;
    ctx.fillText("The forest grows stranger ahead.",W/2,H/2+22);
    ctx.font="12px system-ui";ctx.globalAlpha=0.6;
    ctx.fillText("Tap ↻ to walk it again.",W/2,H/2+50);
    ctx.globalAlpha=1;
  }
}

function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render(now/1000);
  requestAnimationFrame(loop);
}
resetEntities();respawnPlayer(false);
requestAnimationFrame(loop);
})();
</script>
