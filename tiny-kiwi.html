const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),messageEl=document.getElementById("message");

const restartBtn=document.getElementById("restartBtn"),muteBtn=document.getElementById("muteBtn");
const jumpBtn=document.getElementById("jump");
const levelNameEl=document.getElementById("levelName");
const levelBanner=document.getElementById("levelBanner");

/* ---------- AUDIO ---------- */
let audioCtx=null,masterGain=null,muted=false,audioReady=false;
function initAudio(){
  if(audioCtx)return;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:0.7;masterGain.connect(audioCtx.destination);}catch(e){}
}
function unlockAudio(){
  initAudio();
  if(!audioCtx)return;
  if(audioCtx.state==="suspended"){audioCtx.resume().then(()=>{audioReady=true;}).catch(()=>{});}else{audioReady=true;}
}
["pointerdown","touchstart","keydown","click"].forEach(ev=>window.addEventListener(ev,unlockAudio,{passive:true}));
function tone(freq,duration,type="sine",volume=0.05,attack=0.005){
  if(!audioCtx||!audioReady)return;
  try{const t=audioCtx.currentTime;const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+duration);osc.connect(g);g.connect(masterGain);osc.start(t);osc.stop(t+duration+0.02);}catch(e){}
}
function noiseBurst(duration=0.15,volume=0.05,filterFreq=800){
  if(!audioCtx||!audioReady)return;
  try{const t=audioCtx.currentTime;const buf=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*duration),audioCtx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);const src=audioCtx.createBufferSource();src.buffer=buf;const filt=audioCtx.createBiquadFilter();filt.type="lowpass";filt.frequency.value=filterFreq;const g=audioCtx.createGain();g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(0.0001,t+duration);src.connect(filt);filt.connect(g);g.connect(masterGain);src.start(t);}catch(e){}
}
const sfx={

  land:()=>{noiseBurst(0.08,0.04,500);},

  stomp:()=>{tone(180,0.08,"sawtooth",0.06);noiseBurst(0.12,0.05,600);setTimeout(()=>tone(110,0.1,"square",0.04),40);},

function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;}
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,100));resize();

const keys={left:false,right:false,jump:false,jumpPressed:false,jumpReleased:false};
let jumpPointerId=null;
function pressJump(e){if(e)e.preventDefault();if(!keys.jump)keys.jumpPressed=true;keys.jump=true;}
function releaseJump(e){if(e)e.preventDefault();if(keys.jump)keys.jumpReleased=true;keys.jump=false;jumpPointerId=null;}
jumpBtn.addEventListener("pointerdown",e=>{jumpPointerId=e.pointerId;pressJump(e);jumpBtn.setPointerCapture(e.pointerId);},{passive:false});
jumpBtn.addEventListener("pointerup",e=>{if(e.pointerId===jumpPointerId)releaseJump(e);},{passive:false});
jumpBtn.addEventListener("pointercancel",e=>{if(e.pointerId===jumpPointerId)releaseJump(e);},{passive:false});
jumpBtn.addEventListener("contextmenu",e=>e.preventDefault());
let joy={active:false,id:null,cx:0,cy:0,x:0,y:0,dx:0,dy:0};
function isUIElement(el){return el&&(el===jumpBtn||el===restartBtn||el===muteBtn||el===startBtn||el.closest&&el.closest(".ui,.overlay,.controls button"));}
canvas.addEventListener("pointerdown",e=>{
  if(isUIElement(e.target))return;if(joy.active)return;
  if(e.clientX>W*0.6&&e.pointerType!=="mouse")return;
  joy.active=true;joy.id=e.pointerId;joy.cx=joy.x=e.clientX;joy.cy=joy.y=e.clientY;joy.dx=joy.dy=0;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();
},{passive:false});
function joyMove(e){if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const d=Math.hypot(dx,dy),max=46;if(d>max){dx=dx/d*max;dy=dy/d*max;}joy.x=joy.cx+dx;joy.y=joy.cy+dy;joy.dx=dx;joy.dy=dy;const dead=8;keys.left=dx<-dead;keys.right=dx>dead;}
function joyEnd(e){if(!joy.active||e.pointerId!==joy.id)return;joy.active=false;joy.id=null;joy.dx=joy.dy=0;keys.left=false;keys.right=false;}
window.addEventListener("pointermove",joyMove,{passive:false});
window.addEventListener("pointerup",joyEnd,{passive:false});
window.addEventListener("pointercancel",joyEnd,{passive:false});
window.addEventListener("blur",()=>{keys.left=keys.right=keys.jump=false;joy.active=false;joy.id=null;});
document.addEventListener("visibilitychange",()=>{if(document.hidden){keys.left=keys.right=keys.jump=false;joy.active=false;}});
addEventListener("keydown",e=>{if(e.repeat)return;if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=true;if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=true;if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){keys.jumpPressed=!keys.jump;keys.jump=true;e.preventDefault();}if(e.key==="r"||e.key==="R")restart();if(e.key==="m"||e.key==="M")setMuted(!muted);});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=false;if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=false;if(e.key===" "||e.key==="ArrowUp"||e.key==="w"||e.key==="W"){keys.jumpReleased=true;keys.jump=false;}});

/* ---------- STATE ---------- */

const fireflies=[];for(let i=0;i<80;i++)fireflies.push({x:Math.random()*6000,y:240+Math.random()*340,t:Math.random()*99,s:0.6+Math.random()*0.8});
const snowflakes=[];for(let i=0;i<100;i++)snowflakes.push({x:Math.random()*700,y:Math.random()*H,s:0.5+Math.random()*1.5,sp:0.4+Math.random()*0.8});
const stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random()*6000,y:Math.random()*350,s:0.5+Math.random()*1.5,t:Math.random()*99});
const rainDrops=[];for(let i=0;i<80;i++)rainDrops.push({x:Math.random()*700,y:Math.random()*H,s:0.5+Math.random()});
 
const player={x:80,y:420,w:34,h:40,vx:0,vy:0,speed:400,jump:720,grounded:false,wasGrounded:false,face:1,won:false,squash:0,stretch:0,coyote:0,buffer:0,respawnFlash:0,deaths:0,windForce:0};

function resetEntities(){
  const lvl=getLvl();
  berries=lvl.berries.map(b=>({x:b[0],y:b[1],taken:false,bob:Math.random()*10}));
  enemies=lvl.enemies.map(e=>({...e,w:34,h:32,alive:true,bounce:0}));
  particles.length=0;floatingTexts.length=0;
}
 
function respawnPlayer(soft){
  player.x=80;player.y=420;player.vx=0;player.vy=0;player.won=false;
  player.coyote=0;player.buffer=0;player.respawnFlash=1;player.windForce=0;
  if(!soft){const lvl=getLvl();setMessage(lvl.messages[0]);}
}
 
function loadLevel(idx,fresh){
  currentLevel=idx;
  const lvl=getLvl();
  levelNameEl.textContent=lvl.name;
  scoreEl.textContent=`Berries 0/${lvl.berries.length}`;
  resetEntities();respawnPlayer(false);
  cameraX=0;cameraShake=0;player.deaths=0;
  showBanner(lvl.title,lvl.subtitle);
  if(fresh)setMessage(lvl.messages[0]);
}
 
function restart(){loadLevel(currentLevel,true);}
restartBtn.addEventListener("click",e=>{e.stopPropagation();restart();});
startBtn.addEventListener("click",()=>{unlockAudio();menuEl.classList.add("hidden");gameStarted=true;loadLevel(0,true);});
 
function addParticles(x,y,n=12,color="#fff3a6",spread=1){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*240*spread,vy:(Math.random()-1.2)*260*spread,life:.6+Math.random()*.6,r:2+Math.random()*4,color,grav:380+Math.random()*120});
}
function addDust(x,y){
  for(let i=0;i<6;i++)particles.push({x:x+(Math.random()-.5)*20,y,vx:(Math.random()-.5)*120,vy:-Math.random()*60,life:.4,r:2+Math.random()*2,color:"rgba(255,255,255,0.6)",grav:60});
}
function addFloatingText(x,y,text,color="#fff"){
  floatingTexts.push({x,y,text,color,life:1.5,vy:-60});
}
function shake(amount){cameraShake=Math.min(cameraShake+amount,16);}
 
/* ---------- UPDATE ---------- */
function update(dt){
  if(!gameStarted)return;
  if(showingEnding){endingTimer+=dt;return;}
  timeAlive+=dt;
  const lvl=getLvl();
  if(player.respawnFlash>0)player.respawnFlash-=dt*2;
 
  if(!player.won){
    let move=0;
    if(keys.left)move--;if(keys.right)move++;
 
    // Ice slipperiness
    const friction=lvl.slippery?8:18;
    const targetVx=(move*player.speed)+player.windForce;
    player.vx+=(targetVx-player.vx)*Math.min(1,dt*friction);
    if(move)player.face=move;
 
    // Wind zones
    player.windForce=0;
    if(lvl.windZones){
      for(const z of lvl.windZones){
        if(player.x>z.x&&player.x<z.x+z.w){player.windForce=z.strength;}
      }
    }
 
    if(player.grounded)player.coyote=0.1;else player.coyote=Math.max(0,player.coyote-dt);
    if(keys.jumpPressed)player.buffer=0.12;else player.buffer=Math.max(0,player.buffer-dt);
    keys.jumpPressed=false;
 
    if(player.buffer>0&&player.coyote>0){
      player.vy=-player.jump;player.grounded=false;player.coyote=0;player.buffer=0;
      player.squash=0;player.stretch=1;addDust(player.x+player.w/2,player.y+player.h);sfx.jump();
    }
    if(keys.jumpReleased&&player.vy<-260)player.vy=-260;
    keys.jumpReleased=false;
 
    player.vy+=lvl.gravity*dt;
    if(player.vy>1100)player.vy=1100;
    player.x+=player.vx*dt;player.y+=player.vy*dt;
    player.x=Math.max(0,Math.min(lvl.worldWidth-player.w,player.x));
 
    player.wasGrounded=player.grounded;player.grounded=false;
    for(const p of lvl.platforms){
      if(rects(player,p)){
        if(player.vy>=0&&player.y+player.h-player.vy*dt<=p.y+8){
          player.y=p.y-player.h;
          if(player.vy>520){player.squash=Math.min(1.2,player.vy/700);shake(player.vy/180);addDust(player.x+player.w/2,player.y+player.h);sfx.land();}
          else if(player.vy>200){player.squash=0.5;}
          player.vy=0;player.grounded=true;
        }
      }
    }
 
    // Berries
    for(const b of berries){
      if(!b.taken&&Math.hypot(player.x+player.w/2-b.x,player.y+player.h/2-b.y)<32){
        b.taken=true;
        const color=getBerryColor(lvl.theme);
        addParticles(b.x,b.y,16,color);
        addFloatingText(b.x,b.y-20,"+1",color);
        sfx.berry();
      }
    }
 
    // Enemies
    for(const e of enemies){
      if(!e.alive){e.bounce=Math.max(0,e.bounce-dt);continue;}
      e.x+=e.vx*dt;
      if(e.x<e.min||e.x>e.max){e.vx*=-1;e.x=Math.max(e.min,Math.min(e.max,e.x));}
      if(rects(player,e)){
        const stomp=player.vy>0&&player.y+player.h-player.vy*dt<e.y+14;
        if(stomp){
          e.alive=false;e.bounce=1;
          player.vy=keys.jump?-560:-420;player.squash=0.6;
          addParticles(e.x+e.w/2,e.y+e.h/2,20,getEnemyColor(e.type||"normal"));
          addFloatingText(e.x+17,e.y-10,"BOOP!","#ffd37a");
          shake(5);setMessage("Boop. Mushroom defeated.");sfx.stomp();
        }else{
          setMessage("Ouch. Back to the start.");addParticles(player.x+player.w/2,player.y+player.h/2,24,"#ffffff");
          shake(8);sfx.hurt();player.deaths++;respawnPlayer(true);
        }
      }
    }
 
    // Fall
    if(player.y>H+200||player.y>900){
      setMessage("You tumbled down. Try again.");sfx.fall();shake(6);player.deaths++;respawnPlayer(true);
    }
 
    // Ambient messages by position
    const prog=player.x/lvl.worldWidth;
    if(prog>0.45&&prog<0.55&&Math.random()<dt*0.4)setMessage(lvl.messages[2]);
    if(prog>0.72&&prog<0.85&&Math.random()<dt*0.4)setMessage(lvl.messages[3]);
 
    const collected=berries.filter(b=>b.taken).length;
    scoreEl.textContent=`Berries ${collected}/${berries.length}`;
 
    // Gate check
    const gate={x:lvl.gateX,y:lvl.gateY,w:70,h:90};
    if(rects(player,gate)&&collected>=berries.length){
      player.won=true;
      setMessage(lvl.messages[4]);
      addParticles(player.x+player.w/2,player.y+player.h/2,80,"#ffffff",1.6);
      shake(10);
      if(lvl.isLast){sfx.ending();showingEnding=false;endingTimer=0;}
      else sfx.win();
      setTimeout(()=>{
        if(lvl.isLast){showingEnding=true;}
        else{
          levelTransition=1;
          setTimeout(()=>{loadLevel(currentLevel+1,false);levelTransition=0;},800);
        }
      },1400);
    }else if(rects(player,gate)){
      setMessage(`The gate wants all ${berries.length} berries first.`);
    }
  }
 
  const targetCam=player.x-W*.35;
  cameraX+=(targetCam-cameraX)*Math.min(1,dt*5);
  cameraX=Math.max(0,Math.min(lvl.worldWidth-W,cameraX));
  cameraShake*=Math.pow(0.001,dt);
 
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||400)*dt;p.vx*=Math.pow(0.5,dt);
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floatingTexts.length-1;i>=0;i--){
    const f=floatingTexts[i];f.life-=dt;f.y+=f.vy*dt;f.vy*=Math.pow(0.3,dt);
    if(f.life<=0)floatingTexts.splice(i,1);
  }
  player.squash=Math.max(0,player.squash-dt*4);
  player.stretch=Math.max(0,player.stretch-dt*4);
}
 
function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function getBerryColor(theme){const m={forest:"#ff5e8a",night:"#d4aaff",cave:"#8df7ff",snow:"#aef0ff",ruins:"#ffd37a",sky:"#fff9a0",home:"#ffaa44"};return m[theme]||"#fff3a6";}
function getEnemyColor(type){const m={crystal:"#8df7ff",ice:"#b3e8ff",ghost:"rgba(200,200,255,0.8)",storm:"#c8aaff",normal:"#ffd37a"};return m[type]||"#ffd37a";}
 
/* ---------- RENDER HELPERS ---------- */
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
function blendColors(a,b,t){const pa=hex(a),pb=hex(b);return `rgb(${Math.round(pa[0]+(pb[0]-pa[0])*t)},${Math.round(pa[1]+(pb[1]-pa[1])*t)},${Math.round(pa[2]+(pb[2]-pa[2])*t)})`;}
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function cloud(x,y,scale=1){ctx.beginPath();ctx.arc(x,y,24*scale,0,Math.PI*2);ctx.arc(x+28*scale,y-8*scale,30*scale,0,Math.PI*2);ctx.arc(x+62*scale,y,24*scale,0,Math.PI*2);ctx.arc(x+34*scale,y+12*scale,26*scale,0,Math.PI*2);ctx.fill();}
 
function drawSky(t){
  const lvl=getLvl();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lvl.bgTop);g.addColorStop(.55,lvl.bgMid);g.addColorStop(1,lvl.bgBot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 
  const theme=lvl.theme;
 
  // Stars for night/cave/sky/ruins
  if(theme==="night"||theme==="cave"||theme==="sky"||theme==="ruins"){
    for(const s of stars){
      const x=(s.x-cameraX*.05)%(W+100)-50;
      if(x<-20||x>W+20)continue;
      ctx.globalAlpha=(0.4+0.6*Math.abs(Math.sin(t*1.5+s.t)))*s.s*0.6;
      ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(x,s.y,s.s,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
 
  // Clouds for forest/night/home/sky
  if(theme==="forest"||theme==="night"||theme==="home"){
    ctx.fillStyle=theme==="night"?"rgba(255,255,255,0.12)":"rgba(255,255,255,.65)";
    for(let i=0;i<8;i++){const x=(i*430-cameraX*.15)%(W+260)-160;const y=70+(i%3)*38;cloud(x,y);}
  }
  // Big fluffy clouds for sky level
  if(theme==="sky"){
    ctx.fillStyle="rgba(255,255,255,0.2)";
    for(let i=0;i<10;i++){const x=(i*340-cameraX*.08)%(W+400)-200;cloud(x,80+(i%4)*40,1.4+Math.sin(i)*0.3);}
    // Lightning flash
    if(Math.random()<0.003){
      ctx.fillStyle="rgba(200,220,255,0.12)";ctx.fillRect(0,0,W,H);
      setTimeout(()=>sfx.hurt&&tone(80,0.08,"square",0.03),50);
    }
  }
  // Snow for snow level
  if(theme==="snow"||theme==="home"){
    for(const s of snowflakes){
      s.y+=40*s.sp;s.x-=15*s.sp;
      if(s.y>H+10){s.y=-5;s.x=Math.random()*W;}
      if(s.x<-5){s.x=W+5;}
      ctx.globalAlpha=0.5*s.sp;ctx.fillStyle="#e8f4ff";
      ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // Rain for forest level 2+ area
  if(theme==="forest"&&cameraX>4000){
    const rainAmt=Math.min(1,(cameraX-4000)/400);
    ctx.strokeStyle=`rgba(220,235,245,${0.35*rainAmt})`;ctx.lineWidth=1;
    for(const d of rainDrops){d.y+=600*0.016*d.s;d.x-=120*0.016*d.s;if(d.y>H){d.y=-10;d.x=Math.random()*W+200;}if(d.x<-20)d.x=W+20;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-8,d.y+16);ctx.stroke();}
  }
 
  // Foreground tree layers
  if(theme==="forest"||theme==="home"){
    const homeGold=theme==="home";
    for(let layer=0;layer<3;layer++){
      const speed=[.25,.4,.65][layer],base=H-[190,150,110][layer];
      const cols=homeGold?["#7dc266","#5aaa4a","#3a8a30"]:["#4f9866","#36784e","#245d3d"];
      ctx.fillStyle=cols[layer];
      for(let i=0;i<26;i++){const x=(i*230-cameraX*speed)%(W+260)-130;ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+55,base-170-layer*24);ctx.lineTo(x+110,base);ctx.closePath();ctx.fill();ctx.fillRect(x+48,base-20,14,80);}
    }
  }
  if(theme==="night"){
    for(let layer=0;layer<3;layer++){
      const speed=[.2,.35,.55][layer],base=H-[160,120,90][layer];
      const darkCols=["#1e3d2a","#142b1c","#0c1f12"];
      ctx.fillStyle=darkCols[layer];
      for(let i=0;i<26;i++){const x=(i*230-cameraX*speed)%(W+260)-130;ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+55,base-170-layer*24);ctx.lineTo(x+110,base);ctx.closePath();ctx.fill();ctx.fillRect(x+48,base-20,14,80);}
    }
    // Moon
    const moonX=W*.75-cameraX*.02;
    ctx.fillStyle="rgba(255,245,200,0.9)";ctx.beginPath();ctx.arc(moonX,90,48,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=lvl.bgTop;ctx.beginPath();ctx.arc(moonX+12,80,42,0,Math.PI*2);ctx.fill();
  }
  if(theme==="snow"){
    for(let layer=0;layer<3;layer++){
      const speed=[.2,.35,.55][layer],base=H-[200,160,120][layer];
      const snowCols=["#b8d4e8","#8fb8d0","#6a9ab8"];
      ctx.fillStyle=snowCols[layer];
      for(let i=0;i<20;i++){const x=(i*320-cameraX*speed)%(W+360)-180;ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+80,base-200-layer*30);ctx.lineTo(x+160,base);ctx.closePath();ctx.fill();}
    }
  }
  if(theme==="ruins"){
    for(let layer=0;layer<2;layer++){
      const speed=[.2,.4][layer],base=H-[180,130][layer];
      ctx.fillStyle=["#3a2a10","#281a08"][layer];
      for(let i=0;i<18;i++){
        const x=(i*360-cameraX*speed)%(W+400)-200;
        // Crumbling pillar shapes
        ctx.fillRect(x,base-150,30,150);ctx.fillRect(x+80,base-120,25,120);
        ctx.fillRect(x+150,base-170,35,170);
      }
    }
  }
}
 
function drawPlatforms(){
  const lvl=getLvl();
  for(const p of lvl.platforms){
    const x=p.x-cameraX,y=p.y;
    if(x+p.w<-80||x>W+80)continue;
 
    if(p.ice){
      ctx.fillStyle="#a8d8f0";roundRect(x,y,p.w,p.h,14);ctx.fill();
      ctx.fillStyle="#d4eef8";roundRect(x,y,p.w,20,14);ctx.fill();
      // Ice shine
      ctx.fillStyle="rgba(255,255,255,0.6)";ctx.fillRect(x+8,y+4,p.w-16,3);
      ctx.fillStyle="rgba(255,255,255,0.3)";ctx.fillRect(x+16,y+9,p.w*0.4,2);
    } else if(p.cloud){
      ctx.fillStyle="rgba(200,215,255,0.7)";roundRect(x,y,p.w,p.h,20);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,0.9)";roundRect(x,y,p.w,18,20);ctx.fill();
    } else if(p.ruin){
      ctx.fillStyle="#4a3520";roundRect(x,y,p.w,p.h,6);ctx.fill();
      ctx.fillStyle="#6b5030";roundRect(x,y,p.w,18,6);ctx.fill();
      // Stone pattern
      ctx.fillStyle="rgba(0,0,0,0.15)";
      for(let bx=x+4;bx<x+p.w-4;bx+=24)ctx.fillRect(bx,y+2,20,12);
    } else if(p.cave){
      ctx.fillStyle="#3e3552";roundRect(x,y,p.w,p.h,14);ctx.fill();
      ctx.fillStyle="#62d6d0";roundRect(x,y,p.w,22,14);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(x+8,y+5,p.w-16,3);
    } else {
      // Normal grass
      ctx.fillStyle="#6b4b2a";roundRect(x,y,p.w,p.h,14);ctx.fill();
      ctx.fillStyle=lvl.theme==="home"?"#7dc266":"#49a85e";roundRect(x,y,p.w,22,14);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(x+8,y+5,p.w-16,3);
      ctx.fillStyle=lvl.theme==="home"?"#6db856":"#5fc278";
      for(let i=20;i<p.w-20;i+=40){ctx.beginPath();ctx.moveTo(x+i,y);ctx.lineTo(x+i+3,y-6);ctx.lineTo(x+i+6,y);ctx.closePath();ctx.fill();}
    }
  }
}
 
function drawBerries(t){
  const lvl=getLvl();
  const color=getBerryColor(lvl.theme);
  for(const b of berries){
    if(b.taken)continue;
    const x=b.x-cameraX,y=b.y+Math.sin(t*5+b.bob)*5;
    if(x<-40||x>W+40)continue;
    ctx.globalAlpha=0.4+0.2*Math.sin(t*4+b.bob);
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";ctx.beginPath();ctx.arc(x-4,y-4,3,0,Math.PI*2);ctx.fill();
    // Stem
    if(lvl.theme!=="cave"&&lvl.theme!=="sky"){
      ctx.fillStyle="#377d42";ctx.beginPath();ctx.ellipse(x+2,y-13,8,4,-.5,0,Math.PI*2);ctx.fill();
    }
  }
}
 
function drawEnemies(t){
  const lvl=getLvl();
  for(const e of enemies){
    const x=e.x-cameraX,y=e.y;
    if(x<-60||x>W+60)continue;
    if(!e.alive){
      if(e.bounce>0){ctx.globalAlpha=e.bounce;ctx.fillStyle=getEnemyColor(e.type||"normal");ctx.beginPath();ctx.arc(x+17,y+30,14,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
      continue;
    }
    const wob=Math.sin(t*6+e.x*0.01)*2;
    const type=e.type||"normal";
 
    if(type==="ghost"){
      ctx.globalAlpha=0.7+0.2*Math.sin(t*3+e.x);
      ctx.fillStyle="#c8c8ff";
      ctx.beginPath();ctx.arc(x+17,y+14+wob,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x+28,y+26);ctx.lineTo(x+21,y+32);ctx.lineTo(x+14,y+26);ctx.lineTo(x+7,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle="#3b1f60";ctx.beginPath();ctx.ellipse(x+12+wob*0.5,y+16,2.5,3,0,0,Math.PI*2);ctx.ellipse(x+22+wob*0.5,y+16,2.5,3,0,0,Math.PI*2);ctx.fill();
    } else if(type==="crystal"){
      ctx.fillStyle="#4a3080";ctx.beginPath();ctx.arc(x+17,y+16+wob,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
      ctx.fillStyle="#8df7ff";for(let ci=0;ci<3;ci++){ctx.beginPath();ctx.moveTo(x+6+ci*11,y+2+wob);ctx.lineTo(x+10+ci*11,y-10+wob);ctx.lineTo(x+14+ci*11,y+2+wob);ctx.closePath();ctx.fill();}
      ctx.fillStyle="#fff";ctx.globalAlpha=0.8;ctx.beginPath();ctx.arc(x+11,y+18+wob,2,0,Math.PI*2);ctx.arc(x+23,y+18+wob,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    } else if(type==="ice"){
      ctx.fillStyle="#6ab8d8";ctx.beginPath();ctx.arc(x+17,y+16+wob,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
      ctx.fillStyle="#d4f0ff";ctx.beginPath();ctx.arc(x+17,y+16+wob,12,Math.PI,0);ctx.fill();
      ctx.fillStyle="#1a5a7a";ctx.beginPath();ctx.ellipse(x+12,y+20+wob,2.5,3.5,0,0,Math.PI*2);ctx.ellipse(x+22,y+20+wob,2.5,3.5,0,0,Math.PI*2);ctx.fill();
    } else if(type==="storm"){
      ctx.fillStyle="#5a3880";ctx.beginPath();ctx.arc(x+17,y+16+wob,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
      ctx.fillStyle="#ffe060";ctx.beginPath();ctx.moveTo(x+18,y+2+wob);ctx.lineTo(x+12,y+16+wob);ctx.lineTo(x+17,y+16+wob);ctx.lineTo(x+11,y+30+wob);ctx.lineTo(x+22,y+14+wob);ctx.lineTo(x+17,y+14+wob);ctx.closePath();ctx.fill();
    } else {
      // Normal mushroom (original)
      ctx.fillStyle="#b96a4a";ctx.beginPath();ctx.arc(x+17,y+16+wob,18,Math.PI,0);ctx.lineTo(x+35,y+32);ctx.lineTo(x,y+32);ctx.closePath();ctx.fill();
      ctx.fillStyle="#fff0d0";ctx.beginPath();ctx.arc(x+8,y+8+wob,3,0,Math.PI*2);ctx.arc(x+24,y+5+wob,4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+10,y+22,3,0,Math.PI*2);ctx.arc(x+24,y+22,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#3b1f18";const eyeDir=e.vx>0?1:-1;ctx.beginPath();ctx.arc(x+10+eyeDir,y+22,1.5,0,Math.PI*2);ctx.arc(x+24+eyeDir,y+22,1.5,0,Math.PI*2);ctx.fill();ctx.fillRect(x+11,y+27,12,2);
    }
  }
}
 
function drawFireflies(t){
  const lvl=getLvl();
  const visible=lvl.theme==="night"||lvl.theme==="cave"||lvl.theme==="ruins";
  if(!visible)return;
  for(const f of fireflies){
    const x=(f.x-cameraX)%(W+200)-100,y=f.y+Math.sin(t*2+f.t)*8;
    if(x<-20||x>W+20)continue;
    ctx.globalAlpha=(.5+.5*Math.sin(t*4+f.t))*f.s;
    ctx.fillStyle=lvl.theme==="cave"?"#a8ffff":lvl.theme==="ruins"?"#ffcc44":"#fff6a8";
    ctx.beginPath();ctx.arc(x,y,3*f.s,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha*=0.4;ctx.beginPath();ctx.arc(x,y,8*f.s,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
 
function drawPlayer(t){
  const x=player.x-cameraX,y=player.y;
  const sq=1-player.squash*0.25,st=1+player.stretch*0.15;
  const sx=1+player.squash*0.18-player.stretch*0.1,sy=sq*st;
  ctx.save();
  if(player.respawnFlash>0)ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(player.respawnFlash*20));
  ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(sx,sy);
  // Home level kiwi glows golden
  const lvl=getLvl();
  if(lvl.theme==="home"){
    ctx.globalAlpha*=0.3;ctx.fillStyle="#ffcc44";ctx.beginPath();ctx.arc(0,2,28,0,Math.PI*2);ctx.fill();ctx.globalAlpha=player.respawnFlash>0?0.4+0.6*Math.abs(Math.sin(player.respawnFlash*20)):1;
  }
  ctx.fillStyle="#57b86f";ctx.beginPath();ctx.arc(0,2,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2f7d55";ctx.beginPath();ctx.ellipse(-2,6,19,15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#77d989";ctx.beginPath();ctx.arc(player.face*16,-7,13,0,Math.PI*2);ctx.fill();
  const blink=(Math.sin(t*0.5)+1)*0.5<0.04?0.2:1;
  ctx.fillStyle="white";ctx.beginPath();ctx.ellipse(player.face*20,-10,4,4*blink,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#183224";ctx.beginPath();ctx.ellipse(player.face*21,-10,2,2*blink,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5d66b";ctx.beginPath();ctx.arc(player.face*25,-3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
 
function drawGate(){
  const lvl=getLvl();
  const x=lvl.gateX-cameraX,y=lvl.gateY;
  if(x<-100||x>W+100)return;
  const collected=berries.filter(b=>b.taken).length;
  const open=collected>=berries.length;
  // Last level gets a nest
  if(lvl.isLast){
    ctx.fillStyle="#8b6030";
    for(let i=0;i<8;i++){ctx.beginPath();ctx.ellipse(x+35,y+60,38+i*2,18,Math.sin(i*0.8)*0.3,0,Math.PI*2);ctx.stroke();}
    ctx.strokeStyle="#6b4020";ctx.lineWidth=3;
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(x+35+Math.cos(a)*20,y+60+Math.sin(a)*10);ctx.lineTo(x+35+Math.cos(a)*40,y+40+Math.sin(a)*20);ctx.stroke();}
    ctx.fillStyle=open?"#ffdd44":"rgba(255,220,50,0.4)";ctx.beginPath();ctx.arc(x+35,y+45,open?16:10,0,Math.PI*2);ctx.fill();
    if(open){ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(x+35,y+45,28,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
    ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(open?"HOME":"NEST",x+35,y-12);
  } else {
    ctx.fillStyle=open?"#a47543":"#7b4d2b";roundRect(x,y,70,90,18);ctx.fill();
    ctx.fillStyle=open?"#fff5b8":"#ffe89a";ctx.beginPath();ctx.arc(x+35,y+42,open?12:8,0,Math.PI*2);ctx.fill();
    if(open){ctx.globalAlpha=0.4;ctx.beginPath();ctx.arc(x+35,y+42,24,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
    ctx.fillStyle="rgba(255,255,255,.6)";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(open?"OPEN":"GATE",x+35,y-10);
  }
}
 
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
 
function drawFloatingTexts(){
  for(const f of floatingTexts){
    ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.color;
    ctx.font="900 14px system-ui";ctx.textAlign="center";
    ctx.fillText(f.text,f.x-cameraX,f.y);
  }
  ctx.globalAlpha=1;
}
 
function drawWindZones(){
  const lvl=getLvl();
  if(!lvl.windZones)return;
  for(const z of lvl.windZones){
    const x=z.x-cameraX;if(x+z.w<0||x>W)continue;
    ctx.fillStyle=`rgba(200,220,255,0.04)`;ctx.fillRect(x,0,z.w,H);
    ctx.fillStyle=`rgba(200,220,255,0.18)`;ctx.font="18px system-ui";ctx.textAlign="center";
    ctx.fillText(z.strength>0?"→":"←",x+z.w/2,H/2);
  }
}
 
function drawJoystick(){
  if(!joy.active)return;
  ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle="white";
  ctx.beginPath();ctx.arc(joy.cx,joy.cy,48,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.55;ctx.beginPath();ctx.arc(joy.x,joy.y,24,0,Math.PI*2);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}
 
function drawVignette(){
  const lvl=getLvl();
  const dark=["night","cave","ruins","sky"].includes(lvl.theme)?0.7:Math.min(1,Math.max(0,(cameraX-2800)/1800))*0.55;
  if(dark<=0.05)return;
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,`rgba(0,0,0,${dark})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
 
function drawLevelProgress(){
  // Level dots at top center
  const dots=LEVELS.length;const dotSize=6,gap=14;const totalW=(dots-1)*gap;
  const startX=W/2-totalW/2;const y=max(24,16);
  for(let i=0;i<dots;i++){
    const done=i<currentLevel,current=i===currentLevel;
    ctx.globalAlpha=done?0.9:current?1:0.3;
    ctx.fillStyle=done?"#ffd37a":current?"#ffffff":"#ffffff";
    ctx.beginPath();ctx.arc(startX+i*gap,30,done?4:current?5:3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function max(a,b){return a>b?a:b;}
 
function drawEnding(t){
  // Fade in
  const fade=Math.min(1,endingTimer/1.5);
  ctx.fillStyle=`rgba(0,0,0,${fade*0.7})`;ctx.fillRect(0,0,W,H);
  if(endingTimer<0.8)return;
 
  const a=Math.min(1,(endingTimer-0.8)/1.2);
  ctx.globalAlpha=a;
 
  // Golden glow
  const grd=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,300);
  grd.addColorStop(0,"rgba(255,200,50,0.25)");grd.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
 
  // Kiwi at center
  ctx.save();ctx.translate(W/2,H/2-60);const bob=Math.sin(t*2)*6;ctx.translate(0,bob);
  ctx.scale(2,2);
  ctx.fillStyle="#57b86f";ctx.beginPath();ctx.arc(0,2,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2f7d55";ctx.beginPath();ctx.ellipse(-2,6,19,15,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#77d989";ctx.beginPath();ctx.arc(16,-7,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="white";ctx.beginPath();ctx.ellipse(20,-10,4,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#183224";ctx.beginPath();ctx.ellipse(21,-10,2,2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f5d66b";ctx.beginPath();ctx.arc(25,-3,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
 
  // Stars/particles around kiwi
  for(let i=0;i<12;i++){
    const a2=i/12*Math.PI*2+t*0.5;
    const r=80+Math.sin(t*2+i)*15;
    const sx=W/2+Math.cos(a2)*r,sy=H/2-60+Math.sin(a2)*r*0.5;
    ctx.fillStyle="#ffd37a";ctx.globalAlpha=a*(0.4+0.4*Math.sin(t*3+i));
    ctx.beginPath();ctx.arc(sx,sy,3+Math.sin(t*2+i)*2,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=a;
 
  ctx.fillStyle="white";ctx.textAlign="center";
  if(endingTimer>2.5){
    const ta=Math.min(1,(endingTimer-2.5)/1.0);ctx.globalAlpha=a*ta;
    ctx.font="900 32px system-ui";ctx.fillText("HOME.",W/2,H/2+50);
  }
  if(endingTimer>4.0){
    const ta=Math.min(1,(endingTimer-4.0)/1.2);ctx.globalAlpha=a*ta;
    ctx.font="14px system-ui";ctx.fillText("Seven worlds. Every berry. All the way home.",W/2,H/2+84);
  }
  if(endingTimer>6.0){
    const ta=Math.min(1,(endingTimer-6.0)/1.0);ctx.globalAlpha=a*ta;
    ctx.font="11px system-ui";ctx.globalAlpha*=0.6;
    ctx.fillText("Tap ↻ to walk it all again.",W/2,H/2+116);
  }
  ctx.globalAlpha=1;
}
 
function render(t){
  const sx=(Math.random()-0.5)*cameraShake,sy=(Math.random()-0.5)*cameraShake;
  ctx.save();ctx.translate(sx,sy);
  drawSky(t);drawWindZones();drawPlatforms();drawGate();
  drawFireflies(t);drawBerries(t);drawEnemies(t);drawPlayer(t);drawParticles();drawFloatingTexts();
  drawVignette();
  ctx.restore();
  drawJoystick();
  drawLevelProgress();
 
  if(showingEnding){drawEnding(t);return;}
 
  if(player.won&&!showingEnding){
    const lvl=getLvl();
    ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";ctx.textAlign="center";
    ctx.font="900 32px system-ui";ctx.fillText(lvl.isLast?"YOU'RE HOME":"LEVEL COMPLETE",W/2,H/2-10);
    ctx.font="14px system-ui";ctx.globalAlpha=0.85;
    ctx.fillText(lvl.isLast?"The nest was always waiting.":getLvl().messages[4],W/2,H/2+22);
    if(!lvl.isLast){ctx.font="12px system-ui";ctx.globalAlpha=0.6;ctx.fillText("Next world loading…",W/2,H/2+50);}
    ctx.globalAlpha=1;
  }
 
  if(levelTransition>0){
    ctx.fillStyle=`rgba(0,0,0,${levelTransition})`;ctx.fillRect(0,0,W,H);
  }
}
 
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render(now/1000);
  requestAnimationFrame(loop);
}
resetEntities();respawnPlayer(false);
requestAnimationFrame(loop);
})();
</script>
</body>
